<style>
  /* /compare (Carter, 2026-10-17: head-to-head with a friend). Two riders side
     by side: what they share, who leads on each manufacturer, how much their
     rankings agree, and the rides only one of them has. ?a=<slug>&b=<slug>;
     a defaults to you. A is the site's teal, B red, as on the map's compare. */
  .cmp{max-width:820px;--a:var(--accent2);--b:#e5484d}
  .pick{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;margin:0 0 16px}
  .pick select{width:100%;min-width:0;background-color:var(--panel);border:1px solid var(--line);color:var(--fg);
    padding:10px 12px;border-radius:10px;font-size:.9rem;cursor:pointer}
  .pick .vs{flex:none;color:var(--muted);font-weight:800;font-size:.85rem}
  .duo{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:0 0 16px;
    background-color:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 14px}
  .duo .side{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;gap:4px}
  .duo .av{width:64px;height:64px;border-radius:50%;background-color:var(--soft);background-size:cover;background-position:center;
    background-origin:border-box;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.5rem;color:var(--muted);
    border:3px solid var(--a)}
  .duo .side.b .av{border-color:var(--b)}
  .duo a.nm{color:var(--fg);font-weight:800;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .duo a.nm:hover{color:var(--accent2)}
  .duo .ct{color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums}
  .duo .ct b{color:var(--fg)}
  .duo .mid{color:var(--muted);font-weight:800;font-size:.95rem}
  .ka{color:var(--a)} .kb{color:var(--b)}
  /* Head-to-head bars: A's count grows left from the middle, B's right. */
  .h2h{border:1px solid var(--line);border-radius:14px;background-color:var(--panel);overflow:hidden}
  .h2h .r{display:grid;grid-template-columns:2.2em 1fr minmax(84px,auto) 1fr 2.2em;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--soft);font-size:.88rem}
  .h2h .r:last-child{border-bottom:0}
  .h2h .n{font-weight:800;font-variant-numeric:tabular-nums}
  .h2h .n.a{text-align:right;color:var(--a)} .h2h .n.b{color:var(--b)}
  .h2h .n.lose{opacity:.55}
  .h2h .bar{height:8px;border-radius:4px;background-color:var(--soft);position:relative;overflow:hidden}
  .h2h .bar i{position:absolute;top:0;bottom:0;border-radius:4px}
  .h2h .bar.a i{right:0;background-color:var(--a)} .h2h .bar.b i{left:0;background-color:var(--b)}
  .h2h .lbl{text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .h2h .lbl a{color:var(--fg);text-decoration:none} .h2h .lbl a:hover{color:var(--accent2)}
  .lead{color:var(--muted);font-size:.9rem;margin:-4px 0 10px}
  .lead b{color:var(--fg)}
  /* Records: one row per record, each rider's ride and number. */
  .recs{border:1px solid var(--line);border-radius:14px;background-color:var(--panel);overflow:hidden}
  .recs .r{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--soft)}
  .recs .r:last-child{border-bottom:0}
  .recs .h{grid-column:1 / -1;padding:8px 14px 0;color:var(--muted);font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .recs .c{padding:4px 14px 10px;min-width:0}
  .recs .c b{display:block;font-variant-numeric:tabular-nums;font-size:1.05rem}
  .recs .c.a b{color:var(--a)} .recs .c.b b{color:var(--b)}
  .recs .c.lose b{opacity:.55}
  .recs .c a{color:var(--muted);font-size:.82rem;text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .recs .c a:hover{color:var(--accent2)}
  /* Rankings. */
  .agree{border:1px solid var(--line);border-radius:14px;background-color:var(--panel);padding:16px}
  .agree .big{font-size:2rem;font-weight:800;color:var(--accent2);line-height:1}
  .agree .big small{font-size:.9rem;color:var(--muted);font-weight:600;margin-left:6px}
  .agree h4{margin:16px 0 6px;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .agree ul{list-style:none;margin:0;padding:0}
  .agree li{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-top:1px solid var(--soft);font-size:.9rem}
  .agree li a{color:var(--fg);text-decoration:none;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .agree li a:hover{color:var(--accent2)}
  .agree li span{flex:none;font-variant-numeric:tabular-nums;font-size:.84rem}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
  .tabs button{background-color:transparent;border:1px solid var(--line);border-radius:999px;color:var(--muted);
    padding:7px 14px;font:inherit;font-size:.86rem;font-weight:600;cursor:pointer}
  .tabs button.on{background-color:var(--soft);color:var(--fg);border-color:var(--soft)}
  .none{color:var(--muted);padding:14px 16px;margin:0}
  .empty{border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted);text-align:center;line-height:1.5}
  @media (max-width:520px){
    .duo{padding:14px 8px;gap:6px} .duo .av{width:52px;height:52px;font-size:1.2rem}
    .h2h .r{grid-template-columns:1.8em 1fr minmax(70px,auto) 1fr 1.8em;gap:6px;padding:8px 8px;font-size:.82rem}
  }
</style>
</head>

</div></section>

<footer class="site"><div class="container foot-inner">
  <div>&copy; <span id="y"></span> Coaster Hub &middot; coasterhub.org</div>
  <div><a href="/">Home</a> &nbsp;&middot;&nbsp; <a href="/coasters">Coasters</a> &nbsp;&middot;&nbsp; <a href="/parks">Parks</a> &nbsp;&middot;&nbsp; <a href="/manufacturers">Manufacturers</a> &nbsp;&middot;&nbsp; <a href="/locations">Locations</a> &nbsp;&middot;&nbsp; <a href="/map">Map</a> &nbsp;&middot;&nbsp; <a href="/sitemap">Sitemap</a><span data-contrib hidden></span></div>
</div></footer>

<script src="/app.js?v=20261030r"></script>
<script>
document.getElementById('y').textContent=new Date().getFullYear();
CoasterHub.initNav('compare');
var $=function(id){ return document.getElementById(id); };
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var Q=new URLSearchParams(location.search);

Promise.all([
  CoasterHub.fetchCoasters(), CoasterHub.fetchUsers().catch(function(){ return []; }),
  CoasterHub.fetchAllRides(), CoasterHub.fetchAllRankings().catch(function(){ return []; }),
  CoasterHub.me().catch(function(){ return null; })
]).then(function(r){
  var list=r[0], users=(r[1]&&r[1].length?r[1]:CoasterHub.USERS)||[], allRides=r[2]||[], ranks=r[3]||[], acct=r[4];
  var me=acct&&acct.slug;
  var byId={}; (list.coasters||[]).forEach(function(c){ byId[c.id]=c; });
  var KEY=function(c){ return CoasterHub.rideKey(c); };
  var RIDES={}; allRides.forEach(function(x){ RIDES[x.slug]=x; });
  var RANK={}; ranks.forEach(function(x){ RANK[x.slug]=x.order||[]; });
  var U={}; users.forEach(function(u){ U[u.slug]=u; });
  var a=Q.get('a') || me || '', b=Q.get('b') || Q.get('with') || '';
  if(a===b) b='';

  // One rider: a credit per ride key, the row that stands for it (the first
  // one ridden), and the first date it was ridden, when the log has one.
  function rider(slug){
    if(!slug) return null;
    var log=RIDES[slug], u=U[slug]||{};
    var o={ slug:slug, name:u.name||(log&&log.user)||slug, u:u, keys:{}, rep:{}, first:{}, parks:{} };
    ((log&&log.rides)||[]).forEach(function(x){
      var c=byId[x.c]; if(!c) return;
      var k=KEY(c); o.keys[k]=1; if(!o.rep[k]) o.rep[k]=c;
      if(x.d && (!o.first[k] || x.d<o.first[k])) o.first[k]=x.d;
      if(c.park) o.parks[c.park]=1;
    });
    o.n=Object.keys(o.keys).length; o.np=Object.keys(o.parks).length;
    return o;
  }

  function options(sel, cur, skip){
    var friends=sel.__f||[], inF={}; friends.forEach(function(s){ inF[s]=1; });
    var us=users.slice().sort(function(x,y){ return String(x.name).localeCompare(String(y.name)); });
    var opt=function(u){ return '<option value="'+esc(u.slug)+'"'+(u.slug===skip?' disabled':'')+'>'+esc(u.name||u.slug)+(u.slug===me?' (you)':'')+'</option>'; };
    var f=us.filter(function(u){ return inF[u.slug] || u.slug===me; }), rest=us.filter(function(u){ return !inF[u.slug] && u.slug!==me; });
    sel.innerHTML='<option value="">Pick a rider&hellip;</option>'
      +(f.length?'<optgroup label="You &amp; friends">'+f.map(opt).join('')+'</optgroup>':'')
      +'<optgroup label="'+(f.length?'Everyone else':'Riders')+'">'+rest.map(opt).join('')+'</optgroup>';
    sel.value=cur||'';
  }
  function go(){
    var qs=[]; if(a) qs.push('a='+encodeURIComponent(a)); if(b) qs.push('b='+encodeURIComponent(b));
    history.replaceState(null,'',location.pathname+(qs.length?'?'+qs.join('&'):''));
    options($('pa'), a, b); options($('pb'), b, a);
    draw();
  }
  $('pa').onchange=function(){ a=this.value; go(); };
  $('pb').onchange=function(){ b=this.value; go(); };

  var MINE=null;   // the reader's own credits, for the add ring on the lists
  function draw(){
    var A=rider(a), B=rider(b);
    if(!A || !B){
      $('hero_h').textContent='Compare';
      $('out').innerHTML='<div class="empty">Pick '+(A?'someone to compare '+esc(A.slug===me?'yourself':A.name)+' with':'two riders')+' above.</div>';
      return;
    }
    $('hero_h').innerHTML=esc(A.name)+' <span style="color:var(--muted);font-weight:600">vs</span> '+esc(B.name);
    document.title=A.name+' vs '+B.name+' — Coaster Hub';
    var both=[], onlyA=[], onlyB=[];
    Object.keys(A.keys).forEach(function(k){ (B.keys[k]?both:onlyA).push(A.rep[k]); });
    Object.keys(B.keys).forEach(function(k){ if(!A.keys[k]) onlyB.push(B.rep[k]); });
    var parksBoth=Object.keys(A.parks).filter(function(p){ return B.parks[p]; }).length;
    var h='';

    // The two of them.
    var face=function(R, side){
      var pic=R.u.avatar ? ' style="background-image:url(&quot;/avatars/'+esc(encodeURIComponent(R.u.avatar))+'&quot;)"' : '';
      return '<div class="side '+side+'"><span class="av"'+pic+'>'+(R.u.avatar?'':esc(String(R.name).charAt(0).toUpperCase()))+'</span>'
        +'<a class="nm" href="'+esc(CoasterHub.userPageHref(R.slug,'profile'))+'">'+esc(R.name)+'</a>'
        +'<span class="ct"><b>'+R.n.toLocaleString()+'</b> credits &middot; <b>'+R.np.toLocaleString()+'</b> parks</span></div>';
    };
    h+='<div class="duo">'+face(A,'a')+'<span class="mid">vs</span>'+face(B,'b')+'</div>';
    var tl=function(v,l){ return '<div class="tile"><b>'+v+'</b><span>'+l+'</span></div>'; };
    h+='<div class="tiles">'+tl(both.length.toLocaleString(),'Credits in common')
      +tl('<span class="ka">'+onlyA.length.toLocaleString()+'</span>','Only '+esc(A.name))
      +tl('<span class="kb">'+onlyB.length.toLocaleString()+'</span>','Only '+esc(B.name))
      +tl(parksBoth.toLocaleString(),'Parks in common')+'</div>';

    // Who rode it first: shared credits where both logs have a date.
    var fa=0, fb=0;
    both.forEach(function(c){ var k=KEY(c), x=A.first[k], y=B.first[k]; if(x&&y&&x!==y){ if(x<y) fa++; else fb++; } });
    if(fa+fb) h+='<p class="lead">Rode it first, of the rides you share: <b class="ka">'+esc(A.name)+' '+fa+'</b> &middot; <b class="kb">'+esc(B.name)+' '+fb+'</b></p>';

    // Rankings: the share of pairs both put in the same order, the biggest
    // splits, and what both have near the top.
    var at=function(order){ var o={}, n=0; order.forEach(function(id){ var c=byId[id]; if(!c) return; var k=KEY(c); if(o[k]==null) o[k]=n++; }); return { o:o, n:n }; };
    var RA=at(RANK[A.slug]||[]), RB=at(RANK[B.slug]||[]);
    var sh=Object.keys(RA.o).filter(function(k){ return RB.o[k]!=null; });
    h+='<div class="sect">Rankings</div>';
    if(sh.length<5){
      h+='<div class="agree"><p class="none" style="padding:0">Not enough rides ranked by both yet &mdash; '+sh.length+' in common, 5 needed.</p></div>';
    } else {
      var same=0, pairs=0;
      for(var i=0;i<sh.length;i++) for(var j=i+1;j<sh.length;j++){ pairs++; if((RA.o[sh[i]]-RA.o[sh[j]])*(RB.o[sh[i]]-RB.o[sh[j]])>0) same++; }
      var rep=function(k){ return A.rep[k] || B.rep[k] || byId[k]; };
      var link=function(k){ var c=rep(k); return '<a href="'+esc(CoasterHub.coasterHref(c))+'">'+esc(c.name)+'</a>'; };
      var pos=function(k){ return '<span><b class="ka">#'+(RA.o[k]+1)+'</b> &middot; <b class="kb">#'+(RB.o[k]+1)+'</b></span>'; };
      var split=sh.map(function(k){ return { k:k, d:Math.abs(RA.o[k]/RA.n - RB.o[k]/RB.n) }; }).sort(function(x,y){ return y.d-x.d; }).filter(function(x){ return x.d>=0.15; }).slice(0,3);
      var love=sh.filter(function(k){ return RA.o[k] < Math.max(10, RA.n*0.1) && RB.o[k] < Math.max(10, RB.n*0.1); })
        .sort(function(x,y){ return (RA.o[x]+RB.o[x])-(RA.o[y]+RB.o[y]); }).slice(0,5);
      h+='<div class="agree"><div class="big">'+Math.round(same/pairs*100)+'%<small>agreement on '+sh.length+' rides both ranked</small></div>'
        +(love.length?'<h4>Both love</h4><ul>'+love.map(function(k){ return '<li>'+link(k)+pos(k)+'</li>'; }).join('')+'</ul>':'')
        +(split.length?'<h4>Biggest splits</h4><ul>'+split.map(function(x){ return '<li>'+link(x.k)+pos(x.k)+'</li>'; }).join('')+'</ul>':'')
        +'</div>';
    }

    // Manufacturers, head to head.
    var M={};
    [[A,'a'],[B,'b']].forEach(function(p){ Object.keys(p[0].keys).forEach(function(k){ var m=p[0].rep[k].manu; if(!m) return; (M[m]=M[m]||{a:0,b:0})[p[1]]++; }); });
    var ms=Object.keys(M).sort(function(x,y){ return (M[y].a+M[y].b)-(M[x].a+M[x].b) || x.localeCompare(y); });
    if(ms.length){
      var wa=ms.filter(function(m){ return M[m].a>M[m].b; }).length, wb=ms.filter(function(m){ return M[m].b>M[m].a; }).length;
      var top=ms.slice(0,12), max=top.reduce(function(m,k){ return Math.max(m,M[k].a,M[k].b); },1);
      h+='<div class="sect">Manufacturers</div><p class="lead">More credits on <b class="ka">'+wa+'</b> for '+esc(A.name)+', <b class="kb">'+wb+'</b> for '+esc(B.name)+(ms.length-wa-wb?', '+(ms.length-wa-wb)+' tied':'')+'.</p>'
        +'<div class="h2h">'+top.map(function(m){ var x=M[m];
          return '<div class="r"><span class="n a'+(x.a<x.b?' lose':'')+'">'+x.a+'</span><span class="bar a"><i style="width:'+(x.a/max*100)+'%"></i></span>'
            +'<span class="lbl"><a href="'+esc(CoasterHub.makerHref(m))+'">'+esc(m)+'</a></span>'
            +'<span class="bar b"><i style="width:'+(x.b/max*100)+'%"></i></span><span class="n b'+(x.b<x.a?' lose':'')+'">'+x.b+'</span></div>'; }).join('')+'</div>';
    }

    // Records: each rider's biggest of each, the winner in full colour.
    var best=function(R, f){ var w=null; Object.keys(R.keys).forEach(function(k){ var c=R.rep[k], v=f(c); if(v!=null && v>0 && (!w || v>w.v)) w={ c:c, v:v }; }); return w; };
    var oldest=function(c){ var y=c.opened?Number(String(c.opened).slice(0,4)):(c.yr?Number(c.yr):null); return y ? 3000-y : null; };
    var RECS=[['Tallest',function(c){ return c.h; },' ft'],['Fastest',function(c){ return c.s; },' mph'],['Longest',function(c){ return c.l; },' ft'],
              ['Most inversions',function(c){ return c.inv; },''],['Oldest',oldest,'']];
    var rr=RECS.map(function(R){
      var x=best(A,R[1]), y=best(B,R[1]); if(!x && !y) return '';
      var cell=function(w, side, other){
        if(!w) return '<div class="c '+side+'"><b>&mdash;</b></div>';
        // Feet to the foot; speed keeps its decimal (149.1 mph).
        var v = R[0]==='Oldest' ? String(3000-w.v) : (R[2]===' ft' ? Math.round(w.v) : Number(w.v)).toLocaleString()+R[2];
        return '<div class="c '+side+(other && other.v>w.v?' lose':'')+'"><b>'+esc(v)+'</b><a href="'+esc(CoasterHub.coasterHref(w.c))+'">'+esc(w.c.name)+'</a></div>';
      };
      return '<div class="r"><div class="h">'+R[0]+'</div>'+cell(x,'a',y)+cell(y,'b',x)+'</div>';
    }).join('');
    if(rr) h+='<div class="sect">Records</div><div class="recs">'+rr+'</div>';

    // The rides themselves.
    var tallest=function(x,y){ return (y.h||0)-(x.h||0) || String(x.name).localeCompare(String(y.name)); };
    var L={ a:onlyA.sort(tallest), b:onlyB.sort(tallest), both:both.sort(tallest) };
    h+='<div class="sect">Coasters</div><div class="tabs" id="tabs">'
      +'<button type="button" data-t="a" class="on">Only '+esc(A.name)+' ('+L.a.length+')</button>'
      +'<button type="button" data-t="b">Only '+esc(B.name)+' ('+L.b.length+')</button>'
      +'<button type="button" data-t="both">Both ('+L.both.length+')</button></div><div id="clist"></div>';
    $('out').innerHTML=h;
    function show(t){
      Array.prototype.forEach.call($('tabs').children, function(x){ x.classList.toggle('on', x.getAttribute('data-t')===t); });
      var rows=L[t];
      $('clist').innerHTML='<div class="panel" id="cpanel">'+(rows.length ? rows.map(function(c){ return CoasterHub.coasterRow(c, { mine:MINE, add:!!MINE, ctx:'place' }); }).join('') : '<p class="none">None.</p>')+'</div>';
      CoasterHub.foldList($('cpanel'), 15);
    }
    $('tabs').onclick=function(e){ var t=e.target.closest('[data-t]'); if(t) show(t.getAttribute('data-t')); };
    show('a');
  }

  // The pickers offer your friends first.
  var fP = me ? fetch('/api/follows/'+encodeURIComponent(me),{cache:'no-store'}).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }) : Promise.resolve(null);
  Promise.all([fP, me ? CoasterHub.fetchRides(me).catch(function(){ return null; }) : null]).then(function(rr){
    var f=rr[0] ? (rr[0].following||[]).map(function(x){ return x.slug; }) : [];
    $('pa').__f=f; $('pb').__f=f;
    if(rr[1]){ MINE={}; (rr[1].rides||[]).forEach(function(x){ MINE[x.c]=1; }); }
    $('loading').style.display='none'; $('ui').hidden=false;
    go();
  });
}).catch(function(e){ console.error(e); $('loading').style.display='none'; $('err').style.display='block'; });
</script>
</body>
</html>
