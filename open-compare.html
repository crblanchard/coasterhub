<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<base href="/">
<title>Side by side — Coaster Hub</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css?v=20261118a">
<script>/* theme: set before paint so the page never flashes the wrong one (see initTheme in app.js). The device's light or dark setting; on a desktop, the toggle's choice if one was made (2026-10-30). */try{var chT=matchMedia("(min-width:681px)").matches?localStorage.getItem("ch_theme"):null}catch(e){}if(chT!=="dark"&&(chT==="light"||!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)))document.documentElement.setAttribute("data-theme","light");/* In the iPhone/Android app (capacitor.config.json appendUserAgent), marked before anything renders (2026-10-31). */if(/CoasterHubApp/.test(navigator.userAgent))document.documentElement.className+=" inapp"</script>
<link rel="icon" href="/favicon.svg?v=20260924b" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=20260924b" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260924b">
<style>
  /* /open-compare (2026-11-18): the live data and the open dataset (migrations
     187-190: Wikidata, Coasterpedia, OSM) side by side, for Carter to sort through before any swap.
     Unlisted; linked only from /sources. */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
  .controls input[type=search],.controls select{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:9px 12px;border-radius:10px;font-size:.9rem}
  .controls input[type=search]{min-width:220px;flex:1}
  .count{color:var(--muted);font-size:.85rem;margin-bottom:10px}
  .count b{color:var(--accent2)}
  .key{color:var(--muted);font-size:.82rem;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:4px 16px}
  .key .w{display:inline}
  .key[hidden]{display:none}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
  table{border-collapse:collapse;width:100%;font-size:.8rem}
  thead th{position:sticky;top:0;background:var(--well);color:var(--muted);text-align:left;padding:9px 10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:.66rem;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:7px 10px;border-bottom:1px solid var(--soft);vertical-align:top;white-space:nowrap}
  tbody tr:hover{background:var(--tint)}
  td.nm{font-weight:600;white-space:normal;min-width:150px}
  td.nm small{display:block;font-weight:400;color:var(--muted)}
  td a{color:inherit;text-decoration:none} td a:hover{color:var(--accent2);text-decoration:underline}
  .w{display:block;color:var(--accent2);font-size:.92em}
  .w.rc{color:var(--muted)}
  td.differ{background:color-mix(in srgb,var(--bad) 12%,transparent)}
  td.differ .w{color:var(--bad)}
  td.new{background:color-mix(in srgb,var(--accent2) 12%,transparent)}
  .muted{color:var(--muted)}
  .tag{display:inline-block;font-size:.66rem;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:4px;font-weight:500}
  #more{margin:14px 0 0;background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 14px;cursor:pointer}
  #loading{color:var(--muted);padding:30px 0}
  .sv.chosen,.w.chosen{font-weight:700}
  .sv.chosen::after,.w.chosen::after{content:" \2713";color:var(--accent2)}
  .w i{font-style:normal;font-size:.78em;opacity:.75;margin-right:2px}
  .w.off{color:var(--bad)}
  .u{color:var(--muted);font-size:.85em}
  td.pickable{cursor:pointer}
  td.picked{background:color-mix(in srgb,var(--accent2) 8%,transparent)}
  td.differ .w{color:inherit} td.differ .w.off{color:var(--bad)}
  a.unsure{color:var(--muted);font-style:italic}
  .picker{position:fixed;z-index:50;width:250px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
  .picker .pt{font-size:.78rem;color:var(--muted);margin:0 0 8px}
  .picker button{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:8px 10px;margin:0 0 6px;cursor:pointer;font-size:.85rem}
  .picker button:hover{border-color:var(--accent2)}
  .picker button.on{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 10%,transparent)}
  .picker button.clr{color:var(--muted)}
  .picker .pmsg{font-size:.78rem;color:var(--bad)}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="/">
    <img src="/mark.svg?v=20260924b" alt="" class="brand-mark" width="40" height="40">
    <span class="brand-text">Coaster <b>Hub</b></span>
  </a>
  <nav class="links">
    <a href="/" data-nav="riders">Home</a>
    <a href="/explore" data-nav="explore">Explore</a>
    <a href="/log" data-nav="log" class="navlog">+ Log</a>
    <a href="/rankings" data-nav="rankings">Rankings</a>
    <a href="/account" data-nav="profile">Me</a>
  </nav>
  <div class="people" id="people"></div>
</div></header>

<section class="hero compact" style="--hero-t:30px;--hero-b:20px"><div class="container">
  <h1 class="wide">Side by side</h1>
  <p>The site&rsquo;s data next to the open dataset, coaster by coaster. <a href="/sources" style="color:var(--accent2)">Coverage totals</a></p>
</div></section>

<section class="block" style="padding-top:22px"><div class="container">
  <div id="loading">Loading…</div>
  <div id="ui" hidden>
    <div class="controls">
      <input id="q" type="search" placeholder="Search coaster or park…">
      <select id="show">
        <option value="pick">Mismatches to choose</option>
        <option value="all">All coasters</option>
        <option value="picked">Already chosen</option>
        <option value="new">An open source has a value the site doesn&rsquo;t</option>
        <option value="linked">Matched to an open source</option>
        <option value="rcdb">RCDB only (no open source)</option>
        <option value="ambig">Unsure match (to review)</option>
        <option value="unmatched">Open-source coasters not on the site</option>
      </select>
      <select id="src"><option value="">Any source</option></select>
      <select id="field"><option value="">All fields</option></select>
    </div>
    <div class="key" id="key"></div>
    <div class="count" id="count"></div>
    <div class="tbl-wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
    <button id="more" hidden>Show more</button>
  </div>
</div></section>

<div id="picker" class="picker" hidden></div>

<script src="/app.js?v=20261118a"></script>
<script>
CoasterHub.initNav('sources');
const Q0 = new URLSearchParams(location.search).get('q');
const NAMES = { manu: 'Maker', model: 'Model', type: 'Type', h: 'Height', s: 'Speed', l: 'Length',
  inv: 'Inv', dur: 'Duration', opened: 'Opened', closed: 'Closed' };
const UNITS = { h: ' ft', l: ' ft', s: ' mph', dur: ' s' };
const SRC = { site: 'Site', wikidata: 'Wikidata', coasterpedia: 'Coasterpedia', osm: 'OpenStreetMap' };
const AB = { site: 'Site', wikidata: 'WD', coasterpedia: 'CP', osm: 'OSM' };
const LINK = {
  wikidata: r => 'https://www.wikidata.org/wiki/' + r,
  coasterpedia: r => 'https://coasterpedia.net/wiki/' + encodeURIComponent(r.replace(/ /g, '_')),
  osm: r => 'https://www.openstreetmap.org/' + r,
};
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const squash = v => String(v).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
// The rule the Worker uses (openAgree in worker.js).
function agree(f, a, b) {
  if (f === 'h' || f === 's' || f === 'l' || f === 'dur') { const x = +a, y = +b; return (!x || !y) ? x === y : Math.abs(x - y) / Math.max(x, y) <= 0.05; }
  if (f === 'inv') return +a === +b;
  if (f === 'opened' || f === 'closed') { const x = String(a), y = String(b), n = Math.min(x.length, y.length); return x.slice(0, n) === y.slice(0, n); }
  const x = squash(a), y = squash(b);
  return x === y || (x.length > 3 && y.length > 3 && (x.includes(y) || y.includes(x)));
}
let D, LIMIT = 300, byId = new Map();

function load() {
  return fetch('/api/open-compare', { cache: 'no-store' }).then(r => r.ok ? r.json() : r.json().then(j => Promise.reject(j.error || r.status)));
}
load().then(d => {
  D = d; prep();
  d.fields.forEach(f => $('field').insertAdjacentHTML('beforeend', '<option value="' + f + '">' + NAMES[f] + '</option>'));
  d.sources.forEach(s => $('src').insertAdjacentHTML('beforeend', '<option value="' + s + '">' + (SRC[s] || s) + '</option>'));
  $('key').innerHTML = '<span><b>Top</b>: the site now</span>' + d.sources.map(s => '<span class="w">' + AB[s] + ' = ' + (SRC[s] || s) + '</span>').join('')
    + '<span class="w rc">grey = cites RCDB</span><span>red = sources disagree (click to choose) · ✓ = your pick</span>';
  $('loading').hidden = true; $('ui').hidden = false;
  try { const s = JSON.parse(localStorage.getItem('ch_opencmp2') || '{}'); ['show', 'src', 'field'].forEach(k => { if (s[k] != null) $(k).value = s[k]; }); } catch (e) {}
  ['q', 'show', 'src', 'field'].forEach(id => $(id).addEventListener(id === 'q' ? 'input' : 'change', () => { LIMIT = 300; render(); }));
  if (Q0) { $('q').value = Q0; $('show').value = 'pick'; $('src').value = ''; $('field').value = ''; }
  $('more').onclick = () => { LIMIT += 300; render(); };
  document.addEventListener('click', e => { if (!$('picker').hidden && !e.target.closest('#picker') && !e.target.closest('td.pickable')) $('picker').hidden = true; });
  render();
}).catch(e => { $('loading').textContent = 'Could not load' + (typeof e === 'string' ? ': ' + e : '.'); });

function prep() { byId = new Map(D.rows.map(r => [r[0], r])); }

function fmt(f, v) { return v == null ? '–' : esc(v) + (UNITS[f] && /^[\d.]+$/.test(String(v)) ? '<span class="u">' + UNITS[f] + '</span>' : ''); }

function render() {
  const q = $('q').value.trim().toLowerCase(), show = $('show').value, src = $('src').value, field = $('field').value;
  try { localStorage.setItem('ch_opencmp2', JSON.stringify({ show, src, field })); } catch (e) {}
  if (show === 'unmatched') return renderUnmatched(q, src);
  $('key').hidden = false;
  const fs = field ? [field] : D.fields;
  const list = D.rows.filter(r => {
    if (q && (r[1] + ' ' + r[2]).toLowerCase().indexOf(q) < 0) return false;
    if (src && !r[4][src] && !(r[6] && r[6][src])) return false;
    const cells = fs.map(f => r[5][f]).filter(Boolean);
    if (show === 'pick') return cells.some(c => c.mismatch);
    if (show === 'picked') return cells.some(c => c.pick);
    if (show === 'new') return cells.some(c => c.site == null && Object.keys(c.src).length);
    if (show === 'linked') return Object.keys(r[4]).length > 0;
    if (show === 'rcdb') return !Object.keys(r[4]).length && !r[3];
    if (show === 'ambig') return !!r[6];
    return true;
  });
  const nPick = D.rows.reduce((n, r) => n + Object.values(r[5]).filter(c => c.mismatch).length, 0);
  $('head').innerHTML = '<th>Coaster</th>' + fs.map(f => '<th>' + NAMES[f] + '</th>').join('');
  $('count').innerHTML = '<b>' + list.length.toLocaleString() + '</b> coasters · <b>' + nPick.toLocaleString() + '</b> mismatches left to choose';
  $('body').innerHTML = list.slice(0, LIMIT).map(row).join('');
  $('more').hidden = list.length <= LIMIT;
}

function row(r) {
  const links = Object.entries(r[4]).map(([s, ref]) => '<a href="' + LINK[s](ref) + '" target="_blank" rel="noopener">' + AB[s] + '</a>')
    .concat(r[6] ? Object.entries(r[6]).map(([s, ref]) => '<a class="unsure" href="' + LINK[s](ref) + '" target="_blank" rel="noopener" title="Unsure match">' + AB[s] + '?</a>') : []);
  const fs = $('field').value ? [$('field').value] : D.fields;
  return '<tr data-id="' + r[0] + '"><td class="nm"><a href="' + esc(CoasterHub.coasterHref(r[1], r[2])) + '">' + esc(r[1]) + '</a>'
    + (r[3] ? '<span class="tag">fair</span>' : '')
    + '<small>' + esc(r[2]) + (links.length ? ' · ' + links.join(' ') : '') + '</small></td>'
    + fs.map(f => cell(r, f)).join('') + '</tr>';
}

function cell(r, f) {
  const c = r[5][f];
  if (!c) return '<td class="muted">–</td>';
  const pick = c.pick ? c.pick[0] : null;
  const srcs = Object.keys(c.src);
  const cls = c.mismatch ? 'differ pickable' : pick ? 'picked pickable'
    : c.site == null && srcs.length ? 'new' : (srcs.length && !D.noPick.includes(f)) ? 'pickable' : '';
  let h = '<div class="sv' + (pick === 'site' ? ' chosen' : '') + '">' + fmt(f, c.site) + '</div>';
  for (const s of srcs) {
    const [v, rc] = c.src[s];
    const off = c.site != null && !agree(f, c.site, v);
    h += '<span class="w' + (rc ? ' rc' : '') + (off ? ' off' : '') + (pick === s ? ' chosen' : '') + '"><i>' + AB[s] + '</i> ' + fmt(f, v) + '</span>';
  }
  return '<td class="' + cls + '" data-f="' + f + '">' + h + '</td>';
}

// Click a cell to choose which value is right, in the parallel dataset only.
document.addEventListener('click', e => {
  const td = e.target.closest('td.pickable'); if (!td) return;
  const id = +td.parentNode.dataset.id, f = td.dataset.f, r = byId.get(id), c = r[5][f];
  const opts = (c.site != null ? [['site', c.site]] : []).concat(Object.entries(c.src).map(([s, v]) => [s, v[0]]));
  const p = $('picker');
  p.innerHTML = '<div class="pt">' + esc(r[1]) + ' · ' + NAMES[f] + '</div>'
    + opts.map(([s, v]) => '<button data-s="' + s + '"' + (c.pick && c.pick[0] === s ? ' class="on"' : '') + '><b>' + (SRC[s] || s) + '</b> ' + fmt(f, v) + '</button>').join('')
    + (c.pick ? '<button data-s="" class="clr">Clear pick</button>' : '') + '<div class="pmsg" id="pmsg"></div>';
  const b = td.getBoundingClientRect();
  p.style.top = Math.min(b.bottom + 4, innerHeight - 220) + 'px';
  p.style.left = Math.max(8, Math.min(b.left, innerWidth - 260)) + 'px';
  p.hidden = false;
  p.onclick = ev => {
    const btn = ev.target.closest('button'); if (!btn) return;
    $('pmsg').textContent = 'Saving…';
    fetch('/api/open-choice', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id, field: f, source: btn.dataset.s || null }) })
      .then(res => res.json().then(j => res.ok ? j : Promise.reject(j.error || res.status)))
      .then(j => {
        c.pick = j.pick;
        // Picked now, so not a mismatch any more (unless cleared).
        c.mismatch = j.pick ? 0 : (opts.some(([, a], i) => opts.some(([, b], k) => k > i && !agree(f, a, b))) && !D.noPick.includes(f) ? 1 : 0);
        p.hidden = true;
        td.outerHTML = cell(r, f);
        $('count').innerHTML = $('count').innerHTML.replace(/<b>[\d,]+<\/b> mismatches/, '<b>' + D.rows.reduce((n, x) => n + Object.values(x[5]).filter(y => y.mismatch).length, 0).toLocaleString() + '</b> mismatches');
      })
      .catch(err => { $('pmsg').textContent = err === 'admins only' ? 'Sign in as an admin to choose.' : 'Could not save: ' + err; });
  };
});

function renderUnmatched(q, src) {
  $('key').hidden = true;
  const list = D.unmatched.filter(u => (!src || u.source === src) && (!q || [u.name, u.park, u.country, u.description].join(' ').toLowerCase().indexOf(q) >= 0));
  $('head').innerHTML = '<th>Coaster</th><th>Source</th><th>Park</th><th>Country</th><th>Opened</th>';
  $('count').innerHTML = '<b>' + list.length.toLocaleString() + '</b> open-source coasters match nothing here';
  $('body').innerHTML = list.slice(0, LIMIT).map(u => '<tr><td class="nm"><a href="' + LINK[u.source](u.ref) + '" target="_blank" rel="noopener">'
    + esc(u.name || u.ref) + '</a><small>' + esc(u.description || '') + '</small></td><td>' + (SRC[u.source] || u.source)
    + '</td><td style="white-space:normal">' + esc(u.park || '–') + '</td><td>' + esc(u.country || '–') + '</td><td>' + esc(u.opened || '–') + '</td></tr>').join('');
  $('more').hidden = list.length <= LIMIT;
}
</script>
</body>
