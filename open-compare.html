<script>/* theme: set before paint so the page never flashes the wrong one (see initTheme in app.js). The device's light or dark setting; on a desktop, the toggle's choice if one was made (2026-10-30). */try{var chT=matchMedia("(min-width:681px)").matches?localStorage.getItem("ch_theme"):null}catch(e){}if(chT!=="dark"&&(chT==="light"||!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)))document.documentElement.setAttribute("data-theme","light");/* In the iPhone/Android app (capacitor.config.json appendUserAgent), marked before anything renders (2026-10-31). */if(/CoasterHubApp/.test(navigator.userAgent))document.documentElement.className+=" inapp"</script>
<link rel="icon" href="/favicon.svg?v=20260924b" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=20260924b" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260924b">
<style>
  /* /open-compare (2026-11-18): the live data and the open dataset (migrations
     187/188) side by side, for Carter to sort through before any swap.
     Unlisted; linked only from /sources. */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
  .controls input[type=search],.controls select{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:9px 12px;border-radius:10px;font-size:.9rem}
  .controls input[type=search]{min-width:220px;flex:1}
  .count{color:var(--muted);font-size:.85rem;margin-bottom:10px}
  .count b{color:var(--accent2)}
  .key{color:var(--muted);font-size:.82rem;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:4px 16px}
  .key .w{display:inline}
  .key[hidden]{display:none}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
  table{border-collapse:collapse;width:100%;font-size:.8rem}
  thead th{position:sticky;top:0;background:var(--well);color:var(--muted);text-align:left;padding:9px 10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:.66rem;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:7px 10px;border-bottom:1px solid var(--soft);vertical-align:top;white-space:nowrap}
  tbody tr:hover{background:var(--tint)}
  td.nm{font-weight:600;white-space:normal;min-width:150px}
  td.nm small{display:block;font-weight:400;color:var(--muted)}
  td a{color:inherit;text-decoration:none} td a:hover{color:var(--accent2);text-decoration:underline}
  .w{display:block;color:var(--accent2);font-size:.92em}
  .w.rc{color:var(--muted)}
  td.differ{background:color-mix(in srgb,var(--bad) 12%,transparent)}
  td.differ .w{color:var(--bad)}
  td.new{background:color-mix(in srgb,var(--accent2) 12%,transparent)}
  .muted{color:var(--muted)}
  .tag{display:inline-block;font-size:.66rem;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:4px;font-weight:500}
  #more{margin:14px 0 0;background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 14px;cursor:pointer}
  #loading{color:var(--muted);padding:30px 0}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="/">
    <img src="/mark.svg?v=20260924b" alt="" class="brand-mark" width="40" height="40">
    <span class="brand-text">Coaster <b>Hub</b></span>
  </a>
  <nav class="links">
    <a href="/" data-nav="riders">Home</a>
    <a href="/explore" data-nav="explore">Explore</a>
    <a href="/log" data-nav="log" class="navlog">+ Log</a>
    <a href="/rankings" data-nav="rankings">Rankings</a>
    <a href="/account" data-nav="profile">Me</a>
  </nav>
  <div class="people" id="people"></div>
</div></header>

<section class="hero compact" style="--hero-t:30px;--hero-b:20px"><div class="container">
  <h1 class="wide">Side by side</h1>
  <p>The site&rsquo;s data next to the open dataset, coaster by coaster. <a href="/sources" style="color:var(--accent2)">Coverage totals</a></p>
</div></section>

<section class="block" style="padding-top:22px"><div class="container">
  <div id="loading">Loading…</div>
  <div id="ui" hidden>
    <div class="controls">
      <input id="q" type="search" placeholder="Search coaster or park…">
      <select id="show">
        <option value="all">All coasters</option>
        <option value="differ">Values that differ</option>
        <option value="new">Wikidata has a value the site doesn&rsquo;t</option>
        <option value="linked">Matched to Wikidata</option>
        <option value="rcdb">RCDB only (no open source)</option>
        <option value="ambig">Unsure match (to review)</option>
        <option value="unmatched">Wikidata coasters not on the site</option>
      </select>
      <select id="field"><option value="">All fields</option></select>
    </div>
    <div class="key" id="key"><span>Top: the site</span><span class="w">Below: Wikidata</span><span class="w rc">grey = Wikidata cites RCDB for it</span></div>
    <div class="count" id="count"></div>
    <div class="tbl-wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
    <button id="more" hidden>Show more</button>
  </div>
</div></section>

<script src="/app.js?v=20261118a"></script>
<script>
CoasterHub.initNav('sources');
const NAMES = { manu: 'Maker', model: 'Model', type: 'Type', h: 'Height', s: 'Speed', l: 'Length',
  inv: 'Inv', dur: 'Duration', opened: 'Opened', closed: 'Closed' };
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const squash = v => String(v).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
// The same rule /api/open-coverage uses: numbers within 5%, dates at the
// coarser precision, text once case and punctuation are gone.
function agree(f, a, b) {
  if (f === 'h' || f === 's' || f === 'l' || f === 'dur') { const x = +a, y = +b; return (!x || !y) ? x === y : Math.abs(x - y) / Math.max(x, y) <= 0.05; }
  if (f === 'opened' || f === 'closed') { const x = String(a), y = String(b), n = Math.min(x.length, y.length); return x.slice(0, n) === y.slice(0, n); }
  return squash(a) === squash(b);
}
let D, LIMIT = 300;

fetch('/api/open-compare').then(r => r.ok ? r.json() : r.json().then(j => Promise.reject(j.error || r.status))).then(d => {
  D = d;
  D.rows.forEach(r => { r.st = {}; for (const f in r[5]) { const v = r[5][f];
    r.st[f] = v[1] == null ? '' : v[0] == null ? 'new' : agree(f, v[0], v[1]) ? 'agree' : 'differ'; } });
  d.fields.forEach(f => $('field').insertAdjacentHTML('beforeend', '<option value="' + f + '">' + NAMES[f] + '</option>'));
  $('loading').hidden = true; $('ui').hidden = false;
  try { const s = JSON.parse(localStorage.getItem('ch_opencmp') || '{}'); if (s.show) $('show').value = s.show; if (s.field) $('field').value = s.field; } catch (e) {}
  ['q', 'show', 'field'].forEach(id => $(id).addEventListener(id === 'q' ? 'input' : 'change', () => { LIMIT = 300; render(); }));
  $('more').onclick = () => { LIMIT += 300; render(); };
  render();
}).catch(e => { $('loading').textContent = 'Could not load' + (typeof e === 'string' ? ': ' + e : '.'); });

function render() {
  const q = $('q').value.trim().toLowerCase(), show = $('show').value, field = $('field').value;
  try { localStorage.setItem('ch_opencmp', JSON.stringify({ show, field })); } catch (e) {}
  if (show === 'unmatched') return renderUnmatched(q);
  $('key').hidden = false;
  const fs = field ? [field] : D.fields;
  const has = (r, s) => fs.some(f => r.st[f] === s);
  const list = D.rows.filter(r => {
    if (q && (r[1] + ' ' + r[2]).toLowerCase().indexOf(q) < 0) return false;
    if (show === 'differ') return has(r, 'differ');
    if (show === 'new') return has(r, 'new');
    if (show === 'linked') return !!r[4];
    if (show === 'rcdb') return !r[4] && !r[3];
    if (show === 'ambig') return !!r[6];
    return true;
  });
  $('head').innerHTML = '<th>Coaster</th>' + fs.map(f => '<th>' + NAMES[f] + '</th>').join('');
  $('count').innerHTML = '<b>' + list.length.toLocaleString() + '</b> coasters';
  $('body').innerHTML = list.slice(0, LIMIT).map(r => {
    const wd = r[4] || r[6];
    const name = '<td class="nm"><a href="' + esc(CoasterHub.coasterHref(r[1], r[2])) + '">' + esc(r[1]) + '</a>'
      + (r[3] ? '<span class="tag">fair</span>' : '') + (r[6] ? '<span class="tag">unsure</span>' : '')
      + '<small>' + esc(r[2]) + (wd ? ' · <a href="https://www.wikidata.org/wiki/' + wd + '" target="_blank" rel="noopener">' + wd + '</a>' : '') + '</small></td>';
    return '<tr>' + name + fs.map(f => {
      const v = r[5][f]; if (!v) return '<td class="muted">–</td>';
      return '<td class="' + r.st[f] + '">' + (v[0] == null ? '<span class="muted">–</span>' : esc(v[0]))
        + (v[1] != null ? '<span class="w' + (v[2] ? ' rc' : '') + '">' + esc(v[1]) + '</span>' : '') + '</td>';
    }).join('') + '</tr>';
  }).join('');
  $('more').hidden = list.length <= LIMIT;
}

function renderUnmatched(q) {
  $('key').hidden = true;
  const list = D.unmatched.filter(u => !q || [u.label, u.park, u.country, u.description].join(' ').toLowerCase().indexOf(q) >= 0);
  $('head').innerHTML = '<th>Wikidata coaster</th><th>Park</th><th>Country</th><th>Opened</th>';
  $('count').innerHTML = '<b>' + list.length.toLocaleString() + '</b> Wikidata coasters match nothing here';
  $('body').innerHTML = list.slice(0, LIMIT).map(u => '<tr><td class="nm"><a href="https://www.wikidata.org/wiki/' + u.qid + '" target="_blank" rel="noopener">'
    + esc(u.label || u.qid) + '</a><small>' + esc(u.description || '') + '</small></td><td style="white-space:normal">' + esc(u.park || '–')
    + '</td><td>' + esc(u.country || '–') + '</td><td>' + esc(u.opened || '–') + '</td></tr>').join('');
  $('more').hidden = list.length <= LIMIT;
}
</script>
</body>
</html>
