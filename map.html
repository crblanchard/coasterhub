<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Map — Coaster Hub</title>
<meta name="description" content="Every park on the map with its operating coasters — Coaster Hub.">
<script>/* theme: set before paint so light mode never flashes dark (see initTheme in app.js) */try{if(localStorage.getItem("ch_theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="Map — Coaster Hub">

<link rel="stylesheet" href="/style.css?v=20260805b">
<!-- The same Leaflet the profile page uses, from the same place. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  /* A full-screen map with just the header and footer (Carter, 2026-09-21).
     The page is a column: sticky header, the map taking every pixel left,
     the footer. dvh where the browser has it, because 100vh on iOS is the
     toolbars-hidden height and leaves the page scrollable past the footer;
     vh as the fallback for the browsers that do not. */
  html,body{height:100%}
  body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  #map{flex:1 1 auto;min-height:60vh;z-index:1;background-color:var(--panel)}
  footer.site{margin-top:0;padding-top:18px;padding-bottom:18px}
  /* The number on each park: operating coasters. Every park is its own disc
     at every zoom — they do not combine into clusters (Carter, 2026-09-21:
     "make it so the dots don't combine") — so the disc is small on purpose,
     small enough that where parks overlap at a wide zoom you can see that
     they do, and it sits centred on the park rather than hanging off its
     corner. The fill is a red ramp by the count, pale for one coaster and
     deep for the busiest park; JS sets it per marker so the legend and the
     discs come from the same function. The ring is a thin white line so the
     fill reads over any basemap. A park with nothing operating is a muted
     ring; one the rider has ridden out is ringed in the site's teal. */
  .leaflet-div-icon.pk{background:none;border:0}
  .pk span{display:flex;align-items:center;justify-content:center;
    min-width:20px;height:20px;padding:0 4px;border-radius:999px;box-sizing:border-box;
    transform:translate(-50%,-50%);
    background-color:var(--accent);color:#fff;
    border-width:1.5px;border-style:solid;border-color:rgba(255,255,255,.85);
    font-weight:800;font-size:.68rem;line-height:1;font-variant-numeric:tabular-nums;
    box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer}
  .pk.none span{background-color:var(--panel);color:var(--muted);border-color:var(--muted);font-weight:700}
  .pk.mine span{border-color:var(--accent2);border-width:2px}
  /* The ramp's legend, in the note bottom-left: a short bar from the palest
     fill to the deepest, with the count at each end. */
  .ctl .ramp{display:inline-block;vertical-align:middle;width:54px;height:8px;border-radius:4px;margin:0 3px 2px}
  /* The popup: the park as a link, then its operating coasters as links. A big
     park is a long list, so it scrolls inside the popup rather than off the map. */
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
  .leaflet-popup-content{margin:12px 14px;line-height:1.45;max-height:min(46vh,380px);overflow-y:auto}
  .pp h3{font-size:1rem;margin:0 0 1px;font-weight:800}
  .pp h3 a{color:var(--fg);text-decoration:none}.pp h3 a:hover{color:var(--accent2);text-decoration:underline}
  .pp small{color:var(--muted)}
  .pp .n{color:var(--accent2);font-weight:700;font-size:.82rem;margin:6px 0 4px}
  .pp ul{list-style:none;margin:0;padding:0}
  .pp li{padding:3px 0;border-top:1px solid var(--soft);font-size:.9rem;display:flex;gap:8px;align-items:center}
  .pp li a{color:inherit;text-decoration:none;min-width:0}.pp li a:hover{color:var(--accent2);text-decoration:underline}
  /* The mark beside each coaster when there is somebody to mark: /count's
     park-view tick, exactly — a teal ✓ on the ones you have, an empty slot of
     the same width on the ones you do not, so the names line up, and the
     name muted on those. Not a box: it was the log page's checkbox for an
     hour and read as something to click (Carter, 2026-09-21: "the checks like
     these, something less clickable"). */
  .pp li .tick{flex:none;width:1.05em;text-align:center;color:var(--accent2);font-size:.82rem}
  .pp li.miss a{color:var(--muted)}
  .pp .closed{color:var(--muted);font-size:.8rem;margin-top:6px}
  /* Two small panels on the map itself, since there is no page around it:
     the rider switcher top-right (app.js builds the badge into it, exactly as
     it does into a hero), and a note bottom-left about the parks that have no
     coordinates and so cannot be on the map at all. */
  .ctl{background-color:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;
    color:var(--muted);font-size:.8rem;box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .ctl b{color:var(--fg)}
  .ctl.who{padding:4px 6px}
  /* Top-left, under the zoom buttons: which parks are on the map — the ones
     you have a credit at, the ones you do not. Only when there is somebody to
     ask that about; "visited" means nothing on the everyone view. */
  .ctl.filt{padding:6px 11px 6px 9px}
  .ctl.filt label{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--fg);padding:3px 0;font-size:.85rem;user-select:none;white-space:nowrap}
  .ctl.filt input{accent-color:var(--accent2);width:16px;height:16px;margin:0;flex:none;cursor:pointer}
  .ctl.filt small{color:var(--muted);font-variant-numeric:tabular-nums}
  .ctl .list{display:none;margin-top:6px;max-width:260px;line-height:1.5}
  .ctl.open .list{display:block}
  .ctl button{background:none;border:0;padding:0;font:inherit;color:var(--accent2);cursor:pointer}
  #err{position:absolute;z-index:2;left:16px;right:16px;top:16px;background:var(--tint2);border:1px solid var(--accent2);border-radius:12px;padding:14px 16px;display:none}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="/">
    <img src="/mark.svg?v=20260805b" alt="" class="brand-mark" width="40" height="40">
    <span class="brand-text">Coaster <b>Hub</b></span>
  </a>
  <nav class="links">
    <a href="/" data-nav="riders">Home</a>
    <a href="/rankings" data-nav="rankings">Rankings</a>
    <a href="/account" data-nav="profile">Profile</a>
    <a href="/count" data-nav="count">Count</a>
    <a href="/log" data-nav="log">Log</a>
  </nav>
  <div class="people" id="people"></div>
</div></header>

<div id="err"><strong>Couldn&rsquo;t load the data.</strong> This page reads the park and ride data, so it needs to be served over the web.</div>
<div id="map" role="application" aria-label="Map of every park"></div>

<footer class="site"><div class="container foot-inner">
  <div>&copy; <span id="y"></span> Coaster Hub &middot; coasterhub.org</div>
  <div><a href="/">Home</a> &nbsp;&middot;&nbsp; <a href="/map">Map</a> &nbsp;&middot;&nbsp; <a href="/count">Count</a> &nbsp;&middot;&nbsp; <a href="/add">Add new</a> &nbsp;&middot;&nbsp; <a href="/edit">Edit</a> &nbsp;&middot;&nbsp; <a href="/sitemap">Site map</a></div>
</div></footer>

<script src="/app.js?v=20260805b"></script>
<script>
document.getElementById('y').textContent=new Date().getFullYear();
CoasterHub.initNav('map');

function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fail(e){console.error(e);document.getElementById('err').style.display='block';}

// Whose map. The parks and the numbers on them are the same for everybody —
// operating coasters is a fact about the park. A rider adds what is theirs:
// the rider in the URL, or, with nobody in the URL, whoever is signed in — the
// same rule /count uses. That gives every coaster in a popup a tick when they
// have the credit, "12 of 15" under the park's name, and the two
// checkboxes top-left that keep or drop the parks they have been to. Nobody
// means none of that: a map of what each park has.
var slug=CoasterHub.currentUser();

var map=L.map('map',{scrollWheelZoom:true,worldCopyJump:true}).setView([30,-40],2);
// The basemap, exactly as the profile page picks it: Esri's canvas tiles, no
// key, dark or light to match the theme, OpenStreetMap if Esri stops
// answering. See profile.html for the history behind each choice.
//
// Plus, here only, Esri's matching REFERENCE layer over the base. The canvas
// base is unlabelled on purpose, and the reference tiles are its place names —
// a few big cities at world zoom, towns as you get closer (Carter, 2026-09-21:
// "can we make cities pop up on the map"). It sits in the tile pane, so the
// discs and popups stay above it. He also asked to lose the county borders:
// those are drawn INTO the base tiles, and a raster tile is a picture — there
// is no layer to switch off. Every keyless basemap draws them too (OSM's are
// the dashed ones), and Carto's label-only tiles, the one clean way to compose
// a borderless base, now need an API key and are being retired. So: labels
// yes, borders no, and this is where the reason lives.
var ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
var TILES={
  dark: {url:ESRI+'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',  labels:ESRI+'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',  attribution:'Tiles &copy; Esri'},
  light:{url:ESRI+'World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', labels:ESRI+'World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', attribution:'Tiles &copy; Esri'}
};
var FALLBACK={url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attribution:'&copy; OpenStreetMap contributors', native:19};
var base=null, labels=null, fellBack=false;
function setBase(spec){
  var layer=L.tileLayer(spec.url,{attribution:spec.attribution, maxNativeZoom:spec.native||16, maxZoom:19});
  var ok=false, bad=0;
  layer.on('tileload',function(){ ok=true; });
  layer.on('tileerror',function(){ if(!ok && !fellBack && ++bad>=8){ fellBack=true; setBase(FALLBACK); } });
  if(base) map.removeLayer(base);
  if(labels) map.removeLayer(labels);
  base=layer.addTo(map);
  // OpenStreetMap's tiles carry their own names: no reference layer over those.
  labels=spec.labels ? L.tileLayer(spec.labels,{maxNativeZoom:16, maxZoom:19, zIndex:2}).addTo(map) : null;
}
function mapTheme(){ return document.documentElement.getAttribute('data-theme')==='light' ? 'light' : 'dark'; }
setBase(TILES[mapTheme()]);
// Not if the tiles fell back to OpenStreetMap: a theme toggle must not put
// the dead server back. Same guard as the profile page.
document.documentElement.addEventListener('ch:themechange',function(){ if(!fellBack) setBase(TILES[mapTheme()]); });

// The rider switcher, on the map's top-right corner since there is no hero to
// hold it. app.js builds the badge into the host exactly as it does on /count;
// its menu is positioned fixed at the end of <body>, so the map cannot clip it.
var who=L.control({position:'topright'});
who.onAdd=function(){
  var d=L.DomUtil.create('div','ctl who');
  d.innerHTML='<span class="badge" id="hero_badge">Global</span>';
  L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
  return d;
};
who.addTo(map);
CoasterHub.riderBadge(document.getElementById('hero_badge'),'map',slug);

// A rider whose log cannot be read gets the everyone map rather than a map
// that ticks nothing and says "0 of 15" at every park.
var whose = slug ? Promise.resolve(slug)
  : CoasterHub.me().then(function(a){ return (a && a.slug) || null; }).catch(function(){ return null; });
Promise.all([
  whose.then(function(s){ return s ? CoasterHub.fetchRides(s).catch(function(){ return null; }) : null; }),
  CoasterHub.fetchCoasters(),
  CoasterHub.fetchParks()
]).then(function(res){
  var log=res[0], coasters=res[1].coasters, parks=res[2];
  var MINE={}; if(log) (log.rides||[]).forEach(function(r){ MINE[r.c]=1; });

  // Per park: its coasters, operating and closed, A-Z within each, and whether
  // the rider has any credit there. A closed one counts: it was still a visit.
  var P={};
  Object.keys(parks).forEach(function(name){
    P[name]={ name:name, lat:parks[name].lat, lon:parks[name].lon, region:parks[name].region||'', open:[], closed:[] };
  });
  coasters.forEach(function(c){
    if(!c.park || !P[c.park]) return;
    (c.closed ? P[c.park].closed : P[c.park].open).push(c);
  });
  var all=Object.keys(P).map(function(k){ return P[k]; });
  all.forEach(function(p){
    p.open.sort(function(a,b){ return a.name.localeCompare(b.name); }); p.closed.sort(function(a,b){ return a.name.localeCompare(b.name); });
    p.been = !!log && p.open.concat(p.closed).some(function(c){ return MINE[c.id]; });
  });
  var placed=all.filter(function(p){ return p.lat!=null && p.lon!=null; });
  var unplaced=all.filter(function(p){ return p.lat==null || p.lon==null; });

  function popup(p){
    var ridden=p.open.filter(function(c){ return MINE[c.id]; }).length;
    var h='<div class="pp"><h3><a href="'+esc(CoasterHub.parkHref(p.name))+'">'+esc(p.name)+' →</a></h3>'
      +'<small>'+esc(p.region)+'</small>'
      +'<div class="n">'+(p.open.length ? p.open.length+' operating coaster'+(p.open.length===1?'':'s') : 'No operating coasters')
      +(log && p.open.length ? ' · '+ridden+' of '+p.open.length+' ridden' : '')+'</div>';
    if(p.open.length){
      h+='<ul>'+p.open.map(function(c){
        var got=!!MINE[c.id];
        return '<li'+(log?(got?' class="got"':' class="miss"'):'')+'>'
          +(log ? '<span class="tick" aria-label="'+(got?'Ridden':'Not ridden')+'">'+(got?'\u2713':'')+'</span>' : '')
          +'<a href="'+esc(CoasterHub.coasterHref(c))+'">'+esc(c.name)+'</a></li>';
      }).join('')+'</ul>';
    }
    if(p.closed.length) h+='<div class="closed">'+p.closed.length+' closed: '+p.closed.map(function(c){ return esc(c.name); }).join(', ')+'</div>';
    return h+'</div>';
  }
  // The colour ramp: pale at one coaster, the site's red in the middle, deep
  // crimson at the busiest park. Square-root, not linear, because the median
  // park has three and a linear ramp would leave two-thirds of the map the
  // same pale pink. Dark digits on the pale end, white once the fill is dark
  // enough to carry them.
  var MAX=placed.reduce(function(m,p){ return Math.max(m,p.open.length); },1);
  var STOPS=[[255,190,178],[255,90,95],[140,10,30]];
  function rampT(t){
    var i=t<.5?0:1, f=(t-i*.5)*2, a=STOPS[i], b=STOPS[i+1];
    return 'rgb('+[0,1,2].map(function(k){ return Math.round(a[k]+(b[k]-a[k])*f); }).join(',')+')';
  }
  function ramp(n){
    var t=Math.sqrt(Math.max(0,n-1)/Math.max(1,MAX-1));
    return { bg:rampT(t), fg: t<.3 ? '#3a0810' : '#fff' };
  }
  var pts=[];
  var group=L.layerGroup();
  placed.forEach(function(p){
    var n=p.open.length;
    var full = log && n && p.open.every(function(c){ return MINE[c.id]; });
    var col = n ? ramp(n) : null;
    var icon=L.divIcon({className:'pk'+(n?'':' none')+(full?' mine':''),
      html:'<span'+(col ? ' style="background-color:'+col.bg+';color:'+col.fg+'"' : '')+'>'+n+'</span>',
      iconSize:null, popupAnchor:[0,-10]});
    // Where discs overlap, the bigger park is on top: the one worth clicking
    // is the one you can see.
    p.marker=L.marker([p.lat,p.lon],{icon:icon, title:p.name, zIndexOffset:n*10}).bindPopup(popup(p),{maxWidth:320});
    pts.push([p.lat,p.lon]);
  });
  map.addLayer(group);

  // Which parks are on the map. The note's two numbers follow along.
  var SHOW={been:true, not:true};
  function shown(p){ return p.been ? SHOW.been : SHOW.not; }
  function refresh(){
    var vis=placed.filter(shown);
    group.clearLayers(); vis.forEach(function(p){ group.addLayer(p.marker); });
    var np=document.getElementById('np'), nc=document.getElementById('nc');
    if(np) np.textContent=vis.length;
    if(nc) nc.textContent=vis.reduce(function(a,p){ return a+p.open.length; },0).toLocaleString();
  }
  refresh();
  if(pts.length) map.fitBounds(pts,{padding:[30,30]});

  // The two boxes, top-left under the zoom buttons (Carter, 2026-09-21:
  // "checkboxes in the top left that show ridden and not ridden while you're
  // logged in"). Both on to start, so the map opens complete; untick one and
  // that half of the parks goes. A park is visited when the rider has any
  // credit there. Carter, on seeing it: "call it visited and not visited" —
  // the coaster ticks in the popup stay Ridden, since those are about rides.
  // The counts are of parks that are on the map — the unplaced
  // ones are the note's business.
  if(log){
    var been=placed.filter(function(p){ return p.been; }).length;
    var filt=L.control({position:'topleft'});
    filt.onAdd=function(){
      var d=L.DomUtil.create('div','ctl filt');
      d.innerHTML='<label><input type="checkbox" id="f_been" checked> Visited <small>'+been+'</small></label>'
        +'<label><input type="checkbox" id="f_not" checked> Not visited <small>'+(placed.length-been)+'</small></label>';
      L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
      return d;
    };
    filt.addTo(map);
    document.getElementById('f_been').onchange=function(){ SHOW.been=this.checked; refresh(); };
    document.getElementById('f_not').onchange=function(){ SHOW.not=this.checked; refresh(); };
  }

  // What is not on the map, and why. Bottom-left, folded, because a park
  // with no coordinates is invisible here and nowhere else says so.
  var note=L.control({position:'bottomleft'});
  note.onAdd=function(){
    var d=L.DomUtil.create('div','ctl');
    var tot=placed.reduce(function(a,p){ return a+p.open.length; },0);
    d.innerHTML='<b id="np">'+placed.length+'</b> parks · <b id="nc">'+tot.toLocaleString()+'</b> operating coasters'
      +' · 1 <span class="ramp" title="Operating coasters, fewest to most" style="background-image:linear-gradient(to right,'+rampT(0)+','+rampT(.5)+','+rampT(1)+')"></span> '+MAX
      +(unplaced.length ? ' · <button type="button" id="unp">'+unplaced.length+' not placed</button>'
        +'<div class="list">No coordinates yet — give them a location in /edit: '
        +unplaced.map(function(p){ return '<b>'+esc(p.name)+'</b> ('+p.open.length+')'; }).join(', ')+'</div>' : '');
    L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
    return d;
  };
  note.addTo(map);
  var unp=document.getElementById('unp');
  if(unp) unp.onclick=function(){ unp.parentNode.classList.toggle('open'); };
  document.title=(slug && log && log.user ? log.user+'’s Map' : 'Map')+' — Coaster Hub';
  document.body.setAttribute('data-ready','1');
}).catch(fail);
</script>
</body>
</html>
