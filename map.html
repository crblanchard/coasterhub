<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  /* A full-screen map with just the header and footer (Carter, 2026-09-21).
     The page is a column: sticky header, the map taking every pixel left,
     the footer. dvh where the browser has it, because 100vh on iOS is the
     toolbars-hidden height and leaves the page scrollable past the footer;
     vh as the fallback for the browsers that do not. */
  html,body{height:100%}
  body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  #map{flex:1 1 auto;min-height:60vh;z-index:1;background-color:var(--panel)}
  footer.site{margin-top:0;padding-top:18px;padding-bottom:18px}
  /* The number on each park: operating coasters. Every park is its own disc
     at every zoom — they do not combine into clusters (Carter, 2026-09-21:
     "make it so the dots don't combine") — so the disc is small on purpose,
     small enough that where parks overlap at a wide zoom you can see that
     they do, and it sits centred on the park rather than hanging off its
     corner. The fill is a red ramp by the count, pale for one coaster and
     deep for the busiest park; JS sets it per marker so the legend and the
     discs come from the same function. The ring is a thin white line so the
     fill reads over any basemap. A park with nothing operating is a muted
     ring; one the rider has ridden out is ringed in the site's teal. */
  .leaflet-div-icon.pk{background:none;border:0}
  .pk span{display:flex;align-items:center;justify-content:center;
    min-width:20px;height:20px;padding:0 4px;border-radius:999px;box-sizing:border-box;
    transform:translate(-50%,-50%);
    background-color:var(--accent);color:#fff;
    border-width:1.5px;border-style:solid;border-color:rgba(255,255,255,.85);
    font-weight:800;font-size:.68rem;line-height:1;font-variant-numeric:tabular-nums;
    box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer}
  .pk.none span{background-color:var(--panel);color:var(--muted);border-color:var(--muted);font-weight:700}
  .pk.mine span{border-color:var(--accent2);border-width:2px}
  /* The ramp's legend, in the note bottom-left: a short bar from the palest
     fill to the deepest, with the count at each end. */
  .ctl .ramp{display:inline-block;vertical-align:middle;width:54px;height:8px;border-radius:4px;margin:0 3px 2px}
  /* The popup: the park as a link, then its operating coasters as links. A big
     park is a long list, so it scrolls inside the popup rather than off the map. */
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
  /* The height cap is Leaflet's own maxHeight option (set per popup below),
     not a CSS max-height: that is the path Leaflet built for a scrolling
     popup — it sets the height and adds .leaflet-popup-scrolled, which is
     what a finger can scroll on a phone. overscroll-behavior keeps the end of
     the list from handing the drag to the map. */
  .leaflet-popup-content{margin:12px 14px;line-height:1.45;scrollbar-width:thin;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .pp h3{font-size:1rem;margin:0 0 1px;font-weight:800}
  .pp h3 a{color:var(--fg);text-decoration:none}.pp h3 a:hover{color:var(--accent2);text-decoration:underline}
  .pp small{color:var(--muted)}
  .pp .n{color:var(--accent2);font-weight:700;font-size:.82rem;margin:6px 0 4px}
  .pp ul{list-style:none;margin:0;padding:0}
  .pp li{padding:3px 0;border-top:1px solid var(--soft);font-size:.9rem;display:flex;gap:8px;align-items:center}
  .pp li a{color:inherit;text-decoration:none;min-width:0}.pp li a:hover{color:var(--accent2);text-decoration:underline}
  /* The mark beside each coaster when there is somebody to mark: /count's
     park-view tick, exactly — a teal ✓ on the ones you have, an empty slot of
     the same width on the ones you do not, so the names line up. (The name
     was muted on those too until 2026-09-24; grey means defunct now.) Not a box: it was the log page's checkbox for an
     hour and read as something to click (Carter, 2026-09-21: "the checks like
     these, something less clickable"). */
  .pp li .tick{flex:none;width:1.05em;text-align:center;color:var(--accent2);font-size:.82rem}
  /* Comparing: the other rider's tick, in red — the colour of their
     "only them" parks — and the same two colours in the headline. */
  .pp li .tick.them{color:#ff5a5f}
  .pp .k1{color:var(--accent2)} .pp .k2{color:#ff5a5f}
  /* Grey means defunct, as on /count's park view (2026-09-24); not ridden
     is the missing tick. */
  .pp li.gone a{color:var(--muted)}
  /* The defunct ones, under the operating list: their own small heading, the
     years on the right the way /count writes them (1990–2017, or "closed 2017"
     when the opening year is unknown), a tick where the rider has the credit —
     a defunct coaster ridden is a credit like any other. */
  .pp .n.dead{color:var(--muted);margin-top:10px}
  .pp li .yrs{margin-left:auto;flex:none;color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums;padding-left:8px}
  /* Two small panels on the map itself, since there is no page around it:
     the rider switcher top-right (app.js builds the badge into it, exactly as
     it does into a hero), and a note bottom-left about the parks that have no
     coordinates and so cannot be on the map at all. */
  .ctl{background-color:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;
    color:var(--muted);font-size:.8rem;box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .ctl b{color:var(--fg)}
  /* The rider switcher. app.js builds the same badge it puts in a page's
     hero, but every rule that styles that badge is scoped to .hero, and the
     map has no hero: it came out as a bare browser button in a box made tall
     and empty by the wrapper's 22px bottom margin (Carter, 2026-09-24: "this
     box looks bad on desktop, make it bigger"). So it is styled here: a real
     pill, the hero badge's look at a size you can hit, and no margin. */
  .ctl.who{padding:5px;border-radius:999px}
  .ctl.who .riderbadge{display:block;margin:0}
  .ctl.who .riderbadge .badge{display:inline-flex;align-items:center;gap:8px;margin:0;
    background-color:transparent;border:1px solid var(--ring);border-radius:999px;
    padding:8px 16px;font-family:inherit;font-size:.9rem;font-weight:700;letter-spacing:.04em;
    color:var(--accent2);cursor:pointer;transition:border-color .15s}
  .ctl.who .riderbadge .badge:hover{border-color:var(--accent2)}
  .ctl.who .riderbadge .badge:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
  /* Top-left, under the zoom buttons: which parks are on the map — the ones
     you have a credit at, the ones you do not. Only when there is somebody to
     ask that about; "visited" means nothing on the everyone view. */
  .ctl.filt{padding:6px 11px 6px 9px}
  .ctl.filt label{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--fg);padding:3px 0;font-size:.85rem;user-select:none;white-space:nowrap}
  .ctl.filt input{accent-color:var(--accent2);width:16px;height:16px;margin:0;flex:none;cursor:pointer}
  .ctl.filt small{color:var(--muted);font-variant-numeric:tabular-nums}
  /* Each box's ramp, so the boxes are the legend. */
  .ctl.filt .sw{flex:none;width:22px;height:8px;border-radius:4px}
  .ctl.filt select{display:block;width:100%;margin:5px 0 3px;background-color:var(--well);color:var(--fg);
    border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:.8rem;cursor:pointer}
  /* City names, drawn by the page (see drawCities). A dot and a name beside
     it, haloed in the page colour so it reads over any tile, and the million-
     plus cities a little heavier. The name sits right of the dot, or left
     (.l), above (.t) or below (.b) when that is taken. */
  .leaflet-div-icon.city{background:none;border:0}
  .city i{position:absolute;left:-2.5px;top:-2.5px;width:5px;height:5px;border-radius:50%;background-color:var(--muted);opacity:.85}
  .city span{position:absolute;left:5px;top:-8px;line-height:16px;white-space:nowrap;
    font:500 11px system-ui,sans-serif;color:var(--muted);
    text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 2px var(--bg)}
  .city.big span{font-weight:600;color:var(--fg);opacity:.85}
  .city.l span{left:auto;right:5px}
  .city.t span,.city.b span{left:0;transform:translateX(-50%)}
  .city.t span{top:-21px} .city.b span{top:3px}
  #err{position:absolute;z-index:2;left:16px;right:16px;top:16px;background:var(--tint2);border:1px solid var(--accent2);border-radius:12px;padding:14px 16px;display:none}
  /* Smaller on a phone: it was most of the screen (Carter, 2026-09-21: "make
     a little smaller on mobile? and so i can scroll within card"). LAST in
     the sheet on purpose: same specificity as the .pp rules above, so order
     decides, and placed above them it lost every property (the trap list in
     CLAUDE.md, again). */
  @media (max-width:640px){
    /* The whole screen is the map: no footer under it (the tab bar stays, it
       is how you get anywhere else). Carter, 2026-09-24. */
    footer.site{display:none}
    .ctl.who .riderbadge .badge{padding:6px 12px;font-size:.82rem}
    /* The zoom buttons side by side in the top-right corner. */
    .leaflet-top.leaflet-right .leaflet-control-zoom{display:flex;flex-direction:row}
    .leaflet-top.leaflet-right .leaflet-control-zoom a{border-bottom:0}
    .leaflet-top.leaflet-right .leaflet-control-zoom a + a{border-left:1px solid #ccc}
    .leaflet-top.leaflet-right .leaflet-control-zoom-in{border-radius:4px 0 0 4px}
    .leaflet-top.leaflet-right .leaflet-control-zoom-out{border-radius:0 4px 4px 0}
    .leaflet-popup-content{margin:10px 12px;line-height:1.35}
    .pp h3{font-size:.92rem}
    .pp .n{font-size:.76rem;margin:4px 0 2px}
    .pp li{font-size:.82rem;padding:2px 0;gap:6px}
    /* An operating coaster's opening year is a desktop extra; the phone card
       has no room for it. Defunct years stay — they are the point of that list. */
    .pp li .yrs.op{display:none}
  }
</style>
</head>

<div id="map" role="application" aria-label="Map of every park"></div>

<footer class="site"><div class="container foot-inner">
  <div>&copy; <span id="y"></span> Coaster Hub &middot; coasterhub.org</div>
  <div><a href="/">Home</a> &nbsp;&middot;&nbsp; <a href="/map">Map</a> &nbsp;&middot;&nbsp; <a href="/credits">Credits</a> &nbsp;&middot;&nbsp; <a href="/add">Add new</a> &nbsp;&middot;&nbsp; <a href="/edit">Edit</a> &nbsp;&middot;&nbsp; <a href="/sitemap">Site map</a></div>
</div></footer>

<script src="/app.js?v=20260805b"></script>
<script>
document.getElementById('y').textContent=new Date().getFullYear();
CoasterHub.initNav('map');

function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fail(e){console.error(e);document.getElementById('err').style.display='block';}

// Whose map. The parks and the numbers on them are the same for everybody —
// operating coasters is a fact about the park. A rider adds what is theirs:
// the rider in the URL, or, with nobody in the URL, whoever is signed in — the
// same rule /count uses. That gives every coaster in a popup a tick when they
// have the credit, "12 of 15" under the park's name, and the two
// checkboxes top-left that keep or drop the parks they have been to. Nobody
// means none of that: a map of what each park has.
var slug=CoasterHub.currentUser();

var map=L.map('map',{scrollWheelZoom:true,worldCopyJump:true,zoomControl:false}).setView([30,-40],2);
// The zoom buttons. On a phone they go top-RIGHT, side by side, above the
// rider switcher, so the Visited / Compare box can have the top-left corner
// to itself (Carter, 2026-09-24). Added before the switcher: Leaflet stacks a
// corner's controls in the order they are added.
var PHONE=window.matchMedia('(max-width:640px)').matches;
L.control.zoom({position: PHONE ? 'topright' : 'topleft'}).addTo(map);
// The basemap, exactly as the profile page picks it: Esri's canvas tiles, no
// key, dark or light to match the theme, OpenStreetMap if Esri stops
// answering. See profile.html for the history behind each choice.
//
// No place names IN THE TILES, on purpose — the page draws its own now, see
// drawCities below (2026-09-24). Esri's matching Reference layer (the canvas
// base's city labels: Canvas/World_Dark_Gray_Reference, same host, no key) was
// on for an hour on 2026-09-21 and came straight off — the labels sit under
// the discs and every park is at a city, so "San Jose" was a disc with a
// word poking out of it (Carter: "maybe turn them off this isnt good"). The
// county borders he asked to lose are drawn INTO the base tiles; a raster
// tile is a picture, there is no layer to switch off.
var ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
var TILES={
  dark: {url:ESRI+'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',  attribution:'Tiles &copy; Esri'},
  light:{url:ESRI+'World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', attribution:'Tiles &copy; Esri'}
};
var FALLBACK={url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attribution:'&copy; OpenStreetMap contributors', native:19};
var base=null, fellBack=false;
function setBase(spec){
  var layer=L.tileLayer(spec.url,{attribution:spec.attribution, maxNativeZoom:spec.native||16, maxZoom:19});
  var ok=false, bad=0;
  layer.on('tileload',function(){ ok=true; });
  layer.on('tileerror',function(){ if(!ok && !fellBack && ++bad>=8){ fellBack=true; setBase(FALLBACK); } });
  if(base) map.removeLayer(base);
  base=layer.addTo(map);
}
function mapTheme(){ return document.documentElement.getAttribute('data-theme')==='light' ? 'light' : 'dark'; }
setBase(TILES[mapTheme()]);
// Not if the tiles fell back to OpenStreetMap: a theme toggle must not put
// the dead server back. Same guard as the profile page.
document.documentElement.addEventListener('ch:themechange',function(){ if(!fellBack) setBase(TILES[mapTheme()]); });

// The rider switcher, on the map's top-right corner since there is no hero to
// hold it. app.js builds the badge into the host exactly as it does on /count;
// its menu is positioned fixed at the end of <body>, so the map cannot clip it.
var who=L.control({position:'topright'});
who.onAdd=function(){
  var d=L.DomUtil.create('div','ctl who');
  d.innerHTML='<span class="badge" id="hero_badge">Global</span>';
  L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
  return d;
};
who.addTo(map);
CoasterHub.riderBadge(document.getElementById('hero_badge'),'map',slug);

// A rider whose log cannot be read gets the everyone map rather than a map
// that ticks nothing and says "0 of 15" at every park. Who is signed in is
// asked either way now: it decides whose friends the compare list offers, and
// whether this is somebody ELSE's map (which opens on their visited parks).
var acctP = CoasterHub.me().catch(function(){ return null; });
var whose = slug ? Promise.resolve(slug)
  : acctP.then(function(a){ return (a && a.slug) || null; });
Promise.all([
  whose.then(function(s){ return s ? CoasterHub.fetchRides(s).catch(function(){ return null; }) : null; }),
  CoasterHub.fetchCoasters(),
  CoasterHub.fetchParks(),
  acctP,
  whose
]).then(function(res){
  var log=res[0], coasters=res[1].coasters, parks=res[2], acct=res[3], who=res[4];
  var MINE={}; if(log) (log.rides||[]).forEach(function(r){ MINE[r.c]=1; });
  // Somebody else's map: a rider in the URL who is not the one signed in.
  var others = !!(slug && log && !(acct && acct.slug===slug));
  // What the map calls its rider: "You" on your own, their name on theirs.
  var YOU = others ? (log.user||slug) : 'You';

  // The rider being compared against (Carter, 2026-09-24: "select one of your
  // friends and see where they've been ... and/or where neither of you have
  // been"). null until one is picked.
  var CMP=null;   // {slug, name, has:{coasterId:1}}

  // Per park: its coasters, operating and closed, A-Z within each, and whether
  // the rider has any credit there. A closed one counts: it was still a visit.
  var P={};
  Object.keys(parks).forEach(function(name){
    P[name]={ name:name, lat:parks[name].lat, lon:parks[name].lon, region:parks[name].region||'', open:[], closed:[] };
  });
  coasters.forEach(function(c){
    if(!c.park || !P[c.park]) return;
    (c.closed ? P[c.park].closed : P[c.park].open).push(c);
  });
  var all=Object.keys(P).map(function(k){ return P[k]; });
  all.forEach(function(p){
    p.open.sort(function(a,b){ return a.name.localeCompare(b.name); }); p.closed.sort(function(a,b){ return a.name.localeCompare(b.name); });
    p.been = !!log && p.open.concat(p.closed).some(function(c){ return MINE[c.id]; });
  });
  var placed=all.filter(function(p){ return p.lat!=null && p.lon!=null; });
  function theyBeen(p){ return !!CMP && p.open.concat(p.closed).some(function(c){ return CMP.has[c.id]; }); }

  // One row per coaster, operating or defunct: a tick when there is somebody
  // to tick for (two when comparing — the map's rider in teal, the other in
  // red), the name as a link, and its years on the right. Defunct rows always
  // carry theirs; operating rows carry the opening year on a desktop, where
  // the card is wide enough (Carter, 2026-09-24: "make park popups bigger to
  // show ride opening years on the right like how defunct has").
  function tick(got, cls, who){
    return '<span class="tick'+cls+'" aria-label="'+esc(who)+': '+(got?'ridden':'not ridden')+'">'+(got?'✓':'')+'</span>';
  }
  function row(c){
    var got=!!MINE[c.id], cl=c.closed ? String(c.closed).slice(0,4) : '';
    var theirs=CMP && !!CMP.has[c.id];
    var op=c.opened ? String(c.opened).slice(0,4) : (c.yr ? String(c.yr) : '');
    var yrs = cl ? (op ? esc(op)+'–'+cl : 'closed '+cl) : esc(op);
    return '<li class="'+(log?((got||theirs)?'got':'miss'):'')+(cl?' gone':'')+'">'
      +(log ? tick(got,'',YOU) : '')
      +(CMP ? tick(theirs,' them',CMP.name) : '')
      +'<a href="'+esc(CoasterHub.coasterHref(c))+'">'+esc(c.name)+'</a>'
      +(yrs ? '<span class="yrs'+(cl?'':' op')+'">'+yrs+'</span>' : '')
      +'</li>';
  }
  // The headline is "11 operating · 13 ridden" (his wording, third try): the first number is what is
  // operating (the number on the disc), the second is everything the rider
  // has ridden here, defunct ones included — so it can be the bigger of the
  // two, and the defunct list underneath is where the difference lives.
  // (Carter, 2026-09-21: "write it as 11 coasters > 13 ridden or however
  // many. then at the bottom show all defunct coasters too with closing years
  // and checkboxes as relevant". At Knott's that is 10 operating + 3 defunct.)
  // Comparing, the second half is each of you: "11 operating · you 13 · Sean 4".
  function popup(p){
    var both=p.open.concat(p.closed);
    var ridden=both.filter(function(c){ return MINE[c.id]; }).length;
    var h='<div class="pp"><h3><a href="'+esc(CoasterHub.parkHref(p.name))+'">'+esc(p.name)+' →</a></h3>'
      +'<small>'+esc(p.region)+'</small>'
      +'<div class="n">'+(p.open.length ? p.open.length+' operating' : 'No operating coasters');
    if(CMP){
      var th=both.filter(function(c){ return CMP.has[c.id]; }).length;
      h+=' · <span class="k1">✓ '+esc(YOU.toLowerCase()==='you'?'you':YOU)+' '+ridden+'</span>'
        +' · <span class="k2">✓ '+esc(CMP.name)+' '+th+'</span>';
    } else if(log) h+=' · '+ridden+' ridden';
    h+='</div>';
    if(p.open.length) h+='<ul>'+p.open.map(row).join('')+'</ul>';
    if(p.closed.length) h+='<div class="n dead">'+p.closed.length+' defunct</div><ul class="dead">'+p.closed.map(row).join('')+'</ul>';
    return h+'</div>';
  }

  // The colour ramps: pale at one coaster, a middle, deep at the busiest park.
  // Square-root, not linear, because the median park has three and a linear
  // ramp would leave two-thirds of the map the same pale colour. Dark digits
  // on the pale end, white once the fill is dark enough to carry them.
  //
  // One ramp per KIND of park, all the same shape, so the colour says which
  // kind and the depth still says how big (Carter, 2026-09-24: "make 'visited'
  // blue to separate with the same color gradient"). Yellow is a park the
  // map's rider has not been to (and every park on the everyone view), blue
  // one they have. Comparing adds red, only the other rider, and green, both
  // of you. (Until Launch Yellow, the same day, not-visited was red and "only
  // them" amber; amber sat too close to the new yellow.)
  var MAX=placed.reduce(function(m,p){ return Math.max(m,p.open.length); },1);
  var RAMPS={
    red:   {stops:[[255,190,178],[255,90,95],[140,10,30]],  ink:'#3a0810'},
    // The site's yellow (Launch Yellow, 2026-09-24). White digits cannot be
    // read on it until it is deep, so it keeps dark digits much longer (dark).
    yellow:{stops:[[255,238,168],[255,204,31],[168,112,0]],  ink:'#2e2200', dark:.8},
    blue:  {stops:[[196,222,255],[74,144,255],[14,46,140]], ink:'#0a1f4a'},
    amber: {stops:[[255,228,170],[240,160,30],[140,78,0]],  ink:'#3a2400'},
    // "Both of you" was purple until Carter, 2026-09-24: "the purple feels
    // similar to blue". Green is the one hue left that none of the other three
    // ramps is near. White digits only once it is deep.
    green: {stops:[[204,242,210],[52,196,108],[8,100,48]],   ink:'#08301a', dark:.6}
  };
  function rampT(t, R){
    var S=(R||RAMPS.red).stops, i=t<.5?0:1, f=(t-i*.5)*2, a=S[i], b=S[i+1];
    return 'rgb('+[0,1,2].map(function(k){ return Math.round(a[k]+(b[k]-a[k])*f); }).join(',')+')';
  }
  function ramp(n, R){
    var t=Math.sqrt(Math.max(0,n-1)/Math.max(1,MAX-1));
    return { bg:rampT(t,R), fg: t<(R.dark||.3) ? R.ink : '#fff' };
  }
  function grad(R){ return 'linear-gradient(to right,'+rampT(0,R)+','+rampT(.5,R)+','+rampT(1,R)+')'; }
  // Which bucket a park is in: the checkbox it answers to, and its ramp.
  function kind(p){
    if(!log) return 'all';
    if(!CMP) return p.been ? 'been' : 'not';
    var t=theyBeen(p);
    return p.been ? (t ? 'both' : 'me') : (t ? 'them' : 'neither');
  }
  var KIND={
    all:{R:RAMPS.yellow}, been:{R:RAMPS.blue}, not:{R:RAMPS.yellow},
    both:{R:RAMPS.green}, me:{R:RAMPS.blue}, them:{R:RAMPS.red}, neither:{R:RAMPS.yellow}
  };
  function iconFor(p){
    var n=p.open.length;
    var full = log && n && p.open.every(function(c){ return MINE[c.id]; });
    var col = n ? ramp(n, KIND[kind(p)].R) : null;
    return L.divIcon({className:'pk'+(n?'':' none')+(full?' mine':''),
      html:'<span'+(col ? ' style="background-color:'+col.bg+';color:'+col.fg+'"' : '')+'>'+n+'</span>',
      iconSize:null, popupAnchor:[0,-10]});
  }
  // Bigger on a desktop, so the years fit on the right; a phone keeps the
  // narrower, shorter card that scrolls inside itself.
  var wide=window.innerWidth>640;
  // A phone's card is one fixed width, a little narrower than it was, and a
  // little shorter (Carter, 2026-09-24: "make these boxes narrower, a tiny bit
  // shorter, and centred horizontally").
  var PW=Math.min(280, window.innerWidth-96);
  var POPUP= wide
    ? {maxWidth:440, minWidth:340, maxHeight:Math.min(560, Math.round(window.innerHeight*0.62)),
       // Auto-pan clear of the zoom buttons and the Visited boxes top-left,
       // and of the switcher top-right.
       autoPanPaddingTopLeft:[230,16], autoPanPaddingBottomRight:[110,16]}
    // On a phone Leaflet's own auto-pan is off: it only nudges a popup until
    // it fits, and with the Visited box's padding on the left that left every
    // card hanging off the right edge. placePhone() below does it instead.
    : {maxWidth:PW, minWidth:PW, maxHeight:Math.min(330, Math.round(window.innerHeight*0.36)), autoPan:false};
  // Slide the map so the open card is centred left-to-right, and sits in the
  // middle of the space between the controls at the top and the note at the
  // bottom — the same place every time, whichever park was tapped.
  function placePhone(e){
    var el=e.popup.getElement(), size=map.getSize();
    if(!el) return;
    var top=0, bottom=size.y;
    var c=map.getContainer().getBoundingClientRect();
    Array.prototype.forEach.call(map.getContainer().querySelectorAll('.leaflet-top .leaflet-control'),function(k){
      top=Math.max(top, k.getBoundingClientRect().bottom - c.top);
    });
    Array.prototype.forEach.call(map.getContainer().querySelectorAll('.leaflet-bottom.leaflet-left .leaflet-control'),function(k){
      bottom=Math.min(bottom, k.getBoundingClientRect().top - c.top);
    });
    top+=8; bottom-=8;
    var h=el.offsetHeight;                          // card plus its tip
    var cardTop=top + Math.max(0, (bottom-top-h)/2);
    var at=map.latLngToContainerPoint(e.popup.getLatLng());
    // The tip's point is 10px above the marker (popupAnchor) and the card's
    // bottom edge is where the tip starts, so the marker lands h+10 below the
    // card's top.
    map.panBy([at.x - size.x/2, at.y - (cardTop + h + 10)], {animate:true});
  }
  if(!wide) map.on('popupopen', placePhone);
  var pts=[];
  var group=L.layerGroup();
  placed.forEach(function(p){
    // Where discs overlap, the bigger park is on top: the one worth clicking
    // is the one you can see. The popup is built when it opens, so it always
    // reflects the comparison as it stands.
    p.marker=L.marker([p.lat,p.lon],{icon:iconFor(p), title:p.name, zIndexOffset:p.open.length*10})
      .bindPopup(function(){ return popup(p); }, POPUP);
    pts.push([p.lat,p.lon]);
  });
  map.addLayer(group);

  // Which parks are on the map. Somebody else's map opens on just the parks
  // they have been to (Carter, 2026-09-24: "when you click on someone else's
  // map make it default to just visited"); your own opens complete.
  var SHOW={all:true, been:true, not:!others, both:true, me:true, them:true, neither:true};
  function shown(p){ return SHOW[kind(p)]; }
  function refresh(){
    var vis=placed.filter(shown);
    group.clearLayers(); vis.forEach(function(p){ group.addLayer(p.marker); });
    var np=document.getElementById('np'), nc=document.getElementById('nc');
    if(np) np.textContent=vis.length;
    if(nc) nc.textContent=vis.reduce(function(a,p){ return a+p.open.length; },0).toLocaleString();
    drawCities();
  }

  // ---- city names --------------------------------------------------------
  // Carter, 2026-09-24: "make it so cities can show up on map again but it's
  // larger cities that come up first in a normal way". The tile labels were
  // on for an hour on 2026-09-21 and came off because they are part of the
  // picture and sat under the discs. These are drawn by the page instead
  // (map-cities.json, GeoNames, 100k people and up — tools/build-cities.mjs),
  // so a name can step aside: the biggest cities are placed first, each one
  // only where it does not cover a disc or a name already placed — to the
  // right of its dot, else the left, else not at all — and how big a city has
  // to be to get a name falls as you zoom in. That is how an ordinary map
  // behaves: Los Angeles from space, Anaheim once you are looking at Orange
  // County. They sit in their own pane below the discs and take no clicks.
  var CITIES=null, cityLayer=L.layerGroup().addTo(map);
  map.createPane('cities'); map.getPane('cities').style.zIndex=450; map.getPane('cities').style.pointerEvents='none';
  // Always on. There was a Cities box for a day; Carter, 2026-09-24: "remove
  // cities checkbox from map". The old ch_map_cities key is no longer read, so
  // somebody who had ticked it off gets the names back.
  // Thousands of people a city needs to be named at each zoom.
  function minPop(z){ return z<=2 ? 6000 : z<=3 ? 3000 : z<=4 ? 1200 : z<=5 ? 600 : z<=6 ? 300 : z<=7 ? 180 : 100; }
  var measure=document.createElement('canvas').getContext('2d');
  function drawCities(){
    cityLayer.clearLayers();
    if(!CITIES) return;
    var z=map.getZoom(), min=minPop(z), size=map.getSize(), taken=[], discs=[];
    function over(list,b){ return list.some(function(t){ return b[0]<t[2] && b[2]>t[0] && b[1]<t[3] && b[3]>t[1]; }); }
    group.eachLayer(function(m){
      var q=map.latLngToContainerPoint(m.getLatLng());
      discs.push([q.x-11,q.y-11,q.x+11,q.y+11]);
    });
    var n=0;
    for(var i=0;i<CITIES.length && n<140;i++){
      var c=CITIES[i]; if(c[3]<min) break;          // biggest first, so the rest are smaller still
      var q=map.latLngToContainerPoint([c[1],c[2]]);
      if(q.x<-50 || q.y<-20 || q.x>size.x+50 || q.y>size.y+20) continue;
      var big=c[3]>=1000;
      // A city of two million is named even where discs crowd it — New York
      // would otherwise never get a name, it has parks on every side. Its name
      // goes under the discs rather than beside them. Smaller ones step aside.
      var mega=c[3]>=2000;
      var hit=function(b){ return over(taken,b) || (!mega && over(discs,b)); };
      measure.font=(big?'600 ':'500 ')+'11px system-ui,sans-serif';
      // The dot may sit under a disc (the disc wins, it is on top); the NAME
      // may not. Four places to try, in the order a map reads them.
      var w=measure.measureText(c[0]).width+4;
      var spots=[['',[q.x+4,q.y-8,q.x+6+w,q.y+8]], [' l',[q.x-6-w,q.y-8,q.x-4,q.y+8]],
                 [' t',[q.x-w/2,q.y-20,q.x+w/2,q.y-4]], [' b',[q.x-w/2,q.y+4,q.x+w/2,q.y+20]]];
      var spot=null;
      for(var k=0;k<spots.length && !spot;k++) if(!hit(spots[k][1])) spot=spots[k];
      if(!spot) continue;
      taken.push(spot[1]);
      L.marker([c[1],c[2]],{pane:'cities', interactive:false, keyboard:false,
        icon:L.divIcon({className:'city'+(big?' big':'')+spot[0], iconSize:null,
                        html:'<i></i><span>'+esc(c[0])+'</span>'})}).addTo(cityLayer);
      n++;
    }
  }
  map.on('zoomend moveend', drawCities);
  fetch('/map-cities.json').then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ CITIES=j; drawCities(); }).catch(function(){ /* no names: still a map */ });
  map.attributionControl.addAttribution('Cities: <a href="https://www.geonames.org/">GeoNames</a>');

  refresh();
  if(pts.length) map.fitBounds(pts,{padding:[30,30]});

  // The boxes, top-left under the zoom buttons (Carter, 2026-09-21:
  // "checkboxes in the top left that show ridden and not ridden while you're
  // logged in"). A park is visited when the rider has any credit there.
  // Carter, on seeing it: "call it visited and not visited" — the coaster
  // ticks in the popup stay Ridden, since those are about rides. Each box
  // carries a swatch of its ramp, so the boxes are the legend too.
  //
  // Comparing turns the two into four — both of you, only you, only them,
  // neither of you. Nobody to ask about (signed out, nobody in the URL): no
  // control at all.
  function box(k, label, count, R){
    return '<label><input type="checkbox" data-k="'+k+'"'+(SHOW[k]?' checked':'')+'>'
      +(R ? '<span class="sw" style="background-image:'+grad(R)+'"></span>' : '')
      +esc(label)+' <small>'+count+'</small></label>';
  }
  var filt=L.control({position:'topleft'}), fbox=null, FRIENDS=null;
  filt.onAdd=function(){
    fbox=L.DomUtil.create('div','ctl filt');
    L.DomEvent.disableClickPropagation(fbox); L.DomEvent.disableScrollPropagation(fbox);
    return fbox;
  };
  if(log) filt.addTo(map);
  function drawFilt(){
    if(!fbox) return;
    var h='';
    if(log){
      var cnt={}; placed.forEach(function(p){ var k=kind(p); cnt[k]=(cnt[k]||0)+1; });
      if(!CMP){
        h+=box('been','Visited',cnt.been||0,RAMPS.blue)+box('not','Not visited',cnt.not||0,RAMPS.yellow);
      } else {
        h+=box('both','Both of you',cnt.both||0,RAMPS.green)
          +box('me','Only '+(others?YOU:'you'),cnt.me||0,RAMPS.blue)
          +box('them','Only '+CMP.name,cnt.them||0,RAMPS.red)
          +box('neither','Neither of you',cnt.neither||0,RAMPS.yellow);
      }
      h+='<select id="cmp" aria-label="Compare with"><option value="">Compare with…</option>'+cmpOptions()+'</select>';
    }
    fbox.innerHTML=h;
    Array.prototype.forEach.call(fbox.querySelectorAll('input[data-k]'),function(el){
      el.onchange=function(){ SHOW[this.getAttribute('data-k')]=this.checked; refresh(); };
    });
    var sel=fbox.querySelector('#cmp');
    if(sel){ sel.value=CMP?CMP.slug:''; sel.onchange=function(){ compare(this.value); }; }
  }
  // Who can be compared against: your friends first (the riders you follow,
  // and you yourself when this is somebody else's map), then everybody else.
  function cmpOptions(){
    var skip=who, fr=FRIENDS||[], inF={}, o='';
    fr.forEach(function(s){ inF[s]=1; });
    var users=CoasterHub.USERS.filter(function(u){ return u.slug!==skip; })
      .sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
    var f=users.filter(function(u){ return inF[u.slug]; }), rest=users.filter(function(u){ return !inF[u.slug]; });
    function opt(u){ return '<option value="'+esc(u.slug)+'">'+esc(acct && u.slug===acct.slug ? u.name+' (you)' : u.name)+'</option>'; }
    if(f.length) o+='<optgroup label="Friends">'+f.map(opt).join('')+'</optgroup>';
    if(rest.length) o+='<optgroup label="'+(f.length?'Everyone else':'Riders')+'">'+rest.map(opt).join('')+'</optgroup>';
    return o;
  }
  function compare(s){
    if(!s){ CMP=null; redraw(); return; }
    var u=CoasterHub.USERS.filter(function(x){ return x.slug===s; })[0];
    CoasterHub.fetchRides(s).then(function(l){
      var has={}; (l.rides||[]).forEach(function(r){ has[r.c]=1; });
      CMP={slug:s, name:(u&&u.name)||l.user||s, has:has};
      redraw();
    }).catch(function(){ CMP=null; redraw(); });
  }
  function redraw(){
    map.closePopup();
    placed.forEach(function(p){ p.marker.setIcon(iconFor(p)); });
    drawFilt(); refresh();
  }
  drawFilt();
  if(log){
    // Friends are the signed-in rider's follows. A 503 (follows not migrated),
    // signed out, or no rider of your own: no Friends group, everybody listed.
    var me=acct && acct.slug;
    Promise.all([
      CoasterHub.fetchUsers(),
      me ? fetch('/api/follows/'+encodeURIComponent(me),{cache:'no-store'}).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }) : null
    ]).then(function(r){
      var f=r[1] ? (r[1].following||[]).map(function(x){ return x.slug; }) : [];
      if(me && others) f.unshift(me);
      FRIENDS=f; drawFilt();
    });
  }

  // The counts and the legend, bottom-left. This used to also fold out the
  // parks with no coordinates; Carter, 2026-09-21: "hide the not placed
  // button, these are all traveling coasters & companies" — a fair with no
  // fixed place is not a park missing a pin, so the note no longer says so.
  // (/edit still lists un-geocoded parks for the day one of them is real.)
  // With a rider, the swatches on the boxes are the legend and the bar here
  // just says what the depth means.
  var note=L.control({position:'bottomleft'});
  note.onAdd=function(){
    var d=L.DomUtil.create('div','ctl');
    var tot=placed.reduce(function(a,p){ return a+p.open.length; },0);
    d.innerHTML='<b id="np">'+placed.length+'</b> parks · <b id="nc">'+tot.toLocaleString()+'</b> operating coasters'
      +' · 1 <span class="ramp" title="Operating coasters, fewest to most" style="background-image:'+grad(log?RAMPS.blue:RAMPS.yellow)+'"></span> '+MAX;
    L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
    return d;
  };
  note.addTo(map);
  refresh();
  document.title=(slug && log && log.user ? log.user+'’s Map' : 'Map')+' — Coaster Hub';
  document.body.setAttribute('data-ready','1');
}).catch(fail);
</script>
</body>
</html>
