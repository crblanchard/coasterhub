<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- The Solid pin (Carter, 2026-09-24, picked from two rounds of sketches:
       "it shows like this is the hub, this is where stuff is"). A filled map
       pin with a dark window in its head; in the window, a small hill and the
       yellow car. It replaced the lift-hill-and-loop track. The window is the
       site's dark ground, so the mark reads the same on the dark and the light
       theme. Keep mark.svg, favicon.svg, favicon-small.svg, logo.svg and
       tools/render-icons.mjs in step. -->
  <g>
    <path d="M32,61 C32,61 12,41 12,25 A20,20 0 1 1 52,25 C52,41 32,61 32,61 Z" fill="#4cc3ff" stroke="#4cc3ff" stroke-width="2" stroke-linejoin="round"/>
