<!DOCTYPE html>

<head>

<link rel="stylesheet" href="/style.css?v=20260805b">
<script>/* theme: set before paint so light mode never flashes dark (see initTheme in app.js) */try{if(localStorage.getItem("ch_theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>

<link rel="icon" href="/favicon-32.png?v=20260924b" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16.png?v=20260924b" sizes="16x16" type="image/png">

<meta property="og:title" content="Global rankings — Coaster Hub">
<meta property="og:description" content="Every coaster more than one rider has ranked, most agreed-on first.">

<meta name="twitter:card" content="summary_large_image">
<style>
  #loading{color:var(--muted);padding:40px 0}
  #err{display:none;background:var(--panel);border:1px solid var(--bad);border-radius:12px;padding:20px;color:var(--fg)}
  /* The same row the /rankings summary draws, with a rank in front of it.
     The row opens, so .srow is only the card: the flex layout it used to carry
     lives on .stog, the button that is the whole row. */
  .shared{display:flex;flex-direction:column;gap:6px;margin-bottom:56px}
  .srow{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .stog{display:flex;align-items:flex-start;gap:12px;width:100%;padding:9px 12px;
        background:transparent;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
  /* Only where a pointer can actually hover — on a phone a :hover background
     sticks to the last thing tapped. --tint, not --tint2: the open row keeps
     its wash while the cursor sits on it and it should stay a whisper. */
  @media (hover:hover){ .stog:hover{background:var(--tint)} }
  .srow .pos{font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent2);
             min-width:2.2em;text-align:right;flex:none;font-size:.95rem;margin-top:1px}
  .srow .n{flex:1;min-width:0}
  .srow .n b{display:block;font-weight:600;font-size:.93rem;line-height:1.3;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Where it is: the park and its region lead, the model follows on the same
     line. Named for what they are, not "the span inside .n" — the row has
     gained and lost spans twice now (CLAUDE.md). */
  .srow .n .sub{display:block;color:var(--muted);font-size:.77rem;line-height:1.35;
                overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Literal, not \00b7 — CSS eats the space that terminates a hex escape,
     so the escaped form loses the gap after the dot. */
  .srow .n .mk::before{content:" · "}
  /* Centred against the row, not hung from its top: the left-hand side is two
     lines on a desktop and three on a phone, and the count has no reason to sit
     against whichever one happens to be first. */
  .srow .meta{color:var(--muted);font-size:.8rem;text-align:right;flex:none;
              font-variant-numeric:tabular-nums;align-self:center}
  .srow .meta b{display:block;color:var(--accent2);font-weight:700}
  .srow .chev{color:var(--muted);flex:none;align-self:center;transition:transform .15s ease}
  .stog[aria-expanded="true"] .chev{transform:rotate(180deg)}
  /* Opened: everyone who ranked it, best placing first, each a way into that
     rider's own list. Scoped to .srow because .who is also a profile class. */
  /* Who ranked it: a row of chips along the bottom, not a column down the
     side (Carter, 2026-09-25: "put people along the bottom to save space"). */
  .srow .who{border-top:1px solid var(--line);padding:9px 12px 11px}
  .srow .who .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
  /* The coaster's stats under who ranked it (Carter, 2026-09-25). */
  .srow .who .go{color:var(--accent2);font-size:.86rem;font-weight:600;text-decoration:none}
  .srow .who[hidden]{display:none}
  .srow .wrow{display:inline-flex;align-items:baseline;gap:6px;padding:5px 11px;border:1px solid var(--line);
    border-radius:999px;background-color:var(--soft);text-decoration:none;color:var(--fg)}
  .srow .wrow:hover{border-color:var(--accent2)}
  /* The name, park, location and model are links; the rest of the row opens
     and closes it, and so does the chips' background. */
  .srow{cursor:pointer}
  .srow .n a{color:inherit;text-decoration:none}
  /* Open, the name, park, place and model are links — and look it. */
  .stog[aria-expanded="true"] .n a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
  .stog[aria-expanded="true"] .n a:hover{color:var(--accent2);text-decoration-color:currentColor}

  .srow .wn{font-size:.84rem}
  .srow .wp{color:var(--accent2);font-weight:700;font-size:.84rem;flex:none;
            font-variant-numeric:tabular-nums}
  /* A phone never has room for park, region and model on one line, and
     truncating it loses the model every time. Give the model its own line
     there and drop the separator that joined them. */
  @media (max-width:560px){
    .stog{padding:8px 11px;gap:10px}
    .srow .n .sub{overflow:visible;text-overflow:clip;white-space:normal}
    .srow .n .pl,.srow .n .mk{display:block;overflow:hidden;
                              text-overflow:ellipsis;white-space:nowrap}
    .srow .n .mk::before{content:none}
  }
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:20px}
  .seg button{background:transparent;border:0;color:var(--muted);padding:10px 16px;cursor:pointer;
    font-size:.9rem;font-family:inherit}
  .seg button.on{background:var(--tint2);color:var(--fg)}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="/">
    <img src="/mark.svg?v=20260924b" alt="" class="brand-mark" width="40" height="40">
    <span class="brand-text">Coaster <b>Hub</b></span>
  </a>
  <nav class="links">
    <a href="/" data-nav="riders">Home</a>
    <a href="/rankings" data-nav="rankings">Rankings</a>
    <a href="/log" data-nav="log" class="navlog">+ Log</a>
    <a href="/credits" data-nav="count">Credits</a>
    <a href="/account" data-nav="profile">Profile</a>
  </nav>
  <div class="people" id="people"></div>
</div></header>

<section class="hero" style="--hero-t:56px;--hero-b:26px"><div class="container">
  <!-- The badge names the scope and the headline names the page, the same way
       round as every other per-rider page. There is no sentence under it any
       more: it said what the list already shows, and the way to one person's
       list is the switcher on /rankings you came from, not a line of prose.
       (Carter's call, 2026-09-17.) -->
  <span class="badge" id="hero_badge">Global</span>
  <h1 style="max-width:18ch">Global rankings.</h1>
</div></section>

<section class="block" style="padding-top:18px"><div class="container">
  <!-- Two ways to read agreement, and they answer different questions: how many
       people rate it, or how high the people who rate it put it. -->
  <div class="seg" id="sortby">
    <button data-s="avg" class="on">Highest placed</button>
    <button data-s="lists">Most lists</button>
  </div>
  <div id="loading" data-loading>Loading&hellip;</div>
  <div id="err">
    <strong>Couldn&rsquo;t load the rankings.</strong> This page reads the API, so it needs to be served over the web.
  </div>
  <div class="shared" id="list"></div>
</div></section>

<footer class="site"><div class="container foot-inner">
  <div>&copy; <span id="y"></span> Coaster Hub &middot; coasterhub.org</div>
  <div><a href="/">Home</a> &nbsp;&middot;&nbsp; <a href="/coasters">Coasters</a> &nbsp;&middot;&nbsp; <a href="/parks">Parks</a> &nbsp;&middot;&nbsp; <a href="/manufacturers">Manufacturers</a> &nbsp;&middot;&nbsp; <a href="/locations">Locations</a> &nbsp;&middot;&nbsp; <a href="/map">Map</a><span data-contrib hidden></span></div>
</div></footer>

<script src="/app.js?v=20260805b"></script>
<script>
document.getElementById('y').textContent=new Date().getFullYear();
CoasterHub.initNav('rankings');
// The switcher, same as every other rankings page. currentUser() is empty here
// — this page is the global list whatever rider you last looked at — so the
// badge reads "Global" and the menu is the way out: a name goes to that rider's
// list, Global goes back to /rankings.
CoasterHub.riderBadge(document.getElementById('hero_badge'),'rankings',CoasterHub.currentUser());

var $=function(id){return document.getElementById(id);};
var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};

var ROWS=[], SORT='avg';

// Agreement, two ways, and the default is the AVERAGE (Carter's call,
// 2026-09-17). "Highest placed" is the average placing among the coasters on
// more than one list — the 2+ filter is what makes an average mean anything,
// since one person's number one is not a consensus. "Most lists" is still here
// as the other question, but it answers where people have BEEN rather than what
// is best: six riders having done Steel Vengeance says Cedar Point is popular.
function sorted(){
  return ROWS.slice().sort(function(a,b){
    if (SORT==='avg') return (a.sum/a.n) - (b.sum/b.n) || b.n - a.n;
    return b.n - a.n || (a.sum/a.n) - (b.sum/b.n);
  });
}

function render(){
  var list=sorted();
  if(!list.length){
    $('list').innerHTML='<div class="note">Nothing on more than one list yet.</div>';
    return;
  }
  $('list').innerHTML=list.map(function(t,i){
    var c=t.c, avg=Math.round((t.sum/t.n)*10)/10, mk=CoasterHub.maker(c);
    // No teaser of who ranked it: it was clipped after two names on a phone and
    // said less than the row costs (Carter, 2026-09-17). Opening the row is
    // where the answer lives — everyone who ranked it and where, each name a
    // link to that rider's own list.
    var full=t.who.map(function(w){
      return '<a class="wrow" href="'+CoasterHub.userPageHref(w.slug,'rankings')+'">'
        +'<span class="wn">'+esc(w.name)+'</span>'
        +'<span class="wp">#'+w.pos+'</span></a>';
    }).join('');
    return '<div class="srow">'
      +'<div class="stog" role="button" tabindex="0" aria-expanded="false" data-i="'+i+'">'
        +'<span class="pos">'+(i+1)+'</span>'
        +srowName(c, mk)
        +'<span class="meta"><b>'+t.n+' lists</b>avg #'+avg+'</span>'
        +'<svg class="chev" viewBox="0 0 24 24" width="13" height="13" fill="none" '
          +'stroke="currentColor" stroke-width="3" stroke-linecap="round" '
          +'stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>'
      +'</div>'
      +'<div class="who" hidden><div class="chips">'+full+'</div>'
        +CoasterHub.coasterFacts(c, null, c.park?'<a class="go" href="'+esc(CoasterHub.coasterHref(c))+'">Coaster page &rarr;</a>':'')+'</div>'
      +'</div>';
  }).join('');
  // One open at a time would hide the comparison you just opened it to make,
  // so they are independent toggles.
  srowToggles($('list'));
}

Array.prototype.forEach.call(document.querySelectorAll('#sortby button'), function(b){
  b.addEventListener('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('#sortby button'), function(x){
      x.classList.toggle('on', x===b);
    });
    SORT=b.getAttribute('data-s');
    render();
  });
});

// Every rider's list, tallied. Same computation the /rankings summary does with
// its top ten, without the slice — this page exists for when that ten stops
// being enough.
CoasterHub.fetchUsers().then(function(){
  var users=CoasterHub.USERS.slice();
  return Promise.all([CoasterHub.fetchCoasters(), CoasterHub.fetchParks()].concat(
    users.map(function(u){
      return fetch('/api/rankings/'+encodeURIComponent(u.slug))
        .then(function(r){ return r.ok?r.json():{order:[]}; })
        .catch(function(){ return {order:[]}; });
    })
  )).then(function(res){
    var coasters=res[0].coasters, parks=res[1], all=res.slice(2), BYID={};
    coasters.forEach(function(c){ var pk=parks[c.park];
      BYID[c.id]=Object.assign({},c,{loc:(pk&&pk.region)?pk.region:''}); });

    var tally={};
    // By ride, not by row: a relocated coaster's rows share a credit key
    // (023-same-ride.sql), so riders who ranked it at different parks ranked
    // one ride, shown at its home now. Unknown ids go first — a merged-away
    // coaster is not a row — then a second row of the same ride, so positions
    // match what the rider's own page shows.
    users.forEach(function(u,i){
      var seen={};
      (all[i].order||[]).filter(function(id){
        if(!BYID[id]) return false;
        var k=CoasterHub.rideKey(BYID[id]); if(seen[k]) return false; seen[k]=1; return true;
      }).forEach(function(id,pos){
        var k=CoasterHub.rideKey(BYID[id]);
        var t=tally[k]||(tally[k]={c:BYID[k]||BYID[id],n:0,sum:0,who:[]});
        t.n++; t.sum+=pos+1; t.who.push({name:u.name,slug:u.slug,pos:pos+1});
      });
    });
    ROWS=Object.keys(tally).map(function(k){ return tally[k]; })
      .filter(function(t){ return t.n>1; });
    ROWS.forEach(function(t){ t.who.sort(function(a,b){ return a.pos-b.pos; }); });

    $('loading').style.display='none';
    render();
  });
}).catch(function(e){
  console.error(e);
  $('loading').style.display='none';
  $('err').style.display='block';
});

// A shared-ranking row: the name, park, location and model each go to their
// page; a tap anywhere else on the row — the chips' background included —
// opens or closes it (Carter, 2026-09-25). A rider chip goes to their list.
function srowName(c, mk){
  var L=function(t,h){ return h ? '<a href="'+esc(h)+'">'+esc(t)+'</a>' : esc(t); };
  return '<span class="n"><b>'+L(c.name, c.park ? CoasterHub.coasterHref(c) : '')+'</b><span class="sub">'
    +'<span class="pl">'+L(c.park, c.park ? CoasterHub.parkHref(c.park) : '')
    +(c.loc?' \u00b7 '+L(c.loc.replace(/, US$/,''), CoasterHub.locationHref(c.loc)):'')+'</span>'
    +(mk?'<span class="mk">'+L(mk, c.manu ? CoasterHub.makerHref(c.manu, c.model||null) : '')+'</span>':'')+'</span></span>';
}
function srowToggles(root){
  Array.prototype.forEach.call(root.querySelectorAll('.srow'), function(row){
    var tog=row.querySelector('.stog'), who=row.querySelector('.who');
    var flip=function(){ var open=tog.getAttribute('aria-expanded')==='true';
      tog.setAttribute('aria-expanded', open?'false':'true'); who.hidden=open; };
    // Closed, any tap opens it (links included); open, the links go.
    row.addEventListener('click', function(e){
      var a=e.target.closest('a');
      if(a){ if(tog.getAttribute('aria-expanded')==='true') return; e.preventDefault(); }
      flip(); });
    tog.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); } });
  });
}
</script>
</body>
</html>
