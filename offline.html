<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>No signal — Coaster Hub</title>
<meta name="robots" content="noindex">
<!-- What sw.js shows for a page you have not opened before, when there is no
     signal (2026-10-30). Self-contained on purpose: no style.css, no app.js,
     because either could be the thing that is not saved. -->
<script>try{var chT=localStorage.getItem("ch_theme")}catch(e){}if(chT!=="dark")document.documentElement.setAttribute("data-theme","light")</script>
<style>
  :root{--bg:#080e20;--panel:#15203a;--fg:#f3f4f6;--muted:#9ca8bb;--line:rgba(255,255,255,.10);--accent2:#4cc3ff;--fill:#ffcc1f;--onfill:#16181b}
  :root[data-theme="light"]{--bg:#f5f5f3;--panel:#fff;--fg:#16181b;--muted:#5f6770;--line:rgba(22,24,27,.13);--accent2:#0a6aa0}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:calc(48px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
  main{max-width:440px;margin:0 auto}
  h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:0 0 8px}
  p{color:var(--muted);line-height:1.5;margin:0 0 22px}
  .links{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 0 20px}
  .links a{padding:15px 16px;color:var(--fg);font-weight:600;text-decoration:none;border-top:1px solid var(--line)}
  .links a:first-child{border-top:0}
  .links a span{float:right;color:var(--muted)}
  button{font:inherit;font-weight:700;background:var(--fill);color:var(--onfill);border:0;border-radius:12px;padding:13px 18px;width:100%;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>No signal</h1>
  <p>This page needs a connection. The pages you have opened on this phone before still work.</p>
  <div class="links" id="links"><a href="/">Home <span>&rarr;</span></a></div>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>
// Who you are comes from the copy sw.js kept of /api/auth/me.
fetch('/api/auth/me',{credentials:'same-origin'}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
  var a=d&&d.account; if(!a||!a.slug) return;
  var s=encodeURIComponent(a.slug), el=document.getElementById('links');
  el.innerHTML='<a href="/user/'+s+'">Your profile <span>&rarr;</span></a>'
    +'<a href="/user/'+s+'/credits">Your credits <span>&rarr;</span></a>'
    +'<a href="/user/'+s+'/rankings">Your rankings <span>&rarr;</span></a>'
    +el.innerHTML;
}).catch(function(){});
window.addEventListener('online',function(){ location.reload(); });
</script>
</body>
</html>
