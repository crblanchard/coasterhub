<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- Add to home screen (2026-09-27): opens full-screen with its own icon. See site.webmanifest. -->
<link rel="manifest" href="/site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coaster Hub">
<base href="/">
<title>Explore — Coaster Hub</title>
<meta name="description" content="Search and browse every coaster, park, manufacturer, location and rider on Coaster Hub.">
<link rel="stylesheet" href="/style.css?v=20261002d">
<link rel="stylesheet" href="/lists.css?v=20261004a">
<script>/* theme: set before paint so the page never flashes the wrong one (see initTheme in app.js). Light unless "dark" was chosen. */try{var chT=localStorage.getItem("ch_theme")}catch(e){}if(chT!=="dark")document.documentElement.setAttribute("data-theme","light")</script>
<link rel="icon" href="/favicon.svg?v=20260924b" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=20260924b" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16.png?v=20260924b" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260924b">
<meta property="og:title" content="Coaster Hub — Explore">
<meta property="og:image" content="https://coasterhub.org/og-image.png?v=4">
<style>
  /* Explore (2026-10-02): the second tab. Search, then the database's front
     door — the hub that used to sit at the top of Home — then Suggested for
     you, with All users beside it (the full list is /users). */
  .hub{margin:0 0 30px}
  .hubsearch{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
    background-color:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;
    color:var(--muted);font-size:.95rem;font-weight:400}
  .hubsearch:hover{border-color:var(--ring)}
  .hubsearch span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .xgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 0}
  .xgrid a{display:flex;flex-direction:column;gap:3px;padding:15px;border-radius:12px;
    background-color:var(--panel);border:1px solid var(--line);text-decoration:none;color:var(--fg);min-width:0}
  .xgrid a:hover{border-color:var(--accent2)}
  .xgrid b{font-weight:700;font-size:1rem}
  /* Parks and Coasters: two big cards. The rest: one smaller row. */
  .xgrid.xbig{grid-template-columns:repeat(2,1fr)}
  .xgrid.xbig a{padding:20px 18px;min-height:96px;justify-content:flex-end}
  .xgrid.xbig b{font-size:1.3rem;font-weight:800}
  .xgrid.xsmall{grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .xgrid.xsmall a{padding:11px 12px}
  .xgrid.xsmall b{font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .xgrid.xsmall span{font-size:.78rem}
  @media (max-width:420px){ .xgrid.xsmall a{padding:10px 9px} .xgrid.xsmall b{font-size:.8rem;letter-spacing:-.01em} }
  .sugsub{color:var(--muted);font-size:.86rem;margin:0 0 8px}
  .xgrid span{color:var(--muted);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:420px){ .xgrid span{white-space:normal} }
  @media (max-width:760px){ .xgrid.xbig{grid-template-columns:repeat(2,1fr)} .xgrid.xsmall{grid-template-columns:repeat(3,1fr)} }
  .sughead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px}
  .sughead a{color:var(--accent2);font-weight:600;font-size:.9rem;text-decoration:none}
  /* Suggested (Carter, 2026-10-02: "a suggested or recommended ... with
     buttons to follow people directly from there"). The rows are .riderrow,
     with a real <button> beside the link rather than inside it. */
  #sug_wrap[hidden]{display:none}
  #sug{margin-bottom:30px}
  #sug .sugrow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
  #sug .sugrow:last-child{border-bottom-style:none}
  #sug .sugrow .riderrow{flex:1 1 auto;min-width:0;border-bottom-style:none}
  #sug .sugrow .riderrow .sub{white-space:normal}
  .sugf{flex:none;margin-right:14px;min-width:96px;min-height:44px;padding:9px 14px;border-radius:999px;cursor:pointer;
    font-family:inherit;font-size:.9rem;font-weight:700;border:1px solid transparent;
    background-color:var(--accentfill);color:var(--onaccent)}
  .sugf.on{background-color:transparent;border-color:var(--line);color:var(--fg);font-weight:600}
  .sugf:disabled{opacity:.55;cursor:default}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="/">
    <img src="/mark.svg?v=20260924b" alt="" class="brand-mark" width="40" height="40">
    <span class="brand-text">Coaster <b>Hub</b></span>
  </a>
  <nav class="links">
    <a href="/" data-nav="riders">Home</a>
    <a href="/explore" data-nav="explore">Explore</a>
    <a href="/log" data-nav="log" class="navlog">+ Log</a>
    <a href="/rankings" data-nav="rankings">Rankings</a>
    <a href="/account" data-nav="profile">Me</a>
  </nav>
  <div class="people" id="people"></div>
</div></header>

<section class="hero compact" style="--hero-t:30px;--hero-b:20px"><div class="container">
  <h1 class="wide">Explore</h1>
</div></section>

<section class="block" style="padding-top:20px"><div class="container">
  <div class="hub">
    <button type="button" class="hubsearch" id="hubsearch">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search coasters, parks, makers, riders&hellip;</span>
    </button>
    <!-- Parks and Coasters first and big, then the other ways in, smaller,
         then people (Carter, 2026-10-02, from the critique: six equal cards
         with nothing leading). -->
    <div class="xgrid xbig">
      <a href="/parks"><b>Parks</b><span id="x_parks">&nbsp;</span></a>
      <a href="/coasters"><b>Coasters</b><span id="x_coasters">&nbsp;</span></a>
    </div>
    <div class="xgrid xsmall">
      <a href="/manufacturers"><b>Makers</b><span id="x_makers">&nbsp;</span></a>
      <a href="/locations"><b>Locations</b><span id="x_locs">&nbsp;</span></a>
      <a href="/map"><b>Map</b><span>Nearest rides</span></a>
    </div>
  </div>
  <div class="sughead"><span class="eyebrow">Riders</span><a href="/users">All <span id="x_users">riders</span> &rarr;</a></div>
  <div id="sug_wrap" hidden>
    <p class="sugsub">Suggested for you</p>
    <div class="riderlist" id="sug"></div>
  </div>
</div></section>

<footer class="site"><div class="container foot-inner">
  <div>&copy; <span id="y"></span> Coaster Hub &middot; coasterhub.org</div>
  <div><a href="/">Home</a> &nbsp;&middot;&nbsp; <a href="/coasters">Coasters</a> &nbsp;&middot;&nbsp; <a href="/parks">Parks</a> &nbsp;&middot;&nbsp; <a href="/manufacturers">Manufacturers</a> &nbsp;&middot;&nbsp; <a href="/locations">Locations</a> &nbsp;&middot;&nbsp; <a href="/map">Map</a> &nbsp;&middot;&nbsp; <a href="/sitemap">Sitemap</a><span data-contrib hidden></span></div>
</div></footer>

<script src="/app.js?v=20261004a"></script>
<script>
document.getElementById('y').textContent=new Date().getFullYear();
CoasterHub.initNav('explore');
var $=function(id){ return document.getElementById(id); };
var nf=function(n){ return Number(n||0).toLocaleString(); };
$('hubsearch').addEventListener('click', function(){ CoasterHub.openSearch(''); });

// The cards' counts, from the two lists every page already caches.
Promise.all([CoasterHub.fetchCoasters(), CoasterHub.fetchParks()]).then(function(r){
  var cs=r[0].coasters||[], parks=r[1]||{}, makers={}, locs={};
  var nOpen=cs.filter(function(c){ return !c.closed; }).length;
  cs.forEach(function(c){ if(c.manu) makers[String(c.manu).trim()]=1; });
  Object.keys(parks).forEach(function(p){ if(parks[p] && parks[p].region) locs[parks[p].region]=1; });
  $('x_parks').textContent=nf(Object.keys(parks).length)+' parks';
  // The same words the pages they open use (critique, 2026-10-02).
  $('x_coasters').textContent=nf(cs.length)+' coasters';
  $('x_makers').textContent=nf(Object.keys(makers).length)+' makers';
  $('x_locs').textContent=nf(Object.keys(locs).length)+' places';
}).catch(function(){ /* the cards still link; they just go without numbers */ });

// How many riders, for the Users card. The list itself is /users.
CoasterHub.fetchUsers().then(function(){
  $('x_users').textContent=nf((CoasterHub.USERS||[]).length)+' riders';   // "All 14 riders →"
}).catch(function(){});
// Suggested for you: riders you don't follow yet, the ones your friends follow
// first, then whoever has ranked and logged the most. Five, each with a Follow
// button that works in place. Signed in only — following needs an account —
// and only claimed riders, the only ones with somebody on the other end.
function followsOf(slug){
  return fetch('/api/follows/'+encodeURIComponent(slug),{credentials:'same-origin',cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
}
Promise.all([CoasterHub.me().catch(function(){ return null; }), CoasterHub.fetchUsers(), CoasterHub.fetchSummary()]).then(function(r){
  var me=r[0]; if(!me || !me.slug) return;
  var by={}; (r[2]||[]).forEach(function(x){ by[x.slug]=x; });
  return followsOf(me.slug).then(function(mine){
    if(!mine) return;
    var fol={}; (mine.following||[]).forEach(function(f){ fol[f.slug]=f.name||f.slug; });
    return Promise.all(Object.keys(fol).map(followsOf)).then(function(theirs){
      var fof={}, via={};
      theirs.forEach(function(t, i){ if(!t) return; var friend=fol[Object.keys(fol)[i]];
        (t.following||[]).forEach(function(f){ fof[f.slug]=(fof[f.slug]||0)+1; if(!via[f.slug]) via[f.slug]=friend; }); });
      // Somebody with nothing logged is not much of a suggestion (critique, 2026-10-02).
      var cands=(CoasterHub.USERS||[]).filter(function(u){ var k=by[u.slug]||{};
        return u.claimed && u.slug!==me.slug && !fol[u.slug] && ((k.credits||0)>0 || (k.ranked||0)>0); });
      var x=function(u){ return by[u.slug]||{}; };
      cands.sort(function(a,b){ return (fof[b.slug]||0)-(fof[a.slug]||0) || (x(b).ranked||0)-(x(a).ranked||0)
        || (x(b).credits||0)-(x(a).credits||0) || a.name.localeCompare(b.name); });
      cands=cands.slice(0,5);
      if(!cands.length) return;
      var E=function(t){ return String(t).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
      $('sug').innerHTML=cands.map(function(u){
        var n=fof[u.slug]||0, k=x(u);
        var why = n ? 'Followed by '+E(via[u.slug])+(n>1?' and '+(n-1)+' more':'')
                : (k.ranked ? nf(k.ranked)+' ranked &middot; ' : '')+nf(k.credits)+' credits';
        var pic = u.avatar ? '<span class="av" style="background-image:url(/avatars/'+encodeURIComponent(u.avatar)+')"></span>'
                           : '<span class="av">'+E((u.name||'?').charAt(0).toUpperCase())+'</span>';
        return '<div class="sugrow"><a class="riderrow" href="'+CoasterHub.userPageHref(u.slug,'profile')+'">'+pic
          +'<span class="who"><b class="nm">'+E(u.name)+'</b><span class="un">@'+E(u.slug)+'</span><span class="sub">'+why+'</span></span></a>'
          +'<button type="button" class="sugf" data-slug="'+E(u.slug)+'">Follow</button></div>';
      }).join('');
      $('sug_wrap').hidden=false;
      Array.prototype.forEach.call($('sug').querySelectorAll('.sugf'), function(b){
        b.onclick=function(){
          var on=b.classList.contains('on'); b.disabled=true;
          fetch('/api/follow/'+encodeURIComponent(b.getAttribute('data-slug')),{method:on?'DELETE':'POST',credentials:'same-origin'})
            .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
            .then(function(j){ b.classList.toggle('on', !!j.you); b.textContent=j.you?'Following':'Follow'; })
            // Say so rather than look as if it worked.
            .catch(function(e){ console.error(e); b.textContent='Try again'; })
            .then(function(){ b.disabled=false; });
        };
      });
    });
  });
}).catch(function(){ /* no suggestions rather than a broken section */ });
</script>
</body>
</html>
