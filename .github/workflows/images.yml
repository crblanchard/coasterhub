name: Coaster photos from the open sources

# Photos (and logos) for coaster pages (Carter, 2026-11-24): asks Coasterpedia,
# English Wikipedia and Wikimedia Commons (Wikidata's P18 image / P154 logo)
# for each named file's address, size, author and licence
# (tools/open-data/images-pull.py), writes migrations/233-open-data-images.sql
# and loads it into open_images on D1. Nothing is downloaded: the site shows
# Commons pictures straight from Commons, which allows that.
#
# Runs here because Wikipedia/Commons refuse the cloud sandbox (429). The pull
# is resumable (images.json keeps what was already fetched), so later runs
# only ask about new files. Weekly after the open-data refresh, or by hand.

on:
  schedule:
    - cron: '23 12 * * 1'   # Mondays, after the open-data refresh
  workflow_dispatch:
    inputs:
      sources:
        description: 'Sources to pull (space-separated: coasterpedia enwiki wikidata). Empty = all.'
        required: false
        # Coasterpedia too (Carter, 2026-11-26): its photos do show on the site.
        # The Monday run passes no input, which already means all three.
        default: 'coasterpedia enwiki wikidata'
      gallery:
        description: 'Also pull every photo in each coaster''s Commons category (yes/no)'
        required: false
        default: 'yes'
      parks:
        description: 'Also pull each park''s Commons photos (yes/no)'
        required: false
        default: 'yes'

permissions:
  contents: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pull photo details
        env:
          SOURCES: ${{ inputs.sources }}
        run: |
          python3 -I tools/open-data/images-pull.py $SOURCES
          python3 -I tools/open-data/build-images-sql.py > migrations/233-open-data-images.sql
          python3 -I -c 'import json,collections; d=json.load(open("tools/open-data/images.json"))["images"]; print(len(d), "pictures", dict(collections.Counter(x["source"]+"/"+x["kind"] for x in d)))'

      - name: Pull Commons category photos
        if: ${{ inputs.gallery != 'no' }}
        run: |
          python3 -I tools/open-data/gallery-pull.py
          python3 -I tools/open-data/build-gallery-sql.py > migrations/235-open-data-gallery.sql

      - name: Pull park photos
        if: ${{ inputs.parks != 'no' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Each park's Wikidata item: the one most of its linked coasters are
          # "part of" (P361) or located at (P276). Read from D1, output to a
          # file, not the log.
          npx --yes wrangler@4 d1 execute coasterhub --remote --json --command "SELECT park, value AS q, value_label AS lbl FROM (SELECT c.park, w.value, w.value_label, ROW_NUMBER() OVER (PARTITION BY c.park ORDER BY COUNT(DISTINCT c.id) DESC) rk FROM coasters c JOIN open_links l ON l.coaster_id = c.id AND l.source = 'wikidata' JOIN wd_claims w ON w.qid = l.ref AND w.pid IN ('P361','P276') GROUP BY c.park, w.value) WHERE rk = 1" > "$RUNNER_TEMP/parkq.json" 2> "$RUNNER_TEMP/parkq.err"
          python3 -I -c 'import json,sys; d=json.load(open(sys.argv[1])); json.dump(d[0]["results"], open("tools/open-data/park-qids.json","w"), indent=0, ensure_ascii=False); print(len(d[0]["results"]), "parks")' "$RUNNER_TEMP/parkq.json"
          python3 -I tools/open-data/park-photos-pull.py
          python3 -I tools/open-data/build-park-gallery-sql.py > migrations/240-open-data-park-gallery.sql

      - name: Commit
        run: |
          git add tools/open-data/images.json migrations/233-open-data-images.sql
          [ -f tools/open-data/gallery.json ] && git add tools/open-data/gallery.json migrations/235-open-data-gallery.sql || true
          [ -f tools/open-data/park-gallery.json ] && git add tools/open-data/park-qids.json tools/open-data/park-gallery.json migrations/240-open-data-park-gallery.sql || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "Open data: photo details refreshed"
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main
          fi

      - name: Load into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for FILE in migrations/233-open-data-images.sql migrations/235-open-data-gallery.sql migrations/240-open-data-park-gallery.sql; do
          [ -f "$FILE" ] || continue
          if grep -vE '^\s*(--|$)' "$FILE" | grep -viE '^(CREATE (TABLE|INDEX) IF NOT EXISTS open_|DELETE FROM open_|INSERT OR REPLACE INTO open_)' | grep -q .; then
            echo "::error::$FILE touches something other than open_* tables"; exit 1
          fi
          # Output to a file, not the log (this repo's logs are public; see backup.yml).
          if ! npx --yes wrangler@4 d1 execute coasterhub --remote --yes --file "$FILE" > "$RUNNER_TEMP/wrangler.log" 2>&1; then
            tail -n 20 "$RUNNER_TEMP/wrangler.log" | sed -E 's#https?://[^ ]+#[link removed]#g'
            echo "::error::loading the photos failed"; exit 1
          fi
          echo "$FILE loaded"
          done
