name: iPhone app

# The iPhone app (app/, 2026-10-30) is built here on GitHub's Macs, so nobody
# needs one: this repo is public, which makes the macOS runners free.
#
# Two jobs:
#   build      every push that touches app/, and by hand: compiles the app for
#              the iPhone simulator, unsigned. Needs no secrets. It is the
#              proof the project builds before anything is sent to Apple.
#   testflight by hand only (Run workflow, "Send to TestFlight" ticked): signs
#              the app with Apple's cloud signing and uploads it to App Store
#              Connect, where it shows up in TestFlight after Apple processes
#              it (about 15 minutes). Needs four repository secrets, added by
#              Carter in Settings -> Secrets and variables -> Actions, never
#              pasted into a chat:
#                APPLE_TEAM_ID     10 characters, developer.apple.com -> Membership
#                ASC_KEY_ID        the API key's ID
#                ASC_ISSUER_ID     the issuer ID above the keys list
#                ASC_KEY_P8        the whole .p8 file, BEGIN/END lines included
#              The key must be a TEAM key with the Admin role (App Store
#              Connect -> Users and Access -> Integrations): app/ci/signing.py
#              uses it to make the signing certificate and profile each run.
#
# Every upload needs a build number Apple has not seen: it is this workflow's
# run number, which only ever goes up. The version people see (1.0) is
# MARKETING_VERSION in the Xcode project.

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Send to TestFlight'
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# pipefail: every xcodebuild here is piped into tail, and without it a failed
# build reads as a pass (the first TestFlight run "succeeded" with no upload).
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Install and sync
        working-directory: app
        run: npm ci && npx cap sync ios
      - name: Build for the simulator
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - name: Check the secrets are there
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!v}" ] || { echo "::error::Repository secret $v is missing (see the top of ios.yml)"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Install and sync
        working-directory: app
        run: npm ci && npx cap sync ios
      # Xcode's automatic signing wants a registered iPhone even for an App
      # Store build, so app/ci/signing.py makes the certificate and profile
      # through the API instead; the app target's Release config signs
      # manually with them.
      - name: Signing certificate and profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet pyjwt cryptography
          ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey.p8" python3 app/ci/signing.py
      - name: Archive
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -80
      - name: Upload to App Store Connect
        working-directory: app/ios/App
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>org.coasterhub.app</key><string>Coaster Hub App Store CI</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/out" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" | tail -40
      - name: Remove the key and the keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          security delete-keychain "$RUNNER_TEMP/ci.keychain-db" 2>/dev/null || true
