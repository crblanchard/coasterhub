name: Load open dataset into D1

# The open dataset (tools/open-data/, migrations 187+) is too big to paste
# into the D1 console or send a statement at a time: migration 188 alone is
# 13,668 Wikidata statements, 1.3 MB of SQL. This runs ONE such file against
# the live database with wrangler, using the token the nightly backup already
# has (Account > D1 > Edit).
#
# Started by hand only, and only for files named migrations/NNN-open-data-*.sql:
# those touch nothing but the open_* and wd_* tables, and each empties and
# refills its own rows, so a second run is a no-op. Everything else still goes
# through the usual path in CLAUDE.md.

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Migration file, e.g. migrations/188-open-data-wikidata-raw.sql'
        required: true

concurrency:
  group: open-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the file
        env:
          FILE: ${{ inputs.file }}
        run: |
          [[ "$FILE" =~ ^migrations/[0-9]{3}-open-data-[a-z0-9-]+\.sql$ ]] || { echo "::error::Only migrations/NNN-open-data-*.sql files"; exit 1; }
          [ -f "$FILE" ] || { echo "::error::$FILE is not in the repo"; exit 1; }
          # Nothing outside the open-data tables.
          if grep -vE '^\s*(--|$)' "$FILE" | grep -viE '^(CREATE (TABLE|INDEX) IF NOT EXISTS (open_|wd_)|DELETE FROM (open_|wd_)|INSERT OR REPLACE INTO (open_|wd_))' | grep -q .; then
            echo "::error::$FILE touches something other than open_*/wd_* tables"; exit 1
          fi
          echo "$(wc -c < "$FILE") bytes, $(grep -c '^INSERT' "$FILE") inserts"

      - name: Run it on D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FILE: ${{ inputs.file }}
        run: |
          # Output to a file, not the log (this repo's logs are public; see backup.yml).
          if ! npx --yes wrangler@4 d1 execute coasterhub --remote --yes --file "$FILE" > "$RUNNER_TEMP/wrangler.log" 2>&1; then
            tail -n 20 "$RUNNER_TEMP/wrangler.log" | sed -E 's#https?://[^ ]+#[link removed]#g'
            echo "::error::wrangler d1 execute failed"; exit 1
          fi
          tail -n 8 "$RUNNER_TEMP/wrangler.log" | sed -E 's#https?://[^ ]+#[link removed]#g'
