name: Load open dataset into D1

# The open dataset (tools/open-data/, migrations 187 and 188) lives in D1
# beside the live coaster data and is never read by the site yet. Two jobs:
#
# refresh  Weekly, or by hand with the file box left empty: pulls Wikidata
#          again, re-matches against the current coasters.json, regenerates
#          187/188, commits them if anything changed, and loads both into D1.
#          Carter, 2026-11-18: "keep updating the new one".
# load     By hand with a file named: runs that ONE migrations/NNN-open-data-*.sql
#          on D1. They are too big for the console (188 is 1.3 MB).
#
# Both use the token the nightly backup already has (Account > D1 > Edit), and
# only ever run files that touch nothing but the open_* and wd_* tables; each
# empties and refills its own rows, so a second run is a no-op.

on:
  schedule:
    - cron: '43 9 * * 1'   # Mondays, after the nightly backup
  workflow_dispatch:
    inputs:
      file:
        description: 'Migration file to load (e.g. migrations/188-open-data-wikidata-raw.sql). Leave empty to refresh from Wikidata.'
        required: false
        default: ''

concurrency:
  group: open-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh from Wikidata
        if: ${{ !inputs.file }}
        run: |
          bash tools/open-data/wikidata-pull.sh
          python3 -I tools/open-data/match-wikidata.py
          python3 -I tools/open-data/build-sql.py > migrations/187-open-data-wikidata.sql
          python3 -I tools/open-data/build-raw-sql.py > migrations/188-open-data-wikidata-raw.sql
          echo "FILES=migrations/187-open-data-wikidata.sql migrations/188-open-data-wikidata-raw.sql" >> "$GITHUB_ENV"

      - name: Commit the refresh
        if: ${{ !inputs.file }}
        run: |
          git add tools/open-data migrations/187-open-data-wikidata.sql migrations/188-open-data-wikidata-raw.sql
          # The retrieved date changes every run (the last value of each row,
          # "retrieved" in the JSON, "pulled <date>" in the header); only
          # commit when something else did. A line that changed only in that
          # date shows up once as - and once as +, identical once normalised.
          n=$(git diff --cached -U0 | grep -E '^[-+]' | grep -vE '^(\+\+\+ b/|--- a/|\+\+\+ /dev/null|--- /dev/null)' \
              | sed -E "s/^[-+]//; s/'[0-9]{4}-[0-9]{2}-[0-9]{2}'\)/'D')/g; s/\"retrieved\": \"[0-9-]+\"/R/; s/pulled [0-9-]{10}/pulled D/" \
              | sort | uniq -u | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "No data changes"; git reset -q
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "Open dataset: weekly Wikidata refresh"
            git pull -q --rebase origin main && git push -q origin HEAD:main
          fi

      - name: Pick the file
        if: ${{ inputs.file }}
        env:
          FILE: ${{ inputs.file }}
        run: echo "FILES=$FILE" >> "$GITHUB_ENV"

      - name: Check the files
        run: |
          for FILE in $FILES; do
            [[ "$FILE" =~ ^migrations/[0-9]{3}-open-data-[a-z0-9-]+\.sql$ ]] || { echo "::error::Only migrations/NNN-open-data-*.sql files"; exit 1; }
            [ -f "$FILE" ] || { echo "::error::$FILE is not in the repo"; exit 1; }
            if grep -vE '^\s*(--|$)' "$FILE" | grep -viE '^(CREATE (TABLE|INDEX) IF NOT EXISTS (open_|wd_)|DELETE FROM (open_|wd_)|INSERT OR REPLACE INTO (open_|wd_))' | grep -q .; then
              echo "::error::$FILE touches something other than open_*/wd_* tables"; exit 1
            fi
            echo "$FILE: $(wc -c < "$FILE") bytes, $(grep -c '^INSERT' "$FILE") inserts"
          done

      - name: Run on D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for FILE in $FILES; do
            # Output to a file, not the log (this repo's logs are public; see backup.yml).
            if ! npx --yes wrangler@4 d1 execute coasterhub --remote --yes --file "$FILE" > "$RUNNER_TEMP/wrangler.log" 2>&1; then
              tail -n 20 "$RUNNER_TEMP/wrangler.log" | sed -E 's#https?://[^ ]+#[link removed]#g'
              echo "::error::wrangler d1 execute failed on $FILE"; exit 1
            fi
            echo "$FILE loaded"
          done
