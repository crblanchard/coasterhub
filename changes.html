<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/">
<title>Recent changes — Coaster Hub</title>
<meta name="description" content="What everyone has been adding, logging and fixing on Coaster Hub.">
<link rel="stylesheet" href="/style.css?v=20260805b">
<script>/* theme: set before paint so light mode never flashes dark (see initTheme in app.js) */try{if(localStorage.getItem("ch_theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<link rel="icon" href="/favicon.svg?v=20260924b" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=20260924b" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16.png?v=20260924b" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260924b">
<meta property="og:title" content="Coaster Hub — Recent changes">
<meta property="og:image" content="https://coasterhub.org/og-image.png?v=4">
<style>
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
  .seg button{background:transparent;border:0;color:var(--muted);padding:10px 16px;cursor:pointer;
    font-size:.9rem;font-family:inherit}
  .seg button.on{background:var(--tint2);color:var(--fg)}
  /* The feed's own rules live in style.css now, beside changes-feed.js which
     draws them — /riders shows the same rows. What is left here is this page's
     filter bar and the note above it. */
  .note{color:var(--muted);font-size:.85rem;margin:0 0 22px;max-width:62ch}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="/">
    <img src="/mark.svg?v=20260924b" alt="" class="brand-mark" width="40" height="40">
    <span class="brand-text">Coaster <b>Hub</b></span>
  </a>
  <nav class="links">
    <a href="/" data-nav="riders">Home</a>
    <a href="/rankings" data-nav="rankings">Rankings</a>
    <a href="/log" data-nav="log" class="navlog">+ Log</a>
    <a href="/credits" data-nav="count">Credits</a>
    <a href="/account" data-nav="profile">Profile</a>
  </nav>
  <div class="people" id="people"></div>
</div></header>

<section class="hero" style="--hero-t:56px;--hero-b:26px"><div class="container">
  <span class="badge">Recent changes</span>
  <h1 style="max-width:18ch">What everyone&rsquo;s been up to.</h1>
  <p>Rides logged, rankings reordered, and fixes to the shared list.</p>
</div></section>

<section class="block" style="padding-top:20px"><div class="container">
  <div class="seg" id="filter">
    <!-- Carter's words, 2026-09-20: everything / users / database. The values
         behind them are unchanged — `riders` is what changes-feed.js matches
         against RIDER_KINDS, and renaming a label is not a reason to rename a
         thing that works. -->
    <button data-f="all" class="on">Everything</button>
    <button data-f="riders">Users</button>
    <button data-f="database">Database</button>
  </div>
  <p class="note" id="note"></p>
  <div class="feed" id="feed"><div class="empty" data-loading>Loading&hellip;</div></div>
</div></section>

<footer class="site"><div class="container foot-inner">
  <div>&copy; <span id="y"></span> Coaster Hub &middot; coasterhub.org</div>
  <div><a href="/">Home</a> &nbsp;&middot;&nbsp; <a href="/coasters">Coasters</a> &nbsp;&middot;&nbsp; <a href="/parks">Parks</a> &nbsp;&middot;&nbsp; <a href="/manufacturers">Manufacturers</a> &nbsp;&middot;&nbsp; <a href="/locations">Locations</a> &nbsp;&middot;&nbsp; <a href="/map">Map</a><span data-contrib hidden></span></div>
</div></footer>

<script src="/app.js?v=20260805b"></script>
<script src="/changes-feed.js?v=20260926"></script>
<script>
document.getElementById('y').textContent = new Date().getFullYear();
CoasterHub.initNav('changes');

var $ = function(id){ return document.getElementById(id); };
// The feed itself lives in changes-feed.js, because /riders shows the same thing
// under its list. This page is the full one: every filter, the whole history,
// and it keeps itself up to date while you watch it.
CoasterHubFeed.mount({
  feed:   $('feed'),
  note:   $('note'),
  filter: $('filter'),
  poll:   true
});
</script>
</body>
</html>
