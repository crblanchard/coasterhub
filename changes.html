<style>
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
  .seg button{background:transparent;border:0;color:var(--muted);padding:10px 16px;cursor:pointer;
    font-size:.9rem;font-family:inherit}
  .seg button.on{background:var(--tint2);color:var(--fg)}
  .feed{display:flex;flex-direction:column;gap:0}
  .day{color:var(--muted);font-size:.78rem;font-weight:700;text-transform:uppercase;
    letter-spacing:.1em;margin:22px 0 8px}
  .day:first-child{margin-top:0}
  .ev{display:flex;gap:13px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
  .ev .ic{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;background:var(--soft);color:var(--muted);margin-top:1px}
  .ev .ic svg{width:16px;height:16px}
  .ev.log .ic{background:var(--tint2);color:var(--accent2)}
  .ev .tx{flex:1;min-width:0;font-size:.95rem}
  .ev .tx b{font-weight:700}
  .ev .tx .sub{color:var(--accent2);font-weight:600}
  .ev .when{flex:none;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;
    white-space:nowrap;margin-top:2px}
  .note{color:var(--muted);font-size:.85rem;margin:0 0 22px;max-width:62ch}
  .empty{color:var(--muted);padding:26px 0}
  @media (max-width:520px){
    .ev{gap:10px}
    .ev .when{font-size:.74rem}
  }
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="/">
    <img src="/mark.svg?v=20260805b" alt="" class="brand-mark" width="40" height="40">
    <span class="brand-text">Coaster <b>Hub</b></span>

  <nav class="links">
    <a href="/" data-nav="home">Home</a>

</div></header>

<section class="hero" style="padding:56px 0 26px"><div class="container">
  <span class="badge">Recent changes</span>
  <h1 style="max-width:18ch">What everyone&rsquo;s been up to.</h1>
  <p>Rides logged, rankings reordered, and fixes to the shared list.</p>
</div></section>

<section class="block" style="padding-top:20px"><div class="container">
  <div class="seg" id="filter">
    <button data-f="all" class="on">Everything</button>
    <button data-f="riders">Riders</button>
    <button data-f="database">The list</button>
  </div>
  <p class="note" id="note"></p>
  <div class="feed" id="feed"><div class="empty">Loading&hellip;</div></div>
</div></section>

<footer class="site"><div class="container foot-inner">
  <div>&copy; <span id="y"></span> Coaster Hub &middot; coasterhub.org</div>
  <div><a href="/">Home</a> &nbsp;&middot;&nbsp; <a href="/rankings">Rankings</a> &nbsp;&middot;&nbsp; <a href="/stats">Stats</a> &nbsp;&middot;&nbsp; <a href="/rides">Rides</a> &nbsp;&middot;&nbsp; <a href="/log">Log</a> &nbsp;&middot;&nbsp; <a href="/add">Add new</a> &nbsp;&middot;&nbsp; <a href="/sitemap">Site map</a></div>
</div></footer>

<script src="/app.js?v=20260805b"></script>
<script>
document.getElementById('y').textContent = new Date().getFullYear();
CoasterHub.initNav('changes');

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function plural(n, one, many){ return n + ' ' + (n === 1 ? one : (many || one + 's')); }

var ICONS = {
  rides:    '<path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4"/>',
  credits:  '<path d="M12 5v14M5 12h14"/>',
  ranking:  '<path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0zM7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3"/>',
  removed:  '<path d="M5 12h14"/>',
  added:    '<path d="M12 5v14M5 12h14"/>',
  edited:   '<path d="M4 20h4L19 9l-4-4L4 16zM14 5l4 4"/>',
  merged:   '<path d="M7 4v6a4 4 0 0 0 4 4h6M17 10l3 4-3 4"/>',
  deleted:  '<path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/>'
};
// Which of the two feeds an event belongs to: something a rider did to their own
// count, or something that changed the shared list everyone draws from.
var RIDER_KINDS = { rides:1, credits:1, ranking:1, ride_removed:1, user_added:1 };

function icon(kind){
  var k = kind === 'ride_removed' ? 'removed'
        : kind === 'coaster_added' || kind === 'user_added' ? 'added'
        : kind === 'coaster_edited' || kind === 'coaster_renamed' ? 'edited'
        : kind === 'coaster_merged' ? 'merged'
        : kind === 'coaster_deleted' ? 'deleted'
        : kind;
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '
    + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + (ICONS[k] || ICONS.edited) + '</svg>';
}

// Every sentence is built from what the row actually recorded. Where no rider
// was known the subject leads instead of a name — see recordActivity in
// worker.js for why those rows are deliberately anonymous rather than guessed.
function sentence(e){
  var who = e.actorName ? '<b>' + esc(e.actorName) + '</b>' : null;
  var d = e.detail || {};
  var sub = e.subject ? '<span class="sub">' + esc(e.subject) + '</span>' : null;

  if (e.kind === 'rides') {
    var s = (who || 'Someone') + ' logged ' + plural(d.rides || e.n || 0, 'ride');
    if (sub) s += ' at ' + sub;
    if (d.date) s += ' on ' + niceDate(d.date);
    if (d.newCredits) s += ' &mdash; ' + plural(d.newCredits, 'new credit');
    return s;
  }
  if (e.kind === 'credits') {
    var n = d.rides || e.n || 0;
    return (who || 'Someone') + ' added ' + plural(n, 'coaster') + ' to their count';
  }
  if (e.kind === 'ride_removed') {
    return (who || 'Someone') + ' removed a ride' + (sub ? ' of ' + sub : '');
  }
  if (e.kind === 'ranking') {
    var bits = [];
    if (d.added) bits.push('ranked ' + plural(d.added, 'new coaster'));
    if (d.removed) bits.push('dropped ' + plural(d.removed, 'coaster'));
    if (!bits.length) bits.push('reordered their rankings');
    return (who || 'Someone') + ' ' + bits.join(' and ')
      + (d.total ? ' <span class="sub">(' + d.total + ' ranked)</span>' : '');
  }
  if (e.kind === 'coaster_added')   return (sub || 'A coaster') + ' was added'
    + (d.park ? ' at ' + esc(d.park) : '');
  if (e.kind === 'coaster_renamed') return (d.from ? esc(d.from) : 'A coaster')
    + ' was renamed to ' + (sub || 'something else');
  if (e.kind === 'coaster_merged')  return (d.fromName ? esc(d.fromName) : 'A duplicate')
    + ' was merged into ' + (sub || 'another coaster');
  if (e.kind === 'coaster_deleted') return (sub || 'A coaster') + ' was deleted';
  if (e.kind === 'user_added')      return (sub || 'A rider') + ' joined'
    + (e.actor ? ' <span class="sub">/user/' + esc(e.actor) + '</span>' : '');
  if (e.kind === 'coaster_edited')  return (sub || 'A coaster') + ' had '
    + plural(e.n || (d.fields || []).length || 1, 'detail') + ' updated';
  return esc(e.kind);
}

function niceDate(iso){
  var d = new Date(iso + 'T00:00');
  if (isNaN(d)) return esc(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function dayKey(iso){ return new Date(iso).toLocaleDateString(undefined,
  { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }); }
function clock(iso){ return new Date(iso).toLocaleTimeString(undefined,
  { hour: 'numeric', minute: '2-digit' }); }

var EVENTS = [], FILTER = 'all';

function render(){
  var list = EVENTS.filter(function(e){
    if (FILTER === 'riders')   return !!RIDER_KINDS[e.kind];
    if (FILTER === 'database') return !RIDER_KINDS[e.kind];
    return true;
  });
  if (!list.length){
    $('feed').innerHTML = '<div class="empty">Nothing here yet.</div>';
    return;
  }
  var html = '', lastDay = null;
  list.forEach(function(e){
    var k = dayKey(e.at);
    if (k !== lastDay){ html += '<div class="day">' + esc(k) + '</div>'; lastDay = k; }
    html += '<div class="ev' + (RIDER_KINDS[e.kind] ? ' log' : '') + '">'
      + '<span class="ic">' + icon(e.kind) + '</span>'
      + '<span class="tx">' + sentence(e) + '</span>'
      + '<span class="when">' + esc(clock(e.at)) + '</span>'
      + '</div>';
  });
  $('feed').innerHTML = html;
}

Array.prototype.forEach.call(document.querySelectorAll('#filter button'), function(b){
  b.addEventListener('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('#filter button'), function(x){
      x.classList.toggle('on', x === b);
    });
    FILTER = b.getAttribute('data-f');
    render();
  });
});

fetch('/api/activity?limit=300')
  .then(function(r){ if (!r.ok) throw new Error('api ' + r.status); return r.json(); })
  .then(function(j){
    EVENTS = j.events || [];
    // Say plainly where the history starts. Nothing before the feed shipped was
    // timestamped anywhere, so the older entries are reconstructed from the
    // alias table and carry a date but not a time or a name.
    var back = EVENTS.filter(function(e){ return e.detail && e.detail.backfilled; }).length;
    $('note').innerHTML = back
      ? 'Recorded as it happens. The ' + back + ' oldest entries were rebuilt from the '
        + 'record of former names &mdash; those have a date but no time, and no-one attached, '
        + 'because nothing before this page existed was ever timestamped.'
      : 'Recorded as it happens.';
    render();
  })
  .catch(function(){
    $('feed').innerHTML = '<div class="empty">Couldn&rsquo;t load recent changes.</div>';
  });
</script>
</body>
</html>
