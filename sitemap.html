<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- Add to home screen (2026-09-27): opens full-screen with its own icon. See site.webmanifest. -->
<link rel="manifest" href="/site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coaster Hub">
<base href="/">
<title>Sitemap — Coaster Hub</title>
<meta name="description" content="Every page on Coaster Hub, including the ones that aren't in the menu.">
<link rel="stylesheet" href="/style.css?v=20261002a">
<script>/* theme: set before paint so the page never flashes the wrong one (see initTheme in app.js). Light unless "dark" was chosen. */try{var chT=localStorage.getItem("ch_theme")}catch(e){}if(chT!=="dark")document.documentElement.setAttribute("data-theme","light")</script>
<link rel="icon" href="/favicon.svg?v=20260924b" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=20260924b" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16.png?v=20260924b" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260924b">
<meta property="og:title" content="Coaster Hub — Sitemap">
<meta property="og:image" content="https://coasterhub.org/og-image.png?v=4">
<style>
  .smgroup{margin-bottom:34px}
  .smgroup h2{font-size:1.15rem;margin:0 0 4px}
  .smgroup .gl{color:var(--muted);font-size:.9rem;margin-bottom:14px;max-width:60ch}
  .smlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .sm{display:block;background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:14px 16px;transition:border-color .15s,transform .15s}
  .sm:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .sm .t{font-weight:700;font-size:1rem}
  .sm .p{color:var(--accent2);font-size:.8rem;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .sm .d{color:var(--muted);font-size:.88rem;margin-top:5px}
  /* Condensed on a phone (Carter, 2026-09-29): one column of short rows, the
     address beside the name, the description one clipped line. */
  @media (max-width:560px){
    .smgroup{margin-bottom:22px}
    .smgroup .gl{font-size:.82rem;margin-bottom:8px}
    .smlist{grid-template-columns:minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
    .sm{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 13px;background:none;min-width:0}
    .sm:last-child{border-bottom:0}
    .sm:hover{transform:none;background:var(--soft)}
    .sm .t{display:flex;align-items:baseline;gap:8px;font-size:.93rem}
    .sm .p{display:none}
    .sm .d{margin-top:1px;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  }
  .tagpill{display:inline-block;font-size:.68rem;font-weight:700;text-transform:uppercase;
    letter-spacing:.08em;border:1px solid var(--line);border-radius:999px;padding:2px 8px;
    margin-left:7px;color:var(--muted);vertical-align:2px}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="/">
    <img src="/mark.svg?v=20260924b" alt="" class="brand-mark" width="40" height="40">
    <span class="brand-text">Coaster <b>Hub</b></span>
  </a>
  <nav class="links">
    <a href="/" data-nav="riders">Home</a>
    <a href="/explore" data-nav="explore">Explore</a>
    <a href="/log" data-nav="log" class="navlog">+ Log</a>
    <a href="/rankings" data-nav="rankings">Rankings</a>
    <a href="/account" data-nav="profile">Me</a>
  </nav>
  <div class="people" id="people"></div>
</div></header>

<section class="hero compact" style="--hero-t:30px;--hero-b:20px"><div class="container">
  <h1 class="wide">Sitemap</h1>
  <p>Send feedback if you have trouble with navigation!</p>
</div></section>

<!-- Same card as the homepage's (Carter, 2026-09-27). -->
<div class="container" style="margin-top:20px">
  <div class="fbcard">
    <div>
      <h2>Reach out to us!</h2>
      <p>Can't find something, or found a bug? Let us know.</p>
    </div>
    <span class="spacer"></span>
    <a class="go" id="fb_link" rel="nofollow">Contact us &rarr;</a>
  </div>
</div>

<section class="block" style="padding-top:20px"><div class="container" id="map"></div></section>

<footer class="site"><div class="container foot-inner">
  <div>&copy; <span id="y"></span> Coaster Hub &middot; coasterhub.org</div>
  <div><a href="/">Home</a> &nbsp;&middot;&nbsp; <a href="/coasters">Coasters</a> &nbsp;&middot;&nbsp; <a href="/parks">Parks</a> &nbsp;&middot;&nbsp; <a href="/manufacturers">Manufacturers</a> &nbsp;&middot;&nbsp; <a href="/locations">Locations</a> &nbsp;&middot;&nbsp; <a href="/map">Map</a> &nbsp;&middot;&nbsp; <a href="/sitemap">Sitemap</a><span data-contrib hidden></span></div>
</div></footer>

<script src="/app.js?v=20261002e"></script>
<script>
document.getElementById('y').textContent = new Date().getFullYear();

// The one place that has to list everything, so a page that isn't in the menu
// is still findable. `rider` marks paths that also work as /user/<slug>/<page>;
// the links below resolve to whoever is currently selected in the header.
var GROUPS = [
  // Three groups (Carter, 2026-09-27): site tools, admin tools, and the rest.
  // The QC pages are left off on purpose. One tag, "signed in", for anything
  // that needs an account; "admin" for what needs an admin one.
  { h: 'Site tools',
    l: 'Most of these work for one rider or for everyone combined \u2014 use the picker in the header.',
    items: [
      { t: 'Home',        p: '/',          d: 'Your count, your friends and their activity, the top users, the Global top ten and recent changes.' },
      { t: 'Explore',     p: '/explore',   d: 'Search, and the way into coasters, parks, manufacturers, locations, the map and every user.' },
      { t: 'Users',       p: '/users',     d: 'Everyone on the site A\u2013Z, with site-wide totals.' },
      { t: 'Profile',     p: '/account',   d: 'One rider: their numbers, recent visits and who they follow, with Credits and Map tabs. Signed in, it is yours (Me).', rider: 'profile' },
      { t: 'Credits',     p: '/credits',     d: 'The log by park day, by park, or as one flat list.', rider: 'count' },
      { t: 'Map',         p: '/map',         d: 'Every park on a map, coloured by who has been. Compare with a friend.', rider: 'map' },
      { t: 'Coasters',    p: '/coasters',    d: 'Every coaster on the site, searchable and filterable.' },
      { t: 'Parks',       p: '/parks',       d: 'Every park on the site, A\u2013Z, by size, or nearest to you.' },
      // Linked to a real park and a real ride rather than a /park/<park> shape,
      // because every entry on this page is a link somebody can follow. The
      // examples are Knott's because its slug shows the apostrophe rule.
      { t: 'One park',    p: '/park/knotts-berry-farm', d: 'Every coaster at one park, who has ridden them, and how much of it each rider has.' },
      { t: 'One coaster', p: '/park/knotts-berry-farm/ghostrider', d: 'One ride: its specs, its former names, and who has been on it. The address is /park/<park>/<coaster>.' },
      { t: 'Manufacturers', p: '/manufacturers', d: 'Every coaster maker on the site. Open one for its models, how many of each, and which you have ridden.' },
      { t: 'Locations',   p: '/locations', d: 'Every state and country, with its parks and coasters.' },
      { t: 'Rankings',    p: '/rankings',  d: 'Your favorites in order, or everyone\u2019s combined \u2014 drag to reorder, or Rank more.', rider: 'rankings' },
      { t: 'Categories',  p: '/categories', d: 'The same ride at five parks, ranked once. Pick the ones you use, or write your own.' },
      { t: 'Log',         p: '/log',    d: 'Coaster rides from a day out, or credits you already have.', tag: 'signed in' },
      { t: 'Import',      p: '/import', d: 'Paste a whole list, or drop in a spreadsheet.', tag: 'signed in' },
      { t: 'Add new',     p: '/add',    d: 'Put a park or a coaster on the shared list.', tag: 'signed in' },
      { t: 'Account',     p: '/account', d: 'Sign in, start your own count, or reset a password. Signed in, it sends you to your profile.' }
    ] },
  { h: 'Admin tools',
    l: 'For fixing the shared list.',
    items: [
      { t: 'Edit',        p: '/edit',     d: 'Fix a coaster\u2019s details, merge duplicates, or delete an empty one.', tag: 'admin' }
    ] },
  { h: 'Other',
    l: 'What changed lately, and how to get the app.',
    items: [
      { t: 'Recent changes', p: '/changes',  d: 'What everyone has been logging, ranking and fixing, plus site updates.' },
      { t: 'Get the app',    p: '/install',  d: 'How to put Coaster Hub on your home screen, for iPhone and Android.' },
      { t: 'Sitemap',        p: '/sitemap',  d: 'This page.' }
    ] }
];

function esc(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.getElementById('map').innerHTML = GROUPS.map(function(g){
  return '<div class="smgroup"><h2>' + esc(g.h) + '</h2>'
    + (g.l ? '<p class="gl">' + esc(g.l) + '</p>' : '') + '<div class="smlist">'
    + g.items.map(function(it){
        // Per-rider pages carry data-nav so initNav rewrites them to whoever is
        // selected — following a link from here shouldn't silently drop you back
        // to "Everyone". That is why the list is built BEFORE initNav runs.
        return '<a class="sm" href="' + esc(it.p) + '"'
          + (it.rider ? ' data-nav="' + esc(it.rider) + '"' : '') + '>'
          + '<div class="t">' + esc(it.t)
          + (it.tag ? '<span class="tagpill">' + esc(it.tag) + '</span>' : '') + '</div>'
          + '<div class="p">' + esc(it.p) + '</div>'
          + '<div class="d">' + esc(it.d) + '</div></a>';
      }).join('')
    + '</div></div>';
}).join('');

CoasterHub.initNav('sitemap');

// Address assembled here, not in the markup, as on the homepage.
(function(){
  var a=document.getElementById('fb_link');
  var to=['carter.r.blanchard','gmail.com'].join('@');
  a.href='mailto:'+to+'?subject='+encodeURIComponent('Coaster Hub feedback')
    +'&body='+encodeURIComponent('\n\n---\nSent from '+location.href);
})();
</script>
</body>
</html>
