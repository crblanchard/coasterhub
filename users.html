<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- Add to home screen (2026-09-27): opens full-screen with its own icon. See site.webmanifest. -->
<link rel="manifest" href="/site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coaster Hub">
<base href="/">
<title>Riders — Coaster Hub</title>
<meta name="description" content="Everyone on Coaster Hub, their counts and their rankings.">
<link rel="stylesheet" href="/style.css?v=20261002d">
<link rel="stylesheet" href="/lists.css?v=20261004a">
<script>/* theme: set before paint so the page never flashes the wrong one (see initTheme in app.js). Light unless "dark" was chosen. */try{var chT=localStorage.getItem("ch_theme")}catch(e){}if(chT!=="dark")document.documentElement.setAttribute("data-theme","light")</script>
<link rel="icon" href="/favicon.svg?v=20260924b" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=20260924b" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16.png?v=20260924b" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260924b">
<meta property="og:title" content="Coaster Hub — Users">
<meta property="og:image" content="https://coasterhub.org/og-image.png?v=4">
<style>
  /* Everyone, A–Z by username, the same rows as home (Carter, 2026-09-29).
     The rows are style.css's .riderlist; the tiles are style.css's .tiles. */
  #list{margin-top:6px}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="/">
    <img src="/mark.svg?v=20260924b" alt="" class="brand-mark" width="40" height="40">
    <span class="brand-text">Coaster <b>Hub</b></span>
  </a>
  <nav class="links">
    <a href="/" data-nav="riders">Home</a>
    <a href="/explore" data-nav="explore">Explore</a>
    <a href="/log" data-nav="log" class="navlog">+ Log</a>
    <a href="/rankings" data-nav="rankings">Rankings</a>
    <a href="/account" data-nav="profile">Me</a>
  </nav>
  <div class="people" id="people"></div>
</div></header>

<section class="hero compact" style="--hero-t:30px;--hero-b:20px"><div class="container">
  <h1 class="wide">Riders</h1>
</div></section>

<section class="block" style="padding-top:20px"><div class="container">
  <div id="err" style="display:none"><strong>Couldn&rsquo;t load the data.</strong> This page reads external data files, so it needs to be served over the web.</div>
  <div id="loading">Loading&hellip;</div>
  <div id="ui" style="display:none">
    <div class="tiles" id="tiles"></div>
    <div class="riderlist" id="list"></div>
  </div>
</div></section>

<footer class="site"><div class="container foot-inner">
  <div>&copy; <span id="y"></span> Coaster Hub &middot; coasterhub.org</div>
  <div><a href="/">Home</a> &nbsp;&middot;&nbsp; <a href="/coasters">Coasters</a> &nbsp;&middot;&nbsp; <a href="/parks">Parks</a> &nbsp;&middot;&nbsp; <a href="/manufacturers">Manufacturers</a> &nbsp;&middot;&nbsp; <a href="/locations">Locations</a> &nbsp;&middot;&nbsp; <a href="/map">Map</a> &nbsp;&middot;&nbsp; <a href="/sitemap">Sitemap</a><span data-contrib hidden></span></div>
</div></footer>

<script src="/app.js?v=20261004a"></script>
<script>
document.getElementById('y').textContent=new Date().getFullYear();
CoasterHub.initNav('users');
var $=function(id){ return document.getElementById(id); };
var esc=function(t){ return String(t).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
function tile(n,label){ return '<div class="tile"><b>'+esc(n)+'</b><span>'+esc(label)+'</span></div>'; }
var nf=function(n){ return Number(n||0).toLocaleString(); };

Promise.all([CoasterHub.fetchUsers(), CoasterHub.fetchSummary(), CoasterHub.fetchAllRankings()]).then(function(r){
  var users=(CoasterHub.USERS||[]).slice(), sum=r[1]||[], ranks=r[2]||[];
  var by={}; sum.forEach(function(x){ by[x.slug]=x; });
  // A–Z by username (Carter, 2026-09-29).
  users.sort(function(a,b){ return String(a.slug).localeCompare(String(b.slug)); });
  var distinct={}; ranks.forEach(function(x){ (x.order||[]).forEach(function(id){ distinct[id]=1; }); });
  var started=0, credits=0, rides=0;
  users.forEach(function(u){
    var x=by[u.slug]||{};
    if(x.ranked) started++;
    credits+=x.credits||0;
    rides+=(x.rides==null ? x.credits : x.rides)||0;
  });
  // What the site adds up to: who is here, how much of it is ranked, how much
  // has been logged.
  $('tiles').innerHTML=tile(nf(users.length),'Users')
    +tile(nf(started),'Lists started')
    +tile(nf(Object.keys(distinct).length),'Coasters ranked')
    +tile(nf(credits),'Credits logged')
    +tile(nf(rides),'Rides logged');
  $('list').innerHTML=users.map(function(u){ var x=by[u.slug]||{};
    return CoasterHub.riderRow(u, x.credits||0, x.rides==null?null:x.rides, x.ranked||0); }).join('');
  $('loading').style.display='none'; $('ui').style.display='';
}).catch(function(e){
  console.error(e);
  $('loading').style.display='none'; $('err').style.display='block';
});
</script>
</body>
</html>
