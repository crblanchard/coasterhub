<script>/* theme: set before paint so the page never flashes the wrong one (see initTheme in app.js). The device's light or dark setting; on a desktop, the toggle's choice if one was made (2026-10-30). */try{var chT=matchMedia("(min-width:681px)").matches?localStorage.getItem("ch_theme"):null}catch(e){}if(chT!=="dark"&&(chT==="light"||!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)))document.documentElement.setAttribute("data-theme","light");/* In the iPhone/Android app (capacitor.config.json appendUserAgent), marked before anything renders (2026-10-31). */if(/CoasterHubApp/.test(navigator.userAgent))document.documentElement.className+=" inapp"</script>

<style>
  /* /open-review (2026-11-18): the dashboard for building the open dataset.
     Approve or reject suggested links, coasters to add, removal flags. Every
     decision changes the open dataset only; the live site switches over once,
     later. Shares /open-compare's styles. Unlisted; linked from /sources. */
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;align-items:center}
  .tabs button,.tabs a{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:7px 13px;font-size:.88rem;cursor:pointer;text-decoration:none}
  .tabs button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .tabs button b{font-weight:700;margin-left:4px}
  .tabs a{color:var(--accent2);border-style:dashed}
  .intro{color:var(--muted);font-size:.9rem;line-height:1.5;margin:0 0 14px;max-width:760px}
  .cards{display:grid;gap:10px}
  .card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel);display:grid;gap:8px}
  .card small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
  .card a{color:var(--fg);font-weight:600;text-decoration:none} .card a:hover{color:var(--accent2)}
  .pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
  .pair .arrow{color:var(--muted);padding-top:16px}
  .lab{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
  .src{font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:4px;font-weight:500}
  .why{font-size:.8rem;color:var(--muted)}
  .refs{margin-top:4px;font-size:.85rem}
  table.mini{font-size:.8rem;border-collapse:collapse;width:auto}
  table.mini th,table.mini td{padding:3px 12px 3px 0;text-align:left;border:0;white-space:nowrap;font-weight:400}
  table.mini th{color:var(--muted)}
  .act{display:flex;gap:8px;flex-wrap:wrap}
  .card small.warn{color:var(--bad)}
  .act button{border-radius:10px;padding:8px 13px;font-size:.85rem;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg)}
  .act .yes{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .act button:disabled{opacity:.5}
  @media (max-width:560px){ .pair{grid-template-columns:1fr} .pair .arrow{display:none} }
  /* /open-compare (2026-11-18): the live data and the open dataset (migrations
     187-190: Wikidata, Coasterpedia, OSM) side by side, for Carter to sort through before any swap.
     Unlisted; linked only from /sources. */
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
  .controls input[type=search],.controls select{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:9px 12px;border-radius:10px;font-size:.9rem}
  .controls input[type=search]{min-width:220px;flex:1}
  .count{color:var(--muted);font-size:.85rem;margin-bottom:10px}
  .count b{color:var(--accent2)}
  .key{color:var(--muted);font-size:.82rem;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:4px 16px}
  .key .w{display:inline}
  .key[hidden]{display:none}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
  table{border-collapse:collapse;width:100%;font-size:.8rem}
  thead th{position:sticky;top:0;background:var(--well);color:var(--muted);text-align:left;padding:9px 10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:.66rem;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:7px 10px;border-bottom:1px solid var(--soft);vertical-align:top;white-space:nowrap}
  tbody tr:hover{background:var(--tint)}
  td.nm{font-weight:600;white-space:normal;min-width:150px}
  td.nm small{display:block;font-weight:400;color:var(--muted)}
  td a{color:inherit;text-decoration:none} td a:hover{color:var(--accent2);text-decoration:underline}
  .w{display:block;color:var(--accent2);font-size:.92em}
  .w.rc{color:var(--muted)}
  td.differ{background:color-mix(in srgb,var(--bad) 12%,transparent)}
  td.differ .w{color:var(--bad)}
  td.new{background:color-mix(in srgb,var(--accent2) 12%,transparent)}
  .muted{color:var(--muted)}
  .tag{display:inline-block;font-size:.66rem;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:4px;font-weight:500}
  #more{margin:14px 0 0;background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 14px;cursor:pointer}
  #loading{color:var(--muted);padding:30px 0}
  .sv.chosen,.w.chosen{font-weight:700}
  .sv.chosen::after,.w.chosen::after{content:" \2713";color:var(--accent2)}
  .w i{font-style:normal;font-size:.78em;opacity:.75;margin-right:2px}
  .w.off{color:var(--bad)}
  .u{color:var(--muted);font-size:.85em}
  td.pickable{cursor:pointer}
  td.picked{background:color-mix(in srgb,var(--accent2) 8%,transparent)}
  td.differ .w{color:inherit} td.differ .w.off{color:var(--bad)}
  a.unsure{color:var(--muted);font-style:italic}
  .picker{position:fixed;z-index:50;width:250px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
  .picker .pt{font-size:.78rem;color:var(--muted);margin:0 0 8px}
  .picker button{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:8px 10px;margin:0 0 6px;cursor:pointer;font-size:.85rem}
  .picker button:hover{border-color:var(--accent2)}
  .picker button.on{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 10%,transparent)}
  .picker button.clr{color:var(--muted)}
  .picker .pmsg{font-size:.78rem;color:var(--bad)}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="/">
    <img src="/mark.svg?v=20260924b" alt="" class="brand-mark" width="40" height="40">
    <span class="brand-text">Coaster <b>Hub</b></span>
  </a>
  <nav class="links">
    <a href="/" data-nav="riders">Home</a>
    <a href="/explore" data-nav="explore">Explore</a>
    <a href="/log" data-nav="log" class="navlog">+ Log</a>
    <a href="/rankings" data-nav="rankings">Rankings</a>
    <a href="/account" data-nav="profile">Me</a>
  </nav>
  <div class="people" id="people"></div>
</div></header>

<section class="hero compact" style="--hero-t:30px;--hero-b:20px"><div class="container">
  <h1 class="wide">Review</h1>
  <p>Build the new dataset. Decisions here change only the new dataset; the site switches over all at once, later.</p>
</div></section>

<section class="block" style="padding-top:22px"><div class="container">
  <div class="tabs" id="tabs">
    <button data-t="match" class="on">Suggested matches <b id="n-match"></b></button>
    <button data-t="add">To add <b id="n-add"></b></button>
    <button data-t="flag">Flagged for removal <b id="n-flag"></b></button>
    <button data-t="done">Decided <b id="n-done"></b></button>
    <a href="/open-compare">Mismatches to choose</a>
    <a href="/open-cutover">Cutover</a>
    <a href="/sources">Overview</a>
  </div>
  <p class="intro" id="intro"></p>
  <div id="loading">Loading…</div>
  <div id="ui" hidden>
    <div class="controls">
      <input id="q" type="search" placeholder="Search coaster or park…">
      <select id="filt"></select>
    </div>
    <div class="count" id="count"></div>
    <div class="cards" id="list"></div>
    <button id="more" hidden>Show more</button>
  </div>
</div></section>

<script src="/app.js?v=20261118a"></script>
<script>
CoasterHub.initNav('sources');
const Q0 = new URLSearchParams(location.search).get('q');
const SRC = { wikidata: 'Wikidata', coasterpedia: 'Coasterpedia', osm: 'OpenStreetMap' };
const LINK = {
  wikidata: r => 'https://www.wikidata.org/wiki/' + r,
  coasterpedia: r => 'https://coasterpedia.net/wiki/' + encodeURIComponent(r.replace(/ /g, '_')),
  osm: r => 'https://www.openstreetmap.org/' + r,
};
const SHOW = [['manu', 'Maker'], ['h', 'Height'], ['s', 'Speed'], ['l', 'Length'], ['inv', 'Inv'], ['opened', 'Opened'], ['closed', 'Closed']];
const INTRO = {
  match: 'Links the automatic matching wasn&rsquo;t sure enough to make. Approve if the open-source record is the same ride as ours; its stats then join the new dataset.',
  add: 'Coasters the open sources have at parks on the site that match none of ours. Approve to add them to the new dataset at the switch.',
  flag: 'Coasters that only came from RCDB and nobody here has ridden. Nothing is deleted: they are flagged, and left out of the new dataset at the switch unless you keep them.',
  done: 'Everything decided so far. Undo puts it back in its list.',
};
const FILT = {
  match: [['', 'All'], ['0.95', 'Strong (95%+)'], ['wd', 'Same Wikidata item'], ['amb', 'One of several candidates']],
  add: [['op', 'Operating or under construction'], ['', 'Any status'], ['defunct', 'Closed'], ['?', 'Status unknown'], ['multi', 'In two or more sources'], ['osm', 'Only in OpenStreetMap']],
  flag: [['', 'All'], ['open', 'Still operating'], ['1999', 'Closed before 2000']],
  done: [['', 'All'], ['match', 'Matches'], ['add', 'Adds'], ['coaster', 'Flags']],
};
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let D, tab = 'match', LIMIT = 100, R = new Map();
const rk = (kind, source, ref, cid) => [kind, source || '', ref || '', cid || 0].join('|');

function load() {
  return fetch('/api/open-review', { cache: 'no-store' }).then(r => r.ok ? r.json() : r.json().then(j => Promise.reject(j.error || r.status)));
}
load().then(d => {
  D = d; R = new Map(d.reviews.map(r => [rk(r.kind, r.source, r.ref, r.coaster_id), r]));
  $('loading').hidden = true; $('ui').hidden = false;
  try { const t = localStorage.getItem('ch_openrev'); if (t && FILT[t]) tab = t; } catch (e) {}
  $('tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.t; LIMIT = 100; try { localStorage.setItem('ch_openrev', tab); } catch (e2) {} setTab(); };
  $('q').oninput = () => { LIMIT = 100; render(); };
  if (Q0) { $('q').value = Q0; tab = 'match'; }
  $('filt').onchange = () => { LIMIT = 100; render(); };
  $('more').onclick = () => { LIMIT += 100; render(); };
  setTab();
}).catch(e => { $('loading').textContent = 'Could not load' + (typeof e === 'string' ? ': ' + e : '.'); });

function setTab() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('intro').innerHTML = INTRO[tab];
  $('filt').innerHTML = FILT[tab].map(([v, t]) => '<option value="' + v + '">' + t + '</option>').join('');
  render();
}
const pending = {
  match: () => D.suggestions.filter(s => !R.has(rk('match', s.source, s.ref, s.coaster_id))),
  add: () => D.adds.filter(a => !R.has(rk('add', a.refs[0].source, a.refs[0].ref, 0))),
  flag: () => D.flags.filter(f => !R.has(rk('coaster', '', '', f.id))),
  done: () => D.reviews.slice().sort((a, b) => String(b.at).localeCompare(String(a.at))),
};
function counts() { for (const t in pending) $('n-' + t).textContent = pending[t]().length.toLocaleString(); }

function render() {
  counts();
  const q = $('q').value.trim().toLowerCase(), f = $('filt').value;
  let list = pending[tab]();
  const hay = x => tab === 'match' ? x.name + ' ' + x.park + ' ' + ((x.record || {}).name || '')
    : tab === 'add' ? x.name + ' ' + x.park : tab === 'flag' ? x.name + ' ' + x.park : label(x);
  if (q) list = list.filter(x => hay(x).toLowerCase().includes(q));
  if (tab === 'match' && f) list = list.filter(s => f === 'wd' ? /Wikidata item/.test(s.reason) : f === 'amb' ? /several/.test(s.reason) : s.score >= +f);
  if (tab === 'add' && f) list = list.filter(a => f === 'multi' ? a.refs.length > 1 : f === 'osm' ? a.refs.every(r => r.source === 'osm') : f === 'op' ? !a.status || /operat|construct/i.test(a.status) : f === '?' ? !a.status : /defunct|not operating|closed|removed|relocated/i.test(a.status || ''));
  if (tab === 'flag' && f) list = list.filter(x => f === 'open' ? !x.closed : x.closed && String(x.closed).slice(0, 4) <= f);
  if (tab === 'done' && f) list = list.filter(r => r.kind === f);
  $('count').innerHTML = '<b>' + list.length.toLocaleString() + '</b> ' + (tab === 'done' ? 'decisions' : 'to review');
  $('list').innerHTML = list.slice(0, LIMIT).map(card[tab]).join('') || '<p class="muted">Nothing here.</p>';
  $('more').hidden = list.length <= LIMIT;
}

function recLink(s, ref, name) { return '<a href="' + LINK[s](ref) + '" target="_blank" rel="noopener">' + esc(name || ref) + '</a> <span class="src">' + (SRC[s] || s) + '</span>'; }
function btns(kind, source, ref, cid, yes, no) {
  const a = 'data-k="' + kind + '" data-s="' + esc(source) + '" data-r="' + esc(ref) + '" data-c="' + (cid || 0) + '"';
  return '<div class="act"><button class="yes" ' + a + ' data-d="' + yes[0] + '">' + yes[1] + '</button><button class="no" ' + a + ' data-d="' + no[0] + '">' + no[1] + '</button></div>';
}
const card = {
  match: s => {
    const rows = SHOW.filter(([k]) => s.site[k] != null || s.facts[k] != null).map(([k, t]) =>
      '<tr><th>' + t + '</th><td>' + esc(s.site[k] == null ? '–' : s.site[k]) + '</td><td>' + esc(s.facts[k] == null ? '–' : s.facts[k]) + '</td></tr>').join('');
    return '<div class="card"><div class="pair"><div><span class="lab">Ours</span><a href="' + esc(CoasterHub.coasterHref(s.name, s.park)) + '">' + esc(s.name) + '</a><small>' + esc(s.park) + (s.closed ? ' · closed ' + esc(String(s.closed).slice(0, 4)) : '') + '</small></div>'
      + '<div class="arrow">↔</div><div><span class="lab">Open source</span>' + recLink(s.source, s.ref, (s.record || {}).name) + '<small>' + esc((s.record || {}).park || '') + '</small></div></div>'
      + '<div class="why">' + esc(s.reason) + ' · ' + Math.round(s.score * 100) + '% match</div>'
      + (rows ? '<table class="mini"><tr><th></th><th>Ours</th><th>' + (SRC[s.source] || s.source) + '</th></tr>' + rows + '</table>' : '')
      + btns('match', s.source, s.ref, s.coaster_id, ['approve', 'Same ride: link'], ['reject', 'Not the same']) + '</div>';
  },
  add: a => '<div class="card"><div class="one"><b>' + esc(a.name) + '</b><small>' + esc(a.park) + (a.status ? ' · ' + esc(a.status) : '') + '</small>'
    + '<div class="refs">' + a.refs.map(r => recLink(r.source, r.ref, r.name)).join(' · ') + '</div>'
    + (a.refs.every(r => r.source === 'osm') ? '<small class="warn">Only in OpenStreetMap, which sometimes labels water rides and play equipment as coasters.</small>' : '') + '</div>'
    + btns('add', a.refs[0].source, a.refs[0].ref, 0, ['approve', 'Add to new dataset'], ['reject', 'Leave out']) + '</div>',
  flag: x => '<div class="card"><div class="one"><a href="' + esc(CoasterHub.coasterHref(x.name, x.park)) + '"><b>' + esc(x.name) + '</b></a><small>' + esc(x.park)
    + ' · ' + (x.closed ? 'closed ' + esc(String(x.closed).slice(0, 4)) : 'operating') + ' · ' + x.siteStats + '/5 stats · RCDB only · no riders</small></div>'
    + btns('coaster', '', '', x.id, ['keep', 'Keep it'], ['remove', 'Leave out at switch']) + '</div>',
  done: r => '<div class="card"><div class="one"><b>' + esc(label(r)) + '</b><small>' + esc(verb(r)) + (r.by ? ' · ' + esc(r.by) : '') + (r.at ? ' · ' + esc(String(r.at).slice(0, 10)) : '') + '</small></div>'
    + '<div class="act"><button class="no" data-k="' + r.kind + '" data-s="' + esc(r.source) + '" data-r="' + esc(r.ref) + '" data-c="' + r.coaster_id + '" data-d="">Undo</button></div></div>',
};
function label(r) {
  if (r.kind === 'match') { const s = D.suggestions.find(x => x.source === r.source && x.ref === r.ref && x.coaster_id === r.coaster_id); return s ? s.name + ' (' + s.park + ') ↔ ' + ((s.record || {}).name || r.ref) : 'Coaster ' + r.coaster_id + ' ↔ ' + r.ref; }
  if (r.kind === 'add') { const a = D.adds.find(x => x.refs[0].source === r.source && x.refs[0].ref === r.ref); return a ? a.name + ' (' + a.park + ')' : r.note || r.ref; }
  const f = D.flags.find(x => x.id === r.coaster_id); return f ? f.name + ' (' + f.park + ')' : 'Coaster ' + r.coaster_id;
}
function verb(r) {
  return { match: { approve: 'Linked', reject: 'Not the same ride' }, add: { approve: 'Added to new dataset', reject: 'Left out' },
           coaster: { keep: 'Kept', remove: 'Left out at switch' } }[r.kind][r.decision] + ' · ' + (SRC[r.source] || '');
}

document.addEventListener('click', e => {
  const b = e.target.closest('.act button'); if (!b) return;
  const body = { kind: b.dataset.k, source: b.dataset.s, ref: b.dataset.r, coaster_id: +b.dataset.c, decision: b.dataset.d || null };
  if (body.kind === 'add' && body.decision) { const a = D.adds.find(x => x.refs[0].source === body.source && x.refs[0].ref === body.ref); if (a) body.note = a.name + ' @ ' + a.park; }
  b.disabled = true;
  fetch('/api/open-review', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
    .then(r => r.json().then(j => r.ok ? j : Promise.reject(j.error || r.status)))
    .then(() => {
      const k = rk(body.kind, body.source, body.ref, body.coaster_id);
      if (body.decision) R.set(k, Object.assign({ by: 'you', at: new Date().toISOString() }, body)), D.reviews = [...R.values()];
      else { R.delete(k); D.reviews = [...R.values()]; }
      render();
    })
    .catch(err => { b.disabled = false; alert(err === 'admins only' ? 'Sign in as an admin to decide.' : 'Could not save: ' + err); });
});
</script>
