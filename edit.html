<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor — Coaster Hub</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --ink:#14110f; --muted:#6b6459; --line:#e5ddd0; --bg:#faf7f2; --accent:#b4471f; --ok:#0a7d2c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }

  .card { max-width:420px; margin:14vh auto; background:#fff; border:1px solid var(--line); border-radius:14px; padding:28px; box-shadow:0 6px 24px rgba(0,0,0,.05); }
  .card h1 { margin:0 0 4px; font-size:1.35rem; }
  .sub { color:var(--muted); font-size:.95rem; }
  label { display:block; font-size:.72rem; color:var(--muted); margin:0 0 5px; text-transform:uppercase; letter-spacing:.04em; }
  input, select { width:100%; padding:9px 11px; font-size:.95rem; border:1px solid #cfc7ba; border-radius:8px; background:#fff; }
  button { font-size:.9rem; font-weight:600; border:0; border-radius:8px; background:var(--ink); color:#fff; cursor:pointer; padding:9px 13px; }
  button:hover { background:#000; }
  button.ghost { background:#fff; color:var(--ink); border:1px solid #cfc7ba; }
  button.ghost:hover { background:#f2ece2; }
  button.ghost.on { background:#efe7d9; }
  button.danger { background:#fff; color:var(--accent); border:1px solid #e3b3a6; }
  .msg { margin-top:12px; font-size:.9rem; min-height:1.1em; }
  .bad { color:var(--accent); } .good { color:var(--ok); }

  #app { display:none; }
  header.bar { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header.bar h1 { font-size:1.05rem; margin:0; }
  header.bar .grow { flex:1; }
  header.bar .count { color:var(--muted); font-size:.82rem; }
  .seg { display:flex; border:1px solid #cfc7ba; border-radius:8px; overflow:hidden; }
  .seg button { border:0; border-radius:0; background:#fff; color:var(--muted); padding:8px 12px; }
  .seg button.on { background:var(--ink); color:#fff; }
  .wrap { display:grid; grid-template-columns: 1fr 1fr; gap:0; height:calc(100vh - 54px); }
  @media (max-width:820px){ .wrap { grid-template-columns:1fr; height:auto; } }
  .list { overflow:auto; border-right:1px solid var(--line); }
  .row { padding:9px 16px; border-bottom:1px solid #f0e9dd; cursor:pointer; font-size:.9rem; }
  .row:hover { background:#f6f0e6; }
  .row.sel { background:#efe7d9; }
  .sec { padding:14px 16px 7px; cursor:default; border-top:2px solid #d9cdb8;
         background:#f2ece1; position:sticky; top:0; }
  .sec:hover { background:#f2ece1; }
  .sec .nm { text-transform:uppercase; letter-spacing:.09em; font-size:.72rem;
             font-weight:700; color:#6b6355; }
  .sec .pk { font-size:.76rem; }
  .live { padding:14px 16px 7px; cursor:default; }
  .live .nm { text-transform:uppercase; letter-spacing:.09em; font-size:.72rem;
              font-weight:700; color:var(--accent, #1f7a6f); }
  .row .nm { font-weight:600; }
  .row .pk { color:var(--muted); font-size:.82rem; }
  .pin { font-size:.9rem; margin-right:5px; }
  .pin.on { color:var(--ok); } .pin.off { color:#c9a99f; }
  .badge { display:inline-block; font-size:.68rem; padding:1px 6px; border-radius:20px; margin-left:6px; vertical-align:middle; }
  /* Two states, not one: nothing filled in at all is a different job from a row
     that just needs its last couple of numbers, and they used to look identical. */
  .badge.nostats { background:#fbe6de; color:var(--accent); }
  .badge.somestats { background:#f7ecd2; color:#8a6100; }
  .badge.nomap { background:#fbe6de; color:var(--accent); }
  .badge.onmap { background:#e0f0e4; color:var(--ok); }
  .editor { overflow:auto; padding:20px 22px; }
  .editor .empty { color:var(--muted); margin-top:40px; text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .grid .full { grid-column:1 / -1; }
  .actions { margin-top:18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .toast { margin-left:auto; font-size:.9rem; }
  .toolbar { margin-top:22px; padding-top:16px; border-top:1px dashed var(--line); }
  .toolbar h3 { margin:0 0 6px; font-size:.85rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .inline { display:flex; gap:8px; align-items:center; }
  .hint { color:var(--muted); font-size:.82rem; margin:4px 0 0; }
  .cbrow { display:flex; align-items:center; gap:6px; font-size:.85rem; color:var(--muted); }
  .cbrow input { width:auto; }
  a.osm { color:#2a6db0; font-size:.85rem; }
</style>
</head>
<body>
  <div class="card" id="gate">
    <h1>Coaster Hub — Editor</h1>
    <p class="sub">Admin only. Enter the password to continue.</p>
    <div style="margin-top:16px"><label for="pw">Admin password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <div style="margin-top:14px"><button id="go" style="width:100%">Unlock</button></div>
    <div class="msg" id="msg"></div>
  </div>

  <div id="app">
    <header class="bar">
      <div class="seg"><button id="mCoasters" class="on">Coasters</button><button id="mParks">Parks</button><button id="mClones">Categories</button><button id="mModels">Models</button><button id="mTriage">Triage</button></div>
      <input id="q" placeholder="Search…" style="max-width:220px">
      <button class="ghost" id="newcat">+ New category</button>
      <div class="seg" id="trseg"><button data-tf="todo" class="on">To look at</button><button data-tf="done">In a category</button><button data-tf="aside">Set aside</button></div>
      <label class="cbrow" id="fIncWrap"><input type="checkbox" id="incOnly"> Only incomplete</label>
      <label class="cbrow" id="fGeoWrap"><input type="checkbox" id="ungeoOnly"> Only un-geocoded</label>
      <span class="count" id="count"></span>
      <span class="grow"></span>
      <span class="count" id="geosum"></span>
      <button class="ghost" id="geo">Geocode missing parks</button>
      <span class="count" id="geostat"></span>
      <a href="/" style="color:var(--muted);font-size:.85rem;text-decoration:none">← Site</a>
    </header>
    <div class="wrap">
      <div class="list" id="list"></div>
      <div class="editor" id="editor"><div class="empty">Select an item to edit.</div></div>
    </div>
  </div>

  <script>
  var TOKEN = "";
  var state = { mode:"coasters", coasters: [], byId: {}, sel: null, opts: { manu:[], model:[] },
                geo: {}, parks: [], selPark: null,
                clones: [], suggest: [], riderCats: [], selClone: 0, cloneErr: "",
                models: [], blankModels: 0, selModel: "",
                skipped: {}, triageNeed: "", triageFilter: "todo" };

  var FIELDS = [
    ["name","Name","text"], ["park","Park","text"], ["type","Type","type"],
    ["manu","Manufacturer","list"], ["model","Model","list"],
    ["h","Height (ft)","num"], ["s","Speed (mph)","num"], ["l","Length (ft)","num"],
    ["inv","Inversions","int"], ["dur","Duration (sec)","int"], ["laps","Laps","int"],
    ["yr","Year","int"], ["opened","Opened (YYYY-MM-DD)","text"], ["closed","Closed (YYYY-MM-DD)","text"]
  ];
  function fieldKind(k){ for (var i=0;i<FIELDS.length;i++) if (FIELDS[i][0]===k) return FIELDS[i][2]; return "text"; }
  // The specs a coaster row is expected to carry. Everything else (model, maker,
  // duration) is genuinely optional or not published for a lot of rides, so it
  // stays out of the count rather than marking half the database as unfinished.
  var STAT_FIELDS = [["type","type"],["h","height"],["s","speed"],["l","length"],
                     ["inv","inversions"],["yr","year"]];
  function statsHave(c){
    return STAT_FIELDS.filter(function(f){ return c[f[0]]!=null && c[f[0]]!==""; });
  }
  function statsMissing(c){
    return STAT_FIELDS.filter(function(f){ return c[f[0]]==null || c[f[0]]===""; })
      .map(function(f){ return f[1]; });
  }
  // "none" = nothing to go on at all, "some" = partly filled, "full" = done.
  function statLevel(c){
    var n=statsHave(c).length;
    return n===0 ? "none" : (n<STAT_FIELDS.length ? "some" : "full");
  }
  function statBadge(c){
    var lvl=statLevel(c);
    if (lvl==="full") return "";
    var missing=statsMissing(c);
    if (lvl==="none") return '<span class="badge nostats" title="nothing filled in yet">no stats</span>';
    return '<span class="badge somestats" title="still missing: '+esc(missing.join(", "))+'">some stats · '
      + statsHave(c).length + '/' + STAT_FIELDS.length + '</span>';
  }
  function incomplete(c){ return statLevel(c)!=="full"; }
  function geocoded(park){ return !!(park && state.geo[park]); }
  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];}); }

  // TOKEN is '' when an admin account got in: the session cookie authorizes the
  // request instead, and the Worker falls through to it when the header is empty.
  // `cache: "no-store"` because /api/coasters, /api/parks and /api/clones are all
  // sent with `public, max-age=300` — right for a reader, wrong for the page
  // that just changed them. Without it, saving a category and re-reading the
  // list gave the browser's copy from before the save: the toast said "Saved",
  // the server had the new ride, and the editor showed the old one for five
  // minutes. Same family as the avatar that came back wearing its old picture
  // (CLAUDE.md); this is the editor's answer to it.
  async function api(method, path, body){
    var opt = { method: method, credentials: "same-origin", cache: "no-store",
                headers: { "x-admin-token": TOKEN } };
    if (body){ opt.headers["content-type"]="application/json"; opt.body=JSON.stringify(body); }
    var r = await fetch(path, opt);
    var data = null; try { data = await r.json(); } catch(e){}
    if (!r.ok) throw new Error((data && data.error) || ("HTTP " + r.status));
    return data;
  }

  // ---------- login ----------
  var pw=document.getElementById('pw'), msg=document.getElementById('msg');
  function showMsg(t,c){ msg.textContent=t; msg.className="msg "+(c||""); }
  async function unlock(){
    var p = pw.value; if(!p){ showMsg("Enter a password.","bad"); return; }
    showMsg("Checking…");
    try {
      var r = await fetch('/api/admin/login',{ method:"POST", headers:{ "x-admin-token": p } });
      if (r.ok){
        TOKEN = p; try{ sessionStorage.setItem('ch_admin', p); }catch(e){}
        document.getElementById('gate').style.display="none";
        document.getElementById('app').style.display="block";
        boot();
      } else if (r.status===401){ showMsg("Incorrect password — or ADMIN_PASSWORD isn’t set on the Worker yet.","bad"); }
      else { showMsg("Unexpected response ("+r.status+").","bad"); }
    } catch(e){ showMsg("Network error: "+e.message,"bad"); }
  }
  document.getElementById('go').addEventListener('click', unlock);
  pw.addEventListener('keydown', function(e){ if(e.key==="Enter") unlock(); });
  try { var saved=sessionStorage.getItem('ch_admin'); if(saved){ pw.value=saved; } } catch(e){}

  // An admin ACCOUNT gets in without the password. This page does not load
  // app.js (it is standalone on purpose), so it asks the API directly rather
  // than through CoasterHub.me(). TOKEN stays '' and the session cookie
  // authorizes every write instead.
  fetch('/api/auth/me',{credentials:'same-origin'})
    .then(function(r){ return r.ok ? r.json() : {account:null}; })
    .then(function(d){
      if (!(d && d.account && d.account.admin)) return;
      document.getElementById('gate').style.display = "none";
      document.getElementById('app').style.display = "block";
      boot();
    })
    .catch(function(){ /* offline: the password gate is still there */ });

  // ---------- boot ----------
  function distinct(key){
    var s={}; state.coasters.forEach(function(c){ if(c[key]!=null && c[key]!=="") s[c[key]]=1; });
    return Object.keys(s).sort(function(a,b){ return a.localeCompare(b,undefined,{sensitivity:"base"}); });
  }
  async function loadGeo(){
    var parks = await api("GET","/api/parks");         // { name: {lat,lon,region} } — only geocoded parks
    state.geo = {}; Object.keys(parks).forEach(function(n){ if(parks[n] && parks[n].lat!=null) state.geo[n]=parks[n]; });
  }
  async function boot(){
    var d = await api("GET","/api/coasters");
    state.coasters = d.coasters;
    state.byId = {}; state.coasters.forEach(function(c){ state.byId[c.id]=c; });
    state.opts = { manu:distinct("manu"), model:distinct("model") };
    await loadGeo();
    document.getElementById('q').addEventListener('input', render);
    document.getElementById('incOnly').addEventListener('change', render);
    document.getElementById('ungeoOnly').addEventListener('change', render);
    document.getElementById('geo').addEventListener('click', geocode);
    document.getElementById('mCoasters').addEventListener('click', function(){ setMode('coasters'); });
    document.getElementById('mParks').addEventListener('click', function(){ setMode('parks'); });
    document.getElementById('mClones').addEventListener('click', function(){ setMode('clones'); });
    document.getElementById('mModels').addEventListener('click', function(){ setMode('models'); });
    document.getElementById('mTriage').addEventListener('click', function(){ setMode('triage'); });
    document.getElementById('trseg').querySelectorAll('[data-tf]').forEach(function(b){
      b.addEventListener('click', function(){
        state.triageFilter = b.getAttribute('data-tf');
        document.getElementById('trseg').querySelectorAll('[data-tf]').forEach(function(x){
          x.classList.toggle('on', x===b); });
        state.sel = null;
        document.getElementById('editor').innerHTML =
          '<div class="empty">Select a coaster.</div>';
        renderTriage();
      });
    });
    document.getElementById('newcat').addEventListener('click', function(){ showGroup(0); });
    document.getElementById('list').addEventListener('click', function(e){
      var row = e.target.closest ? e.target.closest('.row[data-id]') : null;
      if (!row) return;
      if (state.mode==='coasters') selectCoaster(+row.getAttribute('data-id'));
      else selectPark(row.getAttribute('data-id'));
    });
    render();
  }

  function setMode(m){
    state.mode = m;
    document.getElementById('mCoasters').classList.toggle('on', m==='coasters');
    document.getElementById('mParks').classList.toggle('on', m==='parks');
    document.getElementById('mClones').classList.toggle('on', m==='clones');
    document.getElementById('mModels').classList.toggle('on', m==='models');
    document.getElementById('mTriage').classList.toggle('on', m==='triage');
    document.getElementById('fIncWrap').style.display = m==='coasters' ? '' : 'none';
    document.getElementById('fGeoWrap').style.display = m==='coasters' ? '' : 'none';
    document.getElementById('newcat').style.display = m==='clones' ? '' : 'none';
    document.getElementById('trseg').style.display = m==='triage' ? '' : 'none';
    state.selClone = 0;
    document.getElementById('editor').innerHTML = '<div class="empty">Select an item to edit.</div>';
    if (m==='parks' && !state.parks.length) loadParks();
    else if (m==='clones') loadClones();
    else if (m==='models') loadModels();
    else if (m==='triage') loadTriage();
    else render();
  }

  function render(){
    if (state.mode==='coasters') renderCoasters();
    else if (state.mode==='parks') renderParks();
    else if (state.mode==='models') renderModels();
    else if (state.mode==='triage') renderTriage();
    else renderClones();
    updateGeoSummary();
  }

  // ---------- clone groups ----------
  // Which coasters are the SAME RIDE at different parks. Curated, not computed:
  // name alone puts a B&M Invert, a FreeSpin and an SLC under "Batman: The
  // Ride", and model alone makes every B&M Invert one ride. The server suggests
  // name+model families; answering them is the job of this pane.
  async function loadClones(){
    try {
      var got = await Promise.all([api("GET","/api/clones"), api("GET","/api/admin/clones/suggest"),
                                   api("GET","/api/admin/categories")]);
      state.clones = got[0].groups || [];
      state.suggest = got[1].groups || [];
      state.riderCats = got[2].categories || [];
    } catch(e){ state.clones = []; state.suggest = []; state.riderCats = []; state.cloneErr = e.message; }
    render();
  }
  // ---------- triage ----------
  // Every coaster is in exactly one of three states, and only two of them are
  // written down anywhere: clone_members says which are IN a category,
  // category_skipped says which were looked at and left out, and what is in
  // neither is the queue. A coaster added to the shared list tomorrow lands in
  // the queue by doing nothing, which is the whole point — it is a list of
  // decisions, not a flag, so a new row is untouched by definition.
  async function loadTriage(){
    if (!state.clones.length && !state.suggest.length) { try { await loadClones(); } catch(e){} }
    try {
      var d = await api("GET","/api/admin/categories/skipped");
      state.skipped = {}; (d.ids||[]).forEach(function(i){ state.skipped[i]=1; });
      state.triageNeed = d.need || "";
    } catch(e){ state.skipped = {}; state.triageNeed = ""; state.cloneErr = e.message; }
    render();
  }
  function inCat(){
    var m = {};
    state.clones.forEach(function(g){ g.ids.forEach(function(i){ m[i]=g; }); });
    return m;
  }
  function triageBuckets(){
    var own = inCat(), todo = [], done = [], aside = [];
    state.coasters.forEach(function(c){
      if (own[c.id]) done.push(c);
      else if (state.skipped[c.id]) aside.push(c);
      else todo.push(c);
    });
    return { todo:todo, done:done, aside:aside, own:own };
  }
  function renderTriage(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var b = triageBuckets();
    var pick = b[state.triageFilter==='done' ? 'done' : state.triageFilter==='aside' ? 'aside' : 'todo'];
    var rows = pick.filter(function(c){
      return !q || ((c.name||'')+' '+(c.park||'')+' '+(c.manu||'')+' '+(c.model||''))
        .toLowerCase().indexOf(q)>=0; });

    document.getElementById('count').textContent =
      b.todo.length + " to look at \u00b7 " + b.done.length + " in a category \u00b7 "
      + b.aside.length + " set aside";

    document.getElementById('list').innerHTML =
      (state.triageNeed ? '<div class="row"><div class="nm">Set aside is not stored yet</div>'
        + '<div class="pk">run migrations/'+esc(state.triageNeed)+' \u2014 until then every '
        + 'coaster outside a category shows as still to look at</div></div>' : '')
      + '<div class="row live"><div class="nm">'
        + (state.triageFilter==='done' ? 'In a category'
           : state.triageFilter==='aside' ? 'Set aside' : 'Still to look at')
        + '</div><div class="pk">'+rows.length+' of '+pick.length
        + ' \u00b7 switch with the buttons on the right</div></div>'
      + (rows.length ? rows.slice(0,400).map(function(c){
          var g = b.own[c.id];
          return '<div class="row'+(state.sel===c.id?' sel':'')+'" data-tri="'+c.id+'">'
            + '<div class="nm">'+esc(c.name)+'</div>'
            + '<div class="pk">'+esc(c.park||'\u2014')
            + (c.model?' \u00b7 '+esc(c.model):'')
            + (g?' \u00b7 in '+esc(g.name):'')+'</div></div>'; }).join('')
          + (rows.length>400 ? '<div class="row"><div class="pk">\u2026 and '+(rows.length-400)
              + ' more. Search to narrow it.</div></div>' : '')
        : '<div class="row"><div class="pk">Nothing here.</div></div>');
    document.getElementById('list').querySelectorAll('[data-tri]').forEach(function(r){
      r.onclick = function(){ showTriage(+r.getAttribute('data-tri')); }; });
  }
  function showTriage(id){
    var c = state.byId[id]; if(!c) return;
    state.sel = id; renderTriage();
    var b = triageBuckets(), g = b.own[id], aside = !!state.skipped[id];
    document.getElementById('editor').innerHTML =
      '<h2 style="margin:0 0 4px;font-size:1.15rem">'+esc(c.name)+'</h2>'
      + '<p class="hint">'+esc(c.park||'?')+(c.manu?' \u00b7 '+esc(c.manu):'')
        + (c.model?' \u00b7 '+esc(c.model):'')+'</p>'
      + '<p class="hint">'+(g ? 'In <b>'+esc(g.name)+'</b>.'
          : aside ? 'Set aside \u2014 looked at, belongs in no category.'
          : 'Not looked at yet.')+'</p>'
      + '<div class="grid"><div class="fld full"><label>Put it in a category</label>'
      + '<select id="trcat"><option value="">\u2014 pick one \u2014</option>'
      + state.clones.map(function(x){
          return '<option value="'+x.id+'"'+(g&&g.id===x.id?' selected':'')+'>'
            + esc(x.name)+' ('+x.ids.length+')</option>'; }).join('')
      + '</select></div></div>'
      + '<div class="actions">'
      + '<button id="traside">'+(aside?'Back to the queue':'Set aside')+'</button>'
      + '<button class="ghost" id="trnext">Next in the queue</button>'
      + '<span class="toast" id="trtoast"></span></div>'
      + '<div class="toolbar"><h3>Others with the same model</h3>'
      + '<p class="hint">'+(c.model
          ? 'Often the fastest way to see whether this one belongs with something.'
          : 'This coaster has no model, so there is nothing to compare it to. '
            + 'The Models tab is where that gets fixed.')+'</p>'
      + '<div class="grid">' + (c.model ? state.coasters.filter(function(x){
          return x.id!==id && (x.model||'')===c.model; }).slice(0,20).map(function(x){
          var xg = b.own[x.id];
          return '<div class="fld full"><label>'+esc(x.name)+' \u2014 '+esc(x.park||'?')
            + (xg?' \u00b7 in '+esc(xg.name):'')+'</label></div>'; }).join('') : '')
      + '</div></div>';

    document.getElementById('trcat').onchange = async function(){
      var gid = +this.value; if(!gid) return;
      var into = state.clones.filter(function(x){ return x.id===gid; })[0]; if(!into) return;
      var t = document.getElementById('trtoast'); t.textContent='Saving\u2026';
      try {
        await api("PUT","/api/clones/"+gid,
          { name:into.name, note:into.note, ids:into.ids.concat([id]) });
        if(state.skipped[id]) await api("POST","/api/admin/categories/skipped",{ ids:[id], on:false });
        await loadClones(); await loadTriage(); nextTodo(id);
      } catch(e){ t.className='toast bad'; t.textContent=e.message; }
    };
    document.getElementById('traside').onclick = async function(){
      var t = document.getElementById('trtoast'); t.textContent='Saving\u2026';
      try {
        await api("POST","/api/admin/categories/skipped",{ ids:[id], on:!aside });
        await loadTriage();
        if(!aside) nextTodo(id); else showTriage(id);
      } catch(e){ t.className='toast bad'; t.textContent=e.message; }
    };
    document.getElementById('trnext').onclick = function(){ nextTodo(id); };
  }
  // Straight on to the next one. Triage is a queue, and stopping to find your
  // place again after every decision is most of the work.
  function nextTodo(after){
    var b = triageBuckets();
    var q = document.getElementById('q').value.trim().toLowerCase();
    var list = b.todo.filter(function(c){
      return !q || ((c.name||'')+' '+(c.park||'')+' '+(c.manu||'')+' '+(c.model||''))
        .toLowerCase().indexOf(q)>=0; });
    if(!list.length){
      state.sel = null; renderTriage();
      document.getElementById('editor').innerHTML =
        '<div class="empty">Nothing left to look at.</div>';
      return;
    }
    var at = -1;
    for(var i=0;i<list.length;i++) if(list[i].id===after){ at=i; break; }
    showTriage(list[Math.min(at+1, list.length-1)].id);
  }

  // ---------- models ----------
  // `model` is free text typed into /add and /edit, so one layout ends up under
  // three names — "SLC", "Suspended Looping Coaster", "Vekoma SLC". That reads
  // badly on the shared list and it makes a category far harder to assemble
  // than it should be, because the obvious filter does not gather the obvious
  // thing.
  async function loadModels(){
    try {
      var d = await api("GET","/api/admin/models");
      state.models = d.models || []; state.blankModels = d.blank || 0;
    } catch(e){ state.models = []; state.blankModels = 0; state.cloneErr = e.message; }
    render();
  }
  function renderModels(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var rows = state.models.filter(function(m){ return !q || m.model.toLowerCase().indexOf(q)>=0; });
    document.getElementById('count').textContent =
      rows.length + " model" + (rows.length===1?"":"s")
      + (state.blankModels ? " \u00b7 " + state.blankModels + " coasters with none" : "");
    document.getElementById('list').innerHTML = rows.length
      ? rows.map(function(m){
          return '<div class="row'+(state.selModel===m.model?' sel':'')+'" data-mdl="'+esc(m.model)+'">'
            + '<div class="nm">'+esc(m.model)+'</div>'
            + '<div class="pk">'+m.n+' coaster'+(m.n===1?'':'s')
            + (m.makers>1 ? ' \u00b7 '+m.makers+' makers' : (m.manu?' \u00b7 '+esc(m.manu):''))
            + (m.gone ? ' \u00b7 '+m.gone+' defunct' : '')+'</div></div>'; }).join('')
      : '<div class="row"><div class="pk">No model matches that.</div></div>';
    document.getElementById('list').querySelectorAll('[data-mdl]').forEach(function(r){
      r.onclick = function(){ showModel(r.getAttribute('data-mdl')); }; });
  }
  function showModel(name){
    var m = state.models.filter(function(x){ return x.model===name; })[0]; if(!m) return;
    state.selModel = name; renderModels();
    // Which coasters carry it, so a merge is never a guess about what moves.
    var carry = state.coasters.filter(function(c){ return (c.model||'')===name; })
      .sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
    document.getElementById('editor').innerHTML =
      '<h2 style="margin:0 0 4px;font-size:1.15rem">'+esc(name)+'</h2>'
      + '<p class="hint">'+m.n+' coaster'+(m.n===1?'':'s')
        + (m.makers>1 ? ' from '+m.makers+' different makers' : '')
        + '. Renaming rewrites every one of them.</p>'
      + '<div class="grid"><div class="fld full"><label>Rename to \u2014 an existing '
        + 'name merges the two</label><input id="mdlto" value="'+esc(name)+'" list="dl_models">'
        + '<datalist id="dl_models">'
        + state.models.map(function(x){ return '<option value="'+esc(x.model)+'">'; }).join('')
        + '</datalist></div></div>'
      + '<div class="actions"><button id="mdlsave">Save</button>'
        + '<span class="toast" id="mdltoast"></span></div>'
      + '<div class="toolbar"><h3>What carries it</h3>'
        + '<div class="grid">' + carry.slice(0,60).map(function(c){
            return '<div class="fld full"><label>'+esc(c.name)+' \u2014 '+esc(c.park||'?')
              + (c.manu?' \u00b7 '+esc(c.manu):'')+'</label></div>'; }).join('')
        + (carry.length>60 ? '<div class="fld full"><label>\u2026 and '+(carry.length-60)
            + ' more</label></div>' : '')
        + '</div></div>';
    document.getElementById('mdlsave').onclick = async function(){
      var to = document.getElementById('mdlto').value.trim();
      var t = document.getElementById('mdltoast');
      if(to===name){ t.textContent='That is the name it already has.'; return; }
      t.textContent='Saving\u2026';
      try {
        var out = await api("POST","/api/admin/models/rename",{ from:name, to:to });
        // The coaster list this page holds is now wrong in `moved` places, so
        // fix it here rather than re-fetching 1,114 rows for a string swap.
        state.coasters.forEach(function(c){ if((c.model||'')===name) c.model = to; });
        state.opts = { manu:distinct("manu"), model:distinct("model") };
        state.selModel = to;
        await loadModels();
        showModel(to);
        var t2 = document.getElementById('mdltoast');
        if(t2){ t2.className='toast good';
          t2.textContent = out.merged
            ? 'Merged \u2014 '+out.moved+' moved, '+out.total+' carry it now'
            : 'Renamed \u2014 '+out.moved+' updated'; }
      } catch(e){ t.className='toast bad'; t.textContent = e.message; }
    };
  }

  function cname(id){
    var c = state.coasters.find(function(x){ return x.id===id; });
    return c ? (c.name + " \u2014 " + (c.park||"?")) : ("#" + id);
  }
  function byName(a, b){
    var x = state.byId[a] || {}, y = state.byId[b] || {};
    return (x.name||"").localeCompare(y.name||"", undefined, { sensitivity:"base" })
        || (x.park||"").localeCompare(y.park||"", undefined, { sensitivity:"base" });
  }
  function renderClones(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var groups = state.clones.filter(function(g){ return !q || g.name.toLowerCase().indexOf(q)>=0; });
    var sug = state.suggest.filter(function(g){ return !q || g.name.toLowerCase().indexOf(q)>=0; });
    document.getElementById('count').textContent =
      groups.length + " categor" + (groups.length===1?"y":"ies") + " \u00b7 " + sug.length + " suggested";
    document.getElementById('list').innerHTML =
      (state.cloneErr ? '<div class="row"><b>' + esc(state.cloneErr) + '</b></div>' : '')
      + '<div class="row live"><div class="nm">Live on the site</div>'
        + '<div class="pk">' + (groups.length
            ? 'every rider is offered these'
            : 'nothing yet \u2014 take one from the suggestions below') + '</div></div>'
      + groups.map(function(g){
          return '<div class="row' + (state.selClone === g.id ? ' sel' : '') + '" data-cg="'+g.id+'">'
            + '<div class="nm">'+esc(g.name)+'</div>'
            + '<div class="pk">' + (g.note ? esc(g.note) + ' \u00b7 ' : '')
            + g.ids.length + ' rides</div></div>'; }).join('')
      + (state.riderCats.length ? '<div class="row sec"><div class="nm">Riders\u2019 own</div>'
          + '<div class="pk">read only \u2014 two riders writing the same one is the '
          + 'case for making it a Coaster Hub category</div></div>'
          + state.riderCats.map(function(c){
              return '<div class="row"><div class="nm">'+esc(c.name)
                + (c.riders > 1 ? ' <span class="sub">\u00d7'+c.riders+' riders</span>' : '')
                + '</div><div class="pk">'+esc(c.who)+' \u00b7 '+c.n+' rides'
                + (c.note ? ' \u00b7 '+esc(c.note) : '')+'</div></div>'; }).join('')
        : '')
      + (sug.length ? '<div class="row sec"><div class="nm">Suggested \u00b7 not live</div>'
          + '<div class="pk">rides sharing a name AND a model \u2014 not yet answered</div></div>'
          + sug.map(function(g,i){
          return '<div class="row" data-sg="'+i+'">'
            + '<div class="nm">'+esc(g.name)+'</div>'
            + '<div class="pk">'+esc(g.note)+' \u00b7 '+g.members.length+' rides</div></div>'; }).join('')
        : '');
    document.getElementById('list').querySelectorAll('[data-cg]').forEach(function(r){
      r.onclick = function(){ showGroup(+r.getAttribute('data-cg')); }; });
    document.getElementById('list').querySelectorAll('[data-sg]').forEach(function(r){
      r.onclick = function(){ showSuggestion(+r.getAttribute('data-sg')); }; });
  }
  function showSuggestion(i){
    var g = state.suggest[i]; if (!g) return;
    document.getElementById('editor').innerHTML =
      '<h2 style="margin:0 0 4px;font-size:1.15rem">'+esc(g.name)+'</h2>'
      + '<p class="hint">'+esc(g.note)+' \u2014 '+g.members.length+' coasters share this name and model. '
      + 'Accept and this becomes a Coaster Hub category: everybody is offered it, and '
      + 'anyone who takes it gets these rides as one row.</p>'
      + '<div class="grid" style="margin:10px 0">' + g.members.map(function(m){
          return '<div class="fld full"><label>'+esc(cname(m.id))+'</label></div>'; }).join('') + '</div>'
      + '<div class="actions"><button id="acc">Accept as a category</button>'
      + '<span class="toast" id="ctoast"></span></div>';
    document.getElementById('acc').onclick = async function(){
      try {
        var made = await api("POST","/api/clones",
          { name:g.name, note:g.note, ids:g.members.map(function(m){return m.id;}) });
        await loadClones();
        showGroup(made.id);
        var t = document.getElementById('ctoast');
        if (t) { t.textContent = "Live \u2014 every rider is offered it now"; }
      } catch(e){ document.getElementById('ctoast').textContent = e.message; }
    };
  }
  function showGroup(id){
    var made = !id;
    var g = made ? { id:0, name:"", note:"", ids:[] }
                 : state.clones.find(function(x){ return x.id===id; });
    if (!g) return;
    state.selClone = g.id; renderClones();
    document.getElementById('editor').innerHTML =
      '<h2 style="margin:0 0 10px;font-size:1.15rem">'
        + (made ? 'New category' : esc(g.name)) + '</h2>'
      + (made ? '<p class="hint">Name it, then search below for the rides that belong in it. '
        + 'Two or more, and none of them already in another category.</p>' : '')
      + '<div class="grid">'
      + '<div class="fld full"><label>Name \u2014 what the collapsed row says</label>'
      + '<input id="cgname" value="'+esc(g.name)+'"></div>'
      + '<div class="fld full"><label>Note \u2014 why they are one, e.g. "B&amp;M Invert"</label>'
      + '<input id="cgnote" value="'+esc(g.note||'')+'"></div></div>'
      + (made ? '' : '<p class="hint">Members. Untick to drop one; search below to add another.</p>')
      + '<div class="grid" id="cgmem"></div>'
      + '<div class="inline"><input id="cgadd" placeholder="Add a coaster by name\u2026" style="flex:1">'
      + '<select id="cgmanu" style="max-width:180px"><option value="">Any maker</option>'
      + state.opts.manu.map(function(o){ return '<option>'+esc(o)+'</option>'; }).join('')
      + '</select>'
      + '<select id="cgmodel" style="max-width:200px"><option value="">Any model</option>'
      + state.opts.model.map(function(o){ return '<option>'+esc(o)+'</option>'; }).join('')
      + '</select></div>'
      + '<div class="grid" id="cghits"></div>'
      + '<div id="cgsug"></div>'
      + '<div class="actions"><button id="cgsave">Save category</button>'
      + (made ? '' : '<button class="danger" id="cgdel">Delete category</button>')
      + '<span class="toast" id="ctoast"></span></div>';
    // Everything in the category right now — saved or ticked a second ago.
    // `added` is only used to mark the new ones, never to decide what is saved.
    var members = g.ids.slice(), added = {};

    // Which OTHER category owns a coaster. Shown rather than hidden: the API
    // refuses it on save anyway, and "already in Batman: The Ride" answers the
    // question, where a ride that silently never appears in search does not.
    var owner = {};
    state.clones.forEach(function(c){
      if (c.id === g.id) return;
      c.ids.forEach(function(cid){ owner[cid] = c.name; });
    });

    function redrawMembers(){
      document.getElementById('cgmem').innerHTML =
        members.slice().sort(byName).map(function(cid){
          return '<div class="fld full"><label class="cbrow">'
            + '<input type="checkbox" data-mem="'+cid+'" checked> '+esc(cname(cid))
            + (added[cid] ? ' <span class="sub">\u00b7 new</span>' : '')
            + '</label></div>'; }).join('')
        || '<div class="fld full"><span class="hint">Nothing in it yet. '
           + 'Search below.</span></div>';
      document.getElementById('cgmem').querySelectorAll('[data-mem]').forEach(function(b){
        b.onchange = function(){
          if (b.checked) return;                  // unticking is "drop on save"
          var cid = +b.getAttribute('data-mem');
          members = members.filter(function(x){ return x !== cid; });
          delete added[cid];
          redrawMembers(); redrawHits(); redrawSug();  // and it is searchable again
        };
      });
    }

    // One row per hit, so the picker and the suggestions cannot drift apart.
    function pickRow(c, why){
      var taken = owner[c.id];
      return '<div class="fld full"><label class="cbrow">'
        + '<input type="checkbox" data-add="'+c.id+'"'+(taken?' disabled':'')+'> '
        + esc(cname(c.id))
        + (c.model ? ' <span class="sub">\u00b7 '+esc(c.model)+'</span>' : '')
        + (why ? ' <span class="sub">\u00b7 '+why+'</span>' : '')
        + (taken ? ' <span class="sub">\u00b7 already in '+esc(taken)+'</span>' : '')
        + '</label></div>';
    }

    // What this category is probably missing: coasters sharing a MODEL or a
    // NAME with something already in it. That is the same signal the suggester
    // uses, applied to a half-built category instead of the whole database —
    // put one Batman in and the other four are simply there, no search needed.
    // Offered, never applied: the answer is often "no, that one is different".
    // How well a coaster matches what is ALREADY in this category. A shared
    // MODEL is the signal worth trusting; a shared name alone is how a B&M
    // Invert, a FreeSpin and an SLC all end up called Batman: The Ride. So a
    // model match sorts above a name-only one ALWAYS, in the suggestions and in
    // the search alike — both lists are answering the same question, and
    // ordering them differently would be answering it two ways.
    //
    // Rebuilt on every call rather than cached: ticking one more member changes
    // what matches, which is most of the value.
    function affinity(){
      var models={}, names={};
      members.forEach(function(cid){ var c=state.byId[cid]; if(!c) return;
        if(c.model) models[c.model]=1;
        if(c.name) names[String(c.name).trim().toLowerCase()]=1; });
      var m = function(c){ return !!(c.model && models[c.model]); };
      var n = function(c){ return !!(c.name && names[String(c.name).trim().toLowerCase()]); };
      // Four tiers, not three: a search turns up coasters matching NEITHER, and
      // they were sorting level with the name matches — "Batman Gotham City
      // Escape", which shares nothing, came out above five Batman: The Rides.
      var rank = function(c){ return m(c) ? (n(c) ? 0 : 1) : (n(c) ? 2 : 3); };
      return { model:m, name:n, rank:rank, any:function(c){ return m(c)||n(c); },
        why:function(c){
          var r = rank(c);
          return r===0 ? 'same name and model'
               : r===1 ? 'same model'
               : r===2 ? 'same name only' : ''; } };
    }

    function redrawSug(){
      var el = document.getElementById('cgsug'); if(!el) return;
      if(!members.length){ el.innerHTML=''; return; }
      var A = affinity(), rank = A.rank, why = A.why;
      // The ranking has to happen before the slice, or twelve alphabetical name
      // matches crowd the real answers off the end of the list.
      var sug = state.coasters.filter(function(c){
        if(members.indexOf(c.id)>=0 || owner[c.id]) return false;
        return A.any(c);
      }).sort(function(a,b){ return rank(a)-rank(b) || byName(a.id,b.id); }).slice(0,12);
      el.innerHTML = sug.length
        ? '<p class="hint" style="margin-top:12px">Suggested \u2014 same model or the '
          + 'same name as something already in this category. Tick what belongs; '
          + 'ignore the rest.</p><div class="grid">'
          + sug.map(function(c){ return pickRow(c, why(c)); }).join('') + '</div>'
        : '';
      wirePick(el);
    }

    function redrawHits(){
      var q = document.getElementById('cgadd').value.trim().toLowerCase();
      var mk = document.getElementById('cgmanu'), md = document.getElementById('cgmodel');
      var manu = mk ? mk.value : '', model = md ? md.value : '';
      // A maker or a model is a search in its own right: picking "Vekoma SLC"
      // should list all twelve without also having to guess a name they share,
      // which is exactly the thing they do not have.
      var any = q.length >= 2 || manu || model;
      var A2 = affinity();
      var hits = !any ? [] : state.coasters.filter(function(c){
        if (members.indexOf(c.id) >= 0) return false;   // it is already up there
        if (manu && (c.manu||'') !== manu) return false;
        if (model && (c.model||'') !== model) return false;
        return q.length < 2 || (c.name||'').toLowerCase().indexOf(q) >= 0;
      }).sort(function(a, b){ return A2.rank(a)-A2.rank(b) || byName(a.id, b.id); })
        .slice(0, 40);
      // NOT hits.map(pickRow): map passes the INDEX as the second argument, and
      // pickRow's second argument is the reason a coaster was suggested — every
      // search result came out tagged "· 1", "· 2", "· 3".
      document.getElementById('cghits').innerHTML =
        hits.map(function(c){ return pickRow(c, A2.why(c)); }).join('')
        || (!any ? '' : '<div class="fld full"><span class="hint">'
            + 'Nothing else matches.</span></div>');
      wirePick(document.getElementById('cghits'));
    }

    function wirePick(root){
      root.querySelectorAll('[data-add]').forEach(function(b){
        b.onchange = function(){
          if (!b.checked) return;
          var cid = +b.getAttribute('data-add');
          if (members.indexOf(cid) < 0) members.push(cid);
          added[cid] = 1;
          redrawMembers();
          // The row you just ticked STAYS, ticked and dead, rather than being
          // pulled out from under the next tap — with six Goliaths on screen,
          // a list that reflows on every tick is a mis-tap waiting to happen.
          // It is gone from the next search; that is where "not in the list
          // twice" is enforced.
          b.disabled = true;
          var tag = document.createElement('span');
          tag.className = 'sub'; tag.textContent = ' \u00b7 added';
          b.parentNode.appendChild(tag);
          redrawSug();               // one more in changes what else fits
        };
      });
    }
    redrawMembers(); redrawSug();
    document.getElementById('cgadd').addEventListener('input', redrawHits);
    document.getElementById('cgmanu').addEventListener('change', redrawHits);
    document.getElementById('cgmodel').addEventListener('change', redrawHits);
    document.getElementById('cgsave').onclick = async function(){
      var ids = [];
      document.getElementById('cgmem').querySelectorAll('[data-mem]').forEach(function(b){
        if (b.checked) ids.push(+b.getAttribute('data-mem')); });
      var body = { name:document.getElementById('cgname').value,
                   note:document.getElementById('cgnote').value, ids:ids };
      try {
        var saved = made ? await api("POST","/api/clones", body)
                         : await api("PUT","/api/clones/"+g.id, body);
        await loadClones();
        showGroup(made ? saved.id : g.id);
        var t = document.getElementById('ctoast');
        if (t) { t.textContent = made ? "Created \u2014 it is live" : "Saved"; }
      } catch(e){ document.getElementById('ctoast').textContent = e.message; }
    };
    if (document.getElementById('cgdel')) document.getElementById('cgdel').onclick = async function(){
      if (!confirm('Delete "'+g.name+'"? The coasters stay; they just stop being one row.')) return;
      try { await api("DELETE","/api/clones/"+g.id); await loadClones();
        state.selClone = 0; renderClones();
        document.getElementById('editor').innerHTML = '<div class="empty">Select an item to edit.</div>'; }
      catch(e){ document.getElementById('ctoast').textContent = e.message; }
    };
  }
  function updateGeoSummary(){
    var total = Object.keys(state.coasters.reduce(function(a,c){ if(c.park) a[c.park]=1; return a; }, {})).length;
    var on = Object.keys(state.geo).length;
    document.getElementById('geosum').textContent = on + " / " + total + " parks on map";
  }

  // ---------- coasters ----------
  function matches(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var incOnly = document.getElementById('incOnly').checked;
    var ungeo = document.getElementById('ungeoOnly').checked;
    return state.coasters.filter(function(c){
      if (incOnly && !incomplete(c)) return false;
      if (ungeo && geocoded(c.park)) return false;
      if (!q) return true;
      return (c.name||"").toLowerCase().indexOf(q)>=0 || (c.park||"").toLowerCase().indexOf(q)>=0;
    });
  }
  function renderCoasters(){
    var rows = matches().sort(function(a,b){
      return (a.park||"").localeCompare(b.park||"", undefined, {sensitivity:"base"})
          || (a.name||"").localeCompare(b.name||"", undefined, {sensitivity:"base"});
    });
    document.getElementById('count').textContent = rows.length + " of " + state.coasters.length;
    document.getElementById('list').innerHTML = rows.map(function(c){
      var on = geocoded(c.park);
      var pin = '<span class="pin '+(on?'on':'off')+'" title="'+(on?'park is on the map':'park not geocoded')+'">'+(on?'●':'○')+'</span>';
      return '<div class="row'+(state.sel===c.id?' sel':'')+'" data-id="'+c.id+'">'+
        '<div class="nm">'+pin+esc(c.name)+ statBadge(c) +'</div>'+
        '<div class="pk">'+esc(c.park||"—")+' · #'+c.id+'</div></div>';
    }).join("");
  }
  function fieldControl(c, f){
    var key=f[0], kind=f[2], val=c[key]==null?"":c[key];
    if (kind==="type"){
      var opts=["Steel","Wood"]; if (val && opts.indexOf(val)<0) opts.push(val);
      return '<select data-k="type">'+opts.map(function(o){ return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>'; }).join("")+'</select>';
    }
    if (kind==="list"){
      var id="dl_"+key;
      var dl='<datalist id="'+id+'">'+ state.opts[key].map(function(o){ return '<option value="'+esc(o)+'">'; }).join("") +'</datalist>';
      return '<input data-k="'+key+'" list="'+id+'" value="'+esc(val)+'" placeholder="pick or type new…">'+dl;
    }
    var t=(kind==="num"||kind==="int")?"number":"text"; var step=kind==="num"?' step="any"':'';
    return '<input data-k="'+key+'" type="'+t+'"'+step+' value="'+esc(val)+'">';
  }
  function selectCoaster(id){
    state.sel = id; renderCoasters();
    var c = state.byId[id];
    var fields = FIELDS.map(function(f){
      var cls = (f[0]==="name"||f[0]==="park") ? "fld full" : "fld";
      return '<div class="'+cls+'"><label>'+esc(f[1])+'</label>'+fieldControl(c,f)+'</div>';
    }).join("");
    var geoNote = geocoded(c.park) ? '<span class="badge onmap">park on map</span>' : '<span class="badge nomap">park not geocoded — add it in the Parks tab</span>';
    document.getElementById('editor').innerHTML =
      '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><h2 style="margin:0;font-size:1.15rem">'+esc(c.name)+'</h2>'+
        '<span style="color:var(--muted)">#'+c.id+'</span>'+geoNote+'</div>'+
      '<p class="hint">Edits update this coaster everywhere — every rider’s page reflects it automatically (they reference it by id).</p>'+
      '<div class="grid" id="form">'+fields+'</div>'+
      '<div class="actions"><button id="save">Save changes</button><button class="ghost" id="revert">Revert</button><span class="toast" id="toast"></span></div>'+
      '<div class="toolbar"><h3>Merge duplicate</h3><p class="hint">Merge this into another coaster: all riders’ credits move to the target id, then this one is deleted.</p>'+
        '<div class="inline"><span>Merge #'+c.id+' → id</span><input id="mergeTo" type="number" style="width:110px" placeholder="target id"><button class="danger" id="mergeBtn">Merge</button></div></div>'+
      '<div class="toolbar"><h3>Delete</h3>'+
        '<p class="hint" id="delWho">Checking who has this…</p>'+
        '<div class="inline"><button class="danger" id="delBtn" disabled>Delete #'+c.id+'</button></div></div>';
    document.getElementById('save').addEventListener('click', saveCoaster);
    document.getElementById('revert').addEventListener('click', function(){ selectCoaster(id); });
    document.getElementById('mergeBtn').addEventListener('click', mergeCoaster);
    document.getElementById('delBtn').addEventListener('click', deleteCoaster);
    loadUsage(id);
  }

  // Who still has this coaster. Answered before the button is live, so deleting
  // is never a guess about whose count you are about to change.
  async function loadUsage(id){
    var who=document.getElementById('delWho'), btn=document.getElementById('delBtn');
    try {
      var u = await api("GET","/api/coaster/"+id+"/usage");
      if(state.sel!==id) return;                     // selection moved while in flight
      if(!u.riders.length){
        who.innerHTML='<b>Nobody has this coaster.</b> Safe to delete — nothing references it.';
        btn.disabled=false;
        return;
      }
      var names=u.riders.map(function(r){ return esc(r.name||r.slug)+' ('+r.rides+')'; }).join(', ');
      who.innerHTML='<b>'+u.riders.length+' rider'+(u.riders.length===1?'':'s')+' still have this</b> — '
        +names+', '+u.rides+' ride'+(u.rides===1?'':'s')+' in total. '
        +'Deleting would take it off their count, so this is blocked. '
        +'Use <b>Merge</b> above to move them onto the surviving coaster instead.';
      btn.disabled=true;
    } catch(e){
      if(state.sel!==id) return;
      who.textContent="Couldn't check who has this: "+e.message+" — delete stays disabled.";
      btn.disabled=true;
    }
  }

  async function deleteCoaster(){
    var id=state.sel, c=state.byId[id];
    if(!confirm('Delete #'+id+' "'+c.name+'" at '+c.park+'?\n\n'
      +'This removes it from the shared list for everyone. It cannot be undone from this page.')) return;
    try {
      await api("DELETE","/api/coaster/"+id);
      state.coasters = state.coasters.filter(function(x){ return x.id!==id; });
      delete state.byId[id]; state.sel=null;
      document.getElementById('editor').innerHTML='<div class="empty">Deleted #'+id+'.</div>';
      renderCoasters();
    } catch(e){ alert("Delete failed: "+e.message); }
  }
  function readForm(){
    var body={};
    [].forEach.call(document.querySelectorAll('#form [data-k]'), function(inp){
      var k=inp.getAttribute('data-k'), v=(inp.value||"").trim(), kind=fieldKind(k);
      if (v==="") body[k]=null; else if (kind==="int") body[k]=parseInt(v,10); else if (kind==="num") body[k]=Number(v); else body[k]=v;
    });
    return body;
  }
  async function saveCoaster(){
    var id=state.sel, toast=document.getElementById('toast'); toast.textContent="Saving…"; toast.className="toast";
    try {
      var body = readForm(); await api("PUT","/api/coaster/"+id, body); Object.assign(state.byId[id], body);
      state.opts = { manu:distinct("manu"), model:distinct("model") };
      toast.textContent="Saved ✓"; toast.className="toast good"; renderCoasters();
    } catch(e){ toast.textContent="Error: "+e.message; toast.className="toast bad"; }
  }
  async function mergeCoaster(){
    var from=state.sel, to=parseInt(document.getElementById('mergeTo').value,10);
    if(!to){ alert("Enter a target coaster id."); return; }
    if(!state.byId[to]){ alert("No coaster with id "+to+"."); return; }
    if(!confirm("Merge #"+from+" ("+state.byId[from].name+") into #"+to+" ("+state.byId[to].name+")?")) return;
    try {
      await api("POST","/api/merge",{ from:from, to:to });
      state.coasters = state.coasters.filter(function(c){ return c.id!==from; }); delete state.byId[from]; state.sel=null;
      document.getElementById('editor').innerHTML='<div class="empty">Merged into #'+to+'.</div>'; renderCoasters();
    } catch(e){ alert("Merge failed: "+e.message); }
  }

  // ---------- parks editor ----------
  async function loadParks(){
    var d = await api("GET","/api/parks-all"); state.parks = d.parks; renderParks(); updateGeoSummary();
  }
  function renderParks(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var rows = state.parks.filter(function(p){ return !q || (p.name||"").toLowerCase().indexOf(q)>=0; });
    var onMap = state.parks.filter(function(p){ return p.lat!=null; }).length;
    document.getElementById('count').textContent = rows.length + " shown · " + onMap + "/" + state.parks.length + " on map";
    document.getElementById('list').innerHTML = rows.map(function(p){
      var on = p.lat!=null;
      var pin = '<span class="pin '+(on?'on':'off')+'">'+(on?'●':'○')+'</span>';
      return '<div class="row'+(state.selPark===p.name?' sel':'')+'" data-id="'+esc(p.name)+'">'+
        '<div class="nm">'+pin+esc(p.name)+ (on?'<span class="badge onmap">on map</span>':'<span class="badge nomap">needs coords</span>') +'</div>'+
        '<div class="pk">'+p.coasters+' coaster'+(p.coasters==1?'':'s')+ (on? ' · '+p.lat.toFixed(3)+', '+p.lon.toFixed(3) : '') +'</div></div>';
    }).join("");
  }
  function selectPark(name){
    state.selPark = name; renderParks();
    var p = state.parks.filter(function(x){ return x.name===name; })[0]; if(!p) return;
    document.getElementById('editor').innerHTML =
      '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><h2 style="margin:0;font-size:1.15rem">'+esc(p.name)+'</h2>'+
        '<span style="color:var(--muted)">'+p.coasters+' coaster'+(p.coasters==1?'':'s')+'</span></div>'+
      '<p class="hint">Coordinates put this park on the map. Find them on '+
        '<a class="osm" target="_blank" rel="noopener" href="https://www.openstreetmap.org/search?query='+encodeURIComponent(p.name)+'">OpenStreetMap ↗</a>'+
        ' or Google Maps (right-click a spot → the lat,lon shows at the top).</p>'+
      '<div class="grid"><div class="fld"><label>Latitude</label><input id="plat" type="number" step="any" value="'+(p.lat==null?"":p.lat)+'"></div>'+
        '<div class="fld"><label>Longitude</label><input id="plon" type="number" step="any" value="'+(p.lon==null?"":p.lon)+'"></div>'+
        '<div class="fld full"><label>Region (grouping label, e.g. "Ohio, US" or "Japan")</label><input id="preg" value="'+esc(p.region==null?"":p.region)+'"></div></div>'+
      '<div class="actions"><button id="psave">Save park</button><span class="toast" id="ptoast"></span></div>'+
      // Renaming is its own control, deliberately not folded into Save park.
      // Coordinates are a correction; a name change rewrites every coaster
      // standing in the park and is how somebody's shared link stays alive, so
      // it should not ride along on the button you press to nudge a latitude.
      '<div class="toolbar"><h3>Rename</h3>'+
        // No CoasterHub.slugify() here: this page does not load app.js, on
        // purpose (see the note by api() above), so the path is described
        // rather than spelled out.
        '<p class="hint">Moves all '+p.coasters+' coaster'+(p.coasters==1?'':'s')+' with it, keeps the '+
          'coordinates, and records the old name so links to this park\u2019s page keep working. '+
          'Retyping the park on each coaster instead does none of that.</p>'+
        '<div class="grid"><div class="fld full"><label>Rename to \u2014 an existing name merges the two</label>'+
          '<input id="pname" value="'+esc(p.name)+'" list="dl_parks">'+
          '<datalist id="dl_parks">'+
          state.parks.map(function(x){ return '<option value="'+esc(x.name)+'">'; }).join('')+
          '</datalist></div></div>'+
        '<div class="actions"><button id="prename">Rename park</button>'+
          '<span class="toast" id="pntoast"></span></div></div>';
    document.getElementById('psave').addEventListener('click', function(){ savePark(name); });
    document.getElementById('prename').addEventListener('click', function(){ renamePark(name); });
  }
  async function savePark(name){
    var toast=document.getElementById('ptoast'); toast.textContent="Saving…"; toast.className="toast";
    var lat=document.getElementById('plat').value.trim(), lon=document.getElementById('plon').value.trim(), reg=document.getElementById('preg').value.trim();
    try {
      await api("PUT","/api/park",{ name:name, lat:lat===""?null:Number(lat), lon:lon===""?null:Number(lon), region:reg||null });
      var p = state.parks.filter(function(x){ return x.name===name; })[0];
      if(p){ p.lat=lat===""?null:Number(lat); p.lon=lon===""?null:Number(lon); p.region=reg||null; }
      if(p && p.lat!=null) state.geo[name]=p; else delete state.geo[name];
      toast.textContent="Saved ✓"; toast.className="toast good"; renderParks(); updateGeoSummary();
    } catch(e){ toast.textContent="Error: "+e.message; toast.className="toast bad"; }
  }

  // The park name is a URL (/park/<slug>) and a string repeated on every coaster
  // standing in it, so this is one call rather than an edit per coaster: the
  // Worker moves the coasters, moves or merges the parks row, and writes the old
  // name into park_aliases so existing links keep resolving.
  async function renamePark(name){
    var toast=document.getElementById('pntoast'); toast.className="toast";
    var to=document.getElementById('pname').value.trim();
    if(!to){ toast.textContent="Give it a name."; toast.className="toast bad"; return; }
    if(to===name){ toast.textContent="That is the name it already has."; return; }
    var hit=state.parks.filter(function(x){ return x.name===to; })[0];
    if(hit && !confirm('"'+to+'" already exists with '+hit.coasters+' coaster'+(hit.coasters==1?'':'s')+'.\n\n'+
                       'Renaming merges the two into one park. That does not come back by renaming in reverse.'))
      return;
    toast.textContent="Renaming\u2026";
    try {
      var out = await api("POST","/api/admin/parks/rename",{ from:name, to:to });
      // The coaster list this page is holding now names a park that is gone.
      // Patched in place rather than re-fetching 1,114 rows for a string swap —
      // the same shortcut the model rename takes.
      state.coasters.forEach(function(c){ if((c.park||'')===name) c.park = to; });
      if(state.geo[name]){ state.geo[to]=state.geo[name]; delete state.geo[name]; }
      state.selPark = to;
      await loadParks();
      selectPark(to);
      var t2=document.getElementById('pntoast');
      if(t2){ t2.className="toast good";
        t2.textContent = out.merged
          ? 'Merged \u2014 '+out.moved+' moved, '+out.total+' here now'
          : 'Renamed \u2014 '+out.moved+' coaster'+(out.moved===1?'':'s')+' moved'; }
    } catch(e){ toast.className="toast bad"; toast.textContent=e.message; }
  }

  // ---------- geocoding ----------
  async function geocode(){
    var stat=document.getElementById('geostat'); var total=0; document.getElementById('geo').disabled=true;
    try {
      while (true){
        var d = await api("POST","/api/admin/geocode"); total += (d.added||0);
        stat.textContent = "geocoded "+total+"… "+(d.remaining||0)+" left";
        if (!d.remaining || !d.added) break;
      }
      stat.textContent = "done — "+total+" placed";
      await loadGeo(); if (state.mode==='parks') await loadParks(); render();
    } catch(e){ stat.textContent = "error: "+e.message; }
    document.getElementById('geo').disabled=false;
  }
  </script>
</body>
</html>
