<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor — Coaster Hub</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark light">
<script>/* theme: set before paint so light mode never flashes dark (see initTheme in app.js) */try{if(localStorage.getItem("ch_theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<style>
  /* Two palettes, one set of roles (Carter, 2026-09-21: "dark mode for /edit,
     let me choose"). This page does not load style.css or app.js — it is
     standalone on purpose — so it carries its own tokens, but it reads the
     SAME choice the rest of the site stores (`ch_theme` in localStorage,
     `data-theme="light"` on <html>), so the toggle here and the toggle on any
     other page are one decision. Dark is the default, as everywhere else. The
     light set is the warm palette this page always had, unchanged.

     Every colour below is a role, never a hex in a rule: the first pass at
     dark mode found twenty hard-coded light colours in the rules, which is
     how a page ends up with white inputs on a dark background. */
  :root { color-scheme:dark;
    --ink:#f4f7ff; --muted:#9fb0d6; --bg:#0b1020; --panel:#121a33;
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.2);
    --soft:#182240; --soft2:#1f2b4d;
    --accent:#ff7b7f; --ok:#4ad07a; --link:#7cc7ff;
    --btn-bg:#37d0c8; --btn-fg:#07111f; --btn-hover:#5ee0d8;
    --bad-bg:rgba(255,90,95,.14); --bad-line:rgba(255,90,95,.45);
    --warn-bg:rgba(255,196,64,.14); --warn-fg:#ffd166;
    --ok-bg:rgba(74,208,122,.14); --shadow:rgba(0,0,0,.35); }
  :root[data-theme="light"] { color-scheme:light;
    --ink:#14110f; --muted:#6b6459; --bg:#faf7f2; --panel:#fff;
    --line:#e5ddd0; --line2:#cfc7ba;
    --soft:#f2ece2; --soft2:#efe7d9;
    --accent:#b4471f; --ok:#0a7d2c; --link:#2a6db0;
    --btn-bg:#14110f; --btn-fg:#fff; --btn-hover:#000;
    --bad-bg:#fbe6de; --bad-line:#e3b3a6;
    --warn-bg:#f7ecd2; --warn-fg:#8a6100;
    --ok-bg:#e0f0e4; --shadow:rgba(0,0,0,.05); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }

  .card { max-width:420px; margin:14vh auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px; box-shadow:0 6px 24px var(--shadow); }
  .card h1 { margin:0 0 4px; font-size:1.35rem; }
  .sub { color:var(--muted); font-size:.95rem; }
  label { display:block; font-size:.72rem; color:var(--muted); margin:0 0 5px; text-transform:uppercase; letter-spacing:.04em; }
  input, select { width:100%; padding:9px 11px; font-size:.95rem; border:1px solid var(--line2); border-radius:8px; background:var(--panel); color:var(--ink); }
  button { font-size:.9rem; font-weight:600; border:0; border-radius:8px; background:var(--btn-bg); color:var(--btn-fg); cursor:pointer; padding:9px 13px; }
  button:hover { background:var(--btn-hover); }
  button.ghost { background:var(--panel); color:var(--ink); border:1px solid var(--line2); }
  button.ghost:hover { background:var(--soft); }
  button.ghost.on { background:var(--soft2); }
  button.danger { background:var(--panel); color:var(--accent); border:1px solid var(--bad-line); }
  .msg { margin-top:12px; font-size:.9rem; min-height:1.1em; }
  .bad { color:var(--accent); } .good { color:var(--ok); }

  #app { display:none; }
  header.bar { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header.bar h1 { font-size:1.05rem; margin:0; }
  header.bar .grow { flex:1; }
  header.bar .count { color:var(--muted); font-size:.82rem; }
  .seg { display:flex; border:1px solid var(--line2); border-radius:8px; overflow:hidden; }
  .seg button { border:0; border-radius:0; background:var(--panel); color:var(--muted); padding:8px 12px; }
  .seg button:hover { background:var(--soft); }
  .seg button.on { background:var(--btn-bg); color:var(--btn-fg); }
  .wrap { display:grid; grid-template-columns: 1fr 1fr; gap:0; height:calc(100vh - 54px); }
  @media (max-width:820px){ .wrap { grid-template-columns:1fr; height:auto; } }
  .list { overflow:auto; border-right:1px solid var(--line); }
  .row { padding:9px 16px; border-bottom:1px solid var(--line); cursor:pointer; font-size:.9rem; }
  .row:hover { background:var(--soft); }
  .row.sel { background:var(--soft2); }
  .sec { padding:14px 16px 7px; cursor:default; border-top:2px solid var(--line2);
         background:var(--soft); position:sticky; top:0; }
  .sec:hover { background:var(--soft); }
  .sec .nm { text-transform:uppercase; letter-spacing:.09em; font-size:.72rem;
             font-weight:700; color:var(--muted); }
  .sec .pk { font-size:.76rem; }
  .live { padding:14px 16px 7px; cursor:default; }
  .live .nm { text-transform:uppercase; letter-spacing:.09em; font-size:.72rem;
              font-weight:700; color:var(--accent, #1f7a6f); }
  .row .nm { font-weight:600; }
  .row .pk { color:var(--muted); font-size:.82rem; }
  .pin { font-size:.9rem; margin-right:5px; }
  .pin.on { color:var(--ok); } .pin.off { color:var(--bad-line); }
  .badge { display:inline-block; font-size:.68rem; padding:1px 6px; border-radius:20px; margin-left:6px; vertical-align:middle; }
  /* Two states, not one: nothing filled in at all is a different job from a row
     that just needs its last couple of numbers, and they used to look identical. */
  .badge.nostats { background:var(--bad-bg); color:var(--accent); }
  .badge.somestats { background:var(--warn-bg); color:var(--warn-fg); }
  .badge.nomap { background:var(--bad-bg); color:var(--accent); }
  .badge.onmap { background:var(--ok-bg); color:var(--ok); }
  .editor { overflow:auto; padding:20px 22px; }
  .editor .empty { color:var(--muted); margin-top:40px; text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .grid .full { grid-column:1 / -1; }
  .actions { margin-top:18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .toast { margin-left:auto; font-size:.9rem; }
  .toolbar { margin-top:22px; padding-top:16px; border-top:1px dashed var(--line); }
  .toolbar h3 { margin:0 0 6px; font-size:.85rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .inline { display:flex; gap:8px; align-items:center; }
  .hint { color:var(--muted); font-size:.82rem; margin:4px 0 0; }
  .cbrow { display:flex; align-items:center; gap:6px; font-size:.85rem; color:var(--muted); }
  .cbrow input { width:auto; }
  a.osm { color:var(--link); font-size:.85rem; }
  /* A scrolling box inside the editor pane. The lists it holds are as long as
     the database — 545 rides carry no model — and without it the pane's own
     scrollbar carried everything, so the control that acts on a list sat
     hundreds of rows below the list. */
  .pane { max-height:42vh; overflow:auto; border:1px solid var(--line);
          border-radius:10px; padding:6px 10px; background:var(--panel); margin-top:8px; }
  /* These rows are inside <label>s so the checkbox is clickable, and `label`
     in this page is a FIELD label: uppercase and letter-spaced. A ride's name
     is not a field label. Same family as the CSS lessons in CLAUDE.md — the
     rule named the element, so it caught everything shaped like one. */
  .pane .tick, .cbrow.tick { padding:3px 0; font-size:.88rem;
                             text-transform:none; letter-spacing:normal; }
  .cbrow.tick { align-items:baseline; gap:8px; color:var(--ink); }
  /* How much of a model has been filed into categories. Named for what it
     means rather than where it is drawn, because the same three states are
     read in the models list and in the triage headers. */
  .badge.mixed { background:var(--bad-bg); color:var(--accent); }
  .badge.partial { background:var(--warn-bg); color:var(--warn-fg); }
  .badge.settled { background:var(--ok-bg); color:var(--ok); }
  .badge.gone { background:var(--soft2); color:var(--muted); }
  /* The theme toggle: the same sun-and-moon the site's header carries. */
  .themetoggle { width:32px; height:32px; padding:0; border-radius:999px; background:var(--panel); border:1px solid var(--line2); color:var(--muted); display:inline-flex; align-items:center; justify-content:center; }
  .themetoggle:hover { background:var(--soft); color:var(--ink); }
  .themetoggle svg { width:16px; height:16px; }
</style>
</head>
<body>
  <div class="card" id="gate">
    <h1>Coaster Hub — Editor</h1>
    <p class="sub">Admin only. Enter the password to continue.</p>
    <div style="margin-top:16px"><label for="pw">Admin password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <div style="margin-top:14px"><button id="go" style="width:100%">Unlock</button></div>
    <div class="msg" id="msg"></div>
    <div style="margin-top:14px;display:flex;justify-content:flex-end"><button class="themetoggle" type="button" data-el="theme" aria-label="Switch theme" title="Switch theme"></button></div>
  </div>

  <div id="app">
    <header class="bar">
      <!-- Three groups, not one row of five: each queue sits with the thing it
           is a queue for, so "Triage" next to Categories and "Triage" next to
           Models are obviously two different queues. (Carter, 2026-09-20.) -->
      <div class="seg"><button id="mCoasters" class="on">Coasters</button><button id="mParks">Parks</button></div>
      <div class="seg"><button id="mClones">Categories</button><button id="mTriage">Triage</button></div>
      <div class="seg"><button id="mModels">Models</button><button id="mMTriage">Triage</button></div>
      <input id="q" placeholder="Search…" style="max-width:220px">
      <button class="ghost" id="newcat">+ New category</button>
      <div class="seg" id="trseg"><button data-tf="todo" class="on">To look at</button><button data-tf="done">In a category</button><button data-tf="aside">Set aside</button></div>
      <div class="seg" id="mtseg"><button data-mf="todo" class="on">To look at</button><button data-mf="done">Has a model</button><button data-mf="aside">Set aside</button></div>
      <label class="cbrow" id="fIncWrap"><input type="checkbox" id="incOnly"> Only incomplete</label>
      <label class="cbrow" id="fGeoWrap"><input type="checkbox" id="ungeoOnly"> Only un-geocoded</label>
      <label class="cbrow" id="fOpenWrap"><input type="checkbox" id="openOnly"> Only models still operating</label>
      <label class="cbrow" id="fGrpWrap"><input type="checkbox" id="byGroup"> <span id="grpLbl">By model</span></label>
      <span class="count" id="count"></span>
      <span class="grow"></span>
      <span class="count" id="geosum"></span>
      <button class="ghost" id="geo">Geocode missing parks</button>
      <span class="count" id="geostat"></span>
      <button class="themetoggle" type="button" data-el="theme" aria-label="Switch theme" title="Switch theme"></button>
      <a href="/" style="color:var(--muted);font-size:.85rem;text-decoration:none">← Site</a>
    </header>
    <div class="wrap">
      <div class="list" id="list"></div>
      <div class="editor" id="editor"><div class="empty">Select an item to edit.</div></div>
    </div>
  </div>

  <script>
// ---- the theme, chosen here or anywhere else on the site --------------------
// The same key and the same attribute app.js uses (THEME_KEY / applyTheme),
// re-stated because this page does not load app.js. Dark unless the choice
// says light; the choice is one choice, site-wide.
(function(){
  var KEY='ch_theme';
  var SUN='<path d="M12 4V2M12 22v-2M4 12H2M22 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4l-1.4 1.4M19.8 4.2l-1.4 1.4"/><circle cx="12" cy="12" r="4"/>';
  var MOON='<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>';
  function current(){ try{ return localStorage.getItem(KEY)==='light' ? 'light' : 'dark'; }catch(e){ return 'dark'; } }
  function apply(t){
    if(t==='light') document.documentElement.setAttribute('data-theme','light');
    else document.documentElement.removeAttribute('data-theme');
    var m=document.querySelector('meta[name="theme-color"]');
    if(!m){ m=document.createElement('meta'); m.setAttribute('name','theme-color'); document.head.appendChild(m); }
    m.setAttribute('content', t==='light' ? '#faf7f2' : '#0b1020');
    var btns=document.querySelectorAll('[data-el="theme"]');
    for(var i=0;i<btns.length;i++){
      // The icon shows where the click GOES, as app.js does: a sun on the dark page.
      btns[i].innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(t==='light'?MOON:SUN)+'</svg>';
      btns[i].setAttribute('aria-label', t==='light' ? 'Switch to dark mode' : 'Switch to light mode');
    }
  }
  apply(current());
  var btns=document.querySelectorAll('[data-el="theme"]');
  for(var i=0;i<btns.length;i++) btns[i].addEventListener('click',function(){
    var next = current()==='light' ? 'dark' : 'light';
    try{ localStorage.setItem(KEY,next); }catch(e){}
    apply(next);
  });
})();

  var TOKEN = "";
  var state = { mode:"coasters", coasters: [], byId: {}, sel: null, opts: { manu:[], model:[] },
                geo: {}, parks: [], selPark: null,
                clones: [], suggest: [], riderCats: [], selClone: 0, cloneErr: "",
                models: [], blankModels: 0, selModel: "", modelRows: [],
                skipped: {}, triageNeed: "", triageFilter: "todo", triageLoaded: false,
                mskipped: {}, mtriageNeed: "", mtriageFilter: "todo", mtriageLoaded: false };

  var FIELDS = [
    ["name","Name","text"], ["park","Park","text"], ["type","Type","type"],
    ["manu","Manufacturer","list"], ["model","Model","list"],
    ["h","Height (ft)","num"], ["s","Speed (mph)","num"], ["l","Length (ft)","num"],
    ["inv","Inversions","int"], ["dur","Duration (sec)","int"], ["laps","Laps","int"],
    // No Year box. `yr` is the opening year and nothing else — across the 572
    // rows that carry both it has never once disagreed with `opened`, so it is
    // a second place to type the same fact and a second place to get it wrong.
    // readForm() derives it from Opened, the way /add already does.
    ["opened","Opened (YYYY-MM-DD)","text"], ["closed","Closed (YYYY-MM-DD)","text"]
  ];
  function fieldKind(k){ for (var i=0;i<FIELDS.length;i++) if (FIELDS[i][0]===k) return FIELDS[i][2]; return "text"; }
  // The specs a coaster row is expected to carry. Everything else (model, maker,
  // duration) is genuinely optional or not published for a lot of rides, so it
  // stays out of the count rather than marking half the database as unfinished.
  var STAT_FIELDS = [["type","type"],["h","height"],["s","speed"],["l","length"],
                     ["inv","inversions"],["opened","opened"]];
  function statsHave(c){
    return STAT_FIELDS.filter(function(f){ return c[f[0]]!=null && c[f[0]]!==""; });
  }
  function statsMissing(c){
    return STAT_FIELDS.filter(function(f){ return c[f[0]]==null || c[f[0]]===""; })
      .map(function(f){ return f[1]; });
  }
  // "none" = nothing to go on at all, "some" = partly filled, "full" = done.
  function statLevel(c){
    var n=statsHave(c).length;
    return n===0 ? "none" : (n<STAT_FIELDS.length ? "some" : "full");
  }
  function statBadge(c){
    var lvl=statLevel(c);
    if (lvl==="full") return "";
    var missing=statsMissing(c);
    if (lvl==="none") return '<span class="badge nostats" title="nothing filled in yet">no stats</span>';
    return '<span class="badge somestats" title="still missing: '+esc(missing.join(", "))+'">some stats · '
      + statsHave(c).length + '/' + STAT_FIELDS.length + '</span>';
  }
  function incomplete(c){ return statLevel(c)!=="full"; }
  function geocoded(park){ return !!(park && state.geo[park]); }
  function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];}); }

  // TOKEN is '' when an admin account got in: the session cookie authorizes the
  // request instead, and the Worker falls through to it when the header is empty.
  // `cache: "no-store"` because /api/coasters, /api/parks and /api/clones are all
  // sent with `public, max-age=300` — right for a reader, wrong for the page
  // that just changed them. Without it, saving a category and re-reading the
  // list gave the browser's copy from before the save: the toast said "Saved",
  // the server had the new ride, and the editor showed the old one for five
  // minutes. Same family as the avatar that came back wearing its old picture
  // (CLAUDE.md); this is the editor's answer to it.
  async function api(method, path, body){
    var opt = { method: method, credentials: "same-origin", cache: "no-store",
                headers: { "x-admin-token": TOKEN } };
    if (body){ opt.headers["content-type"]="application/json"; opt.body=JSON.stringify(body); }
    var r = await fetch(path, opt);
    var data = null; try { data = await r.json(); } catch(e){}
    if (!r.ok) throw new Error((data && data.error) || ("HTTP " + r.status));
    return data;
  }

  // ---------- login ----------
  var pw=document.getElementById('pw'), msg=document.getElementById('msg');
  function showMsg(t,c){ msg.textContent=t; msg.className="msg "+(c||""); }
  async function unlock(){
    var p = pw.value; if(!p){ showMsg("Enter a password.","bad"); return; }
    showMsg("Checking…");
    try {
      var r = await fetch('/api/admin/login',{ method:"POST", headers:{ "x-admin-token": p } });
      if (r.ok){
        TOKEN = p; try{ sessionStorage.setItem('ch_admin', p); }catch(e){}
        document.getElementById('gate').style.display="none";
        document.getElementById('app').style.display="block";
        boot();
      } else if (r.status===401){ showMsg("Incorrect password — or ADMIN_PASSWORD isn’t set on the Worker yet.","bad"); }
      else { showMsg("Unexpected response ("+r.status+").","bad"); }
    } catch(e){ showMsg("Network error: "+e.message,"bad"); }
  }
  document.getElementById('go').addEventListener('click', unlock);
  pw.addEventListener('keydown', function(e){ if(e.key==="Enter") unlock(); });
  try { var saved=sessionStorage.getItem('ch_admin'); if(saved){ pw.value=saved; } } catch(e){}

  // An admin ACCOUNT gets in without the password. This page does not load
  // app.js (it is standalone on purpose), so it asks the API directly rather
  // than through CoasterHub.me(). TOKEN stays '' and the session cookie
  // authorizes every write instead.
  fetch('/api/auth/me',{credentials:'same-origin'})
    .then(function(r){ return r.ok ? r.json() : {account:null}; })
    .then(function(d){
      if (!(d && d.account && d.account.admin)) return;
      document.getElementById('gate').style.display = "none";
      document.getElementById('app').style.display = "block";
      boot();
    })
    .catch(function(){ /* offline: the password gate is still there */ });

  // ---------- boot ----------
  function distinct(key){
    var s={}; state.coasters.forEach(function(c){ if(c[key]!=null && c[key]!=="") s[c[key]]=1; });
    return Object.keys(s).sort(function(a,b){ return a.localeCompare(b,undefined,{sensitivity:"base"}); });
  }
  async function loadGeo(){
    var parks = await api("GET","/api/parks");         // { name: {lat,lon,region} } — only geocoded parks
    state.geo = {}; Object.keys(parks).forEach(function(n){ if(parks[n] && parks[n].lat!=null) state.geo[n]=parks[n]; });
  }
  async function boot(){
    var d = await api("GET","/api/coasters");
    state.coasters = d.coasters;
    state.byId = {}; state.coasters.forEach(function(c){ state.byId[c.id]=c; });
    state.opts = { manu:distinct("manu"), model:distinct("model") };
    await loadGeo();
    document.getElementById('q').addEventListener('input', render);
    document.getElementById('incOnly').addEventListener('change', render);
    document.getElementById('ungeoOnly').addEventListener('change', render);
    document.getElementById('openOnly').addEventListener('change', render);
    document.getElementById('byGroup').addEventListener('change', function(){
      state.sel = null;
      document.getElementById('editor').innerHTML = '<div class="empty">Select a coaster.</div>';
      render();
    });
    document.getElementById('geo').addEventListener('click', geocode);
    document.getElementById('mCoasters').addEventListener('click', function(){ setMode('coasters'); });
    document.getElementById('mParks').addEventListener('click', function(){ setMode('parks'); });
    document.getElementById('mClones').addEventListener('click', function(){ setMode('clones'); });
    document.getElementById('mModels').addEventListener('click', function(){ setMode('models'); });
    document.getElementById('mTriage').addEventListener('click', function(){ setMode('triage'); });
    document.getElementById('mMTriage').addEventListener('click', function(){ setMode('mtriage'); });
    document.getElementById('trseg').querySelectorAll('[data-tf]').forEach(function(b){
      b.addEventListener('click', function(){
        state.triageFilter = b.getAttribute('data-tf');
        document.getElementById('trseg').querySelectorAll('[data-tf]').forEach(function(x){
          x.classList.toggle('on', x===b); });
        state.sel = null;
        document.getElementById('editor').innerHTML =
          '<div class="empty">Select a coaster.</div>';
        renderTriage();
      });
    });
    document.getElementById('mtseg').querySelectorAll('[data-mf]').forEach(function(b){
      b.addEventListener('click', function(){
        state.mtriageFilter = b.getAttribute('data-mf');
        document.getElementById('mtseg').querySelectorAll('[data-mf]').forEach(function(x){
          x.classList.toggle('on', x===b); });
        state.sel = null;
        document.getElementById('editor').innerHTML =
          '<div class="empty">Select a coaster.</div>';
        renderMTriage();
      });
    });
    document.getElementById('newcat').addEventListener('click', function(){ showGroup(0); });
    document.getElementById('list').addEventListener('click', function(e){
      var row = e.target.closest ? e.target.closest('.row[data-id]') : null;
      if (!row) return;
      if (state.mode==='coasters') selectCoaster(+row.getAttribute('data-id'));
      else selectPark(row.getAttribute('data-id'));
    });
    render();
  }

  function setMode(m){
    state.mode = m;
    document.getElementById('mCoasters').classList.toggle('on', m==='coasters');
    document.getElementById('mParks').classList.toggle('on', m==='parks');
    document.getElementById('mClones').classList.toggle('on', m==='clones');
    document.getElementById('mModels').classList.toggle('on', m==='models');
    document.getElementById('mTriage').classList.toggle('on', m==='triage');
    document.getElementById('mMTriage').classList.toggle('on', m==='mtriage');
    document.getElementById('fIncWrap').style.display = m==='coasters' ? '' : 'none';
    document.getElementById('fGeoWrap').style.display = m==='coasters' ? '' : 'none';
    document.getElementById('fOpenWrap').style.display = m==='models' ? '' : 'none';
    // One checkbox, two queues. What it groups BY is different in each — the
    // category queue reads best by model, the model queue by maker — so the
    // label says which one you are about to get.
    document.getElementById('fGrpWrap').style.display =
      (m==='triage' || m==='mtriage') ? '' : 'none';
    document.getElementById('grpLbl').textContent = m==='mtriage' ? 'By park' : 'By model';
    document.getElementById('newcat').style.display = m==='clones' ? '' : 'none';
    document.getElementById('trseg').style.display = m==='triage' ? '' : 'none';
    document.getElementById('mtseg').style.display = m==='mtriage' ? '' : 'none';
    state.selClone = 0;
    document.getElementById('editor').innerHTML = '<div class="empty">Select an item to edit.</div>';
    if (m==='parks' && !state.parks.length) loadParks();
    else if (m==='clones') loadClones();
    else if (m==='models') loadModels();
    else if (m==='triage') loadTriage();
    else if (m==='mtriage') loadMTriage();
    else render();
  }

  function render(){
    if (state.mode==='coasters') renderCoasters();
    else if (state.mode==='parks') renderParks();
    else if (state.mode==='models') renderModels();
    else if (state.mode==='triage') renderTriage();
    else if (state.mode==='mtriage') renderMTriage();
    else renderClones();
    updateGeoSummary();
  }

  // ---------- clone groups ----------
  // Which coasters are the SAME RIDE at different parks. Curated, not computed:
  // name alone puts a B&M Invert, a FreeSpin and an SLC under "Batman: The
  // Ride", and model alone makes every B&M Invert one ride. The server suggests
  // name+model families; answering them is the job of this pane.
  async function loadClones(){
    try {
      var got = await Promise.all([api("GET","/api/clones"), api("GET","/api/admin/clones/suggest"),
                                   api("GET","/api/admin/categories")]);
      state.clones = got[0].groups || [];
      state.suggest = got[1].groups || [];
      state.riderCats = got[2].categories || [];
    } catch(e){ state.clones = []; state.suggest = []; state.riderCats = []; state.cloneErr = e.message; }
    render();
  }
  // ---------- triage ----------
  // Every coaster is in exactly one of three states, and only two of them are
  // written down anywhere: clone_members says which are IN a category,
  // category_skipped says which were looked at and left out, and what is in
  // neither is the queue. A coaster added to the shared list tomorrow lands in
  // the queue by doing nothing, which is the whole point — it is a list of
  // decisions, not a flag, so a new row is untouched by definition.
  async function loadTriage(){
    if (!state.clones.length && !state.suggest.length) { try { await loadClones(); } catch(e){} }
    try {
      var d = await api("GET","/api/admin/categories/skipped");
      state.skipped = {}; (d.ids||[]).forEach(function(i){ state.skipped[i]=1; });
      state.triageNeed = d.need || ""; state.triageLoaded = true;
    } catch(e){ state.skipped = {}; state.triageNeed = ""; state.cloneErr = e.message; }
    render();
  }
  function inCat(){
    var m = {};
    state.clones.forEach(function(g){ g.ids.forEach(function(i){ m[i]=g; }); });
    return m;
  }
  function triageBuckets(){
    var own = inCat(), todo = [], done = [], aside = [];
    state.coasters.forEach(function(c){
      if (own[c.id]) done.push(c);
      else if (state.skipped[c.id]) aside.push(c);
      else todo.push(c);
    });
    return { todo:todo, done:done, aside:aside, own:own };
  }
  // How much of a model has already been decided. The sentence triage keeps
  // wanting: twelve SLCs, nine of them in a category, is most of the answer for
  // the other three — and "none of them yet" says the opposite just as clearly.
  function coverText(e){
    if (!e) return "";
    var n = e.filed.length, t = e.rides.length;
    return (n ? n + " of " + t : "none of " + t) + " in a category";
  }
  function coverBadge(e){
    var n = e.filed.length, t = e.rides.length;
    var k = n === t ? 'settled' : n ? 'partial' : 'gone';
    return ' <span class="badge '+k+'">'+n+'/'+t+'</span>';
  }
  function triageRow(c, b){
    var g = b.own[c.id];
    return '<div class="row'+(state.sel===c.id?' sel':'')+'" data-tri="'+c.id+'">'
      + '<div class="nm">'+esc(c.name)+'</div>'
      + '<div class="pk">'+esc(c.park||'\u2014')
      + (c.model?' \u00b7 '+esc(c.model):'')
      + (g?' \u00b7 in '+esc(g.name):'')+'</div></div>';
  }
  // The queue, in model order, under a header saying how far that model has
  // already got. Sorting by name walks the same twelve SLCs at twelve unrelated
  // moments; this puts them together and says "nine of these are already in a
  // category", which is the decision, not a step towards it.
  //
  // The fraction counts EVERY ride carrying the model, not the ones in this
  // list: what is left in the queue is exactly what the fraction is about.
  function triageGrouped(rows, b){
    var split = modelSplit(), by = {};
    rows.forEach(function(c){
      var k = (c.model||'').trim() || NOMODEL;
      (by[k] = by[k] || []).push(c);
    });
    var keys = Object.keys(by).sort(function(x, y){
      // Nearly-finished models first: they are the ones where the rest of the
      // database has already made the decision. Rides with no model at all sink
      // to the bottom — nothing can be inferred about them here, and the Models
      // tab is where they get answered.
      if (x===NOMODEL) return 1;
      if (y===NOMODEL) return -1;
      var a = split[x], c = split[y];
      return (c.filed.length / c.rides.length) - (a.filed.length / a.rides.length)
        || by[y].length - by[x].length
        || modelLabel(x).localeCompare(modelLabel(y));
    });
    var left = 400, out = [];
    keys.forEach(function(k){
      if (left <= 0) return;
      var e = split[k], mine = by[k].slice(0, left);
      left -= mine.length;
      var where = k===NOMODEL ? 'nothing in the database says what these are'
        : e.cat.length === 1 ? 'in ' + esc(e.cat[0])
        : e.cat.length ? 'across ' + e.cat.length + ' different categories'
        : 'no category holds one yet';
      out.push('<div class="row sec"><div class="nm">'+esc(modelLabel(k))
        + (k===NOMODEL ? '' : coverBadge(e))+'</div>'
        + '<div class="pk">'+mine.length+' here \u00b7 '+where
        + (k!==NOMODEL && e.aside.length ? ' \u00b7 '+e.aside.length+' set aside' : '')
        + '</div></div>'
        + mine.map(function(c){ return triageRow(c, b); }).join(''));
    });
    var shown = 400 - left;
    if (shown < rows.length) out.push('<div class="row"><div class="pk">\u2026 and '
      + (rows.length - shown) + ' more. Search to narrow it.</div></div>');
    return out.join('');
  }
  function renderTriage(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var b = triageBuckets();
    var pick = b[state.triageFilter==='done' ? 'done' : state.triageFilter==='aside' ? 'aside' : 'todo'];
    var rows = pick.filter(function(c){
      return !q || ((c.name||'')+' '+(c.park||'')+' '+(c.manu||'')+' '+(c.model||''))
        .toLowerCase().indexOf(q)>=0; });
    var grouped = document.getElementById('byGroup').checked;

    document.getElementById('count').textContent =
      b.todo.length + " to look at \u00b7 " + b.done.length + " in a category \u00b7 "
      + b.aside.length + " set aside";

    document.getElementById('list').innerHTML =
      (state.triageNeed ? '<div class="row"><div class="nm">Set aside is not stored yet</div>'
        + '<div class="pk">run migrations/'+esc(state.triageNeed)+' \u2014 until then every '
        + 'coaster outside a category shows as still to look at</div></div>' : '')
      + '<div class="row live"><div class="nm">'
        + (state.triageFilter==='done' ? 'In a category'
           : state.triageFilter==='aside' ? 'Set aside' : 'Still to look at')
        + '</div><div class="pk">'+rows.length+' of '+pick.length
        + ' \u00b7 switch with the buttons on the right'
        + (grouped ? ' \u00b7 grouped by model' : '')+'</div></div>'
      + (rows.length
          ? (grouped ? triageGrouped(rows, b)
             : rows.slice(0,400).map(function(c){ return triageRow(c, b); }).join('')
               + (rows.length>400 ? '<div class="row"><div class="pk">\u2026 and '+(rows.length-400)
                   + ' more. Search to narrow it.</div></div>' : ''))
          : '<div class="row"><div class="pk">Nothing here.</div></div>');
    document.getElementById('list').querySelectorAll('[data-tri]').forEach(function(r){
      r.onclick = function(){ showTriage(+r.getAttribute('data-tri')); }; });
  }
  function showTriage(id){
    var c = state.byId[id]; if(!c) return;
    state.sel = id; renderTriage();
    document.getElementById('editor').scrollTop = 0;
    var b = triageBuckets(), g = b.own[id], aside = !!state.skipped[id];
    var cover = c.model ? modelSplit()[(c.model||'').trim()] : null;
    document.getElementById('editor').innerHTML =
      '<h2 style="margin:0 0 4px;font-size:1.15rem">'+esc(c.name)+'</h2>'
      + '<p class="hint">'+esc(c.park||'?')+(c.manu?' \u00b7 '+esc(c.manu):'')
        + (c.model?' \u00b7 '+esc(c.model):'')+'</p>'
      + '<p class="hint">'+(g ? 'In <b>'+esc(g.name)+'</b>.'
          : aside ? 'Set aside \u2014 looked at, belongs in no category.'
          : 'Not looked at yet.')+'</p>'
      + '<div class="grid"><div class="fld full"><label>Put it in a category</label>'
      + '<select id="trcat"><option value="">\u2014 pick one \u2014</option>'
      + state.clones.map(function(x){
          return '<option value="'+x.id+'"'+(g&&g.id===x.id?' selected':'')+'>'
            + esc(x.name)+' ('+x.ids.length+')</option>'; }).join('')
      + '</select></div></div>'
      + '<div class="actions">'
      + '<button id="traside">'+(aside?'Back to the queue':'Set aside')+'</button>'
      + '<button class="ghost" id="trnext">Next in the queue</button>'
      + '<span class="toast" id="trtoast"></span></div>'
      + '<div class="toolbar"><h3>Others with the same model</h3>'
      + '<p class="hint">'+(!c.model
          ? 'This coaster has no model, so there is nothing to compare it to. '
            + 'The Models tab is where that gets fixed.'
          : esc(c.model)+' \u2014 '+coverText(cover)
            + (cover.cat.length===1 ? ', all in ' + esc(cover.cat[0])
               : cover.cat.length ? ', across ' + cover.cat.length + ' different categories' : '')
            + (cover.aside.length ? ' \u00b7 '+cover.aside.length+' set aside' : '')
            + '. ' + (cover.filed.length && cover.cat.length===1
                ? 'The rest of the model has already answered this one.'
                : 'Often the fastest way to see whether this one belongs with something.'))+'</p>'
      + '<div class="grid">' + (c.model ? state.coasters.filter(function(x){
          return x.id!==id && (x.model||'')===c.model; }).slice(0,20).map(function(x){
          var xg = b.own[x.id];
          return '<div class="fld full"><label>'+esc(x.name)+' \u2014 '+esc(x.park||'?')
            + (xg?' \u00b7 in '+esc(xg.name):'')+'</label></div>'; }).join('') : '')
      + '</div></div>';

    document.getElementById('trcat').onchange = async function(){
      var gid = +this.value; if(!gid) return;
      var into = state.clones.filter(function(x){ return x.id===gid; })[0]; if(!into) return;
      var t = document.getElementById('trtoast'); t.textContent='Saving\u2026';
      try {
        await api("PUT","/api/clones/"+gid,
          { name:into.name, note:into.note, ids:into.ids.concat([id]) });
        if(state.skipped[id]) await api("POST","/api/admin/categories/skipped",{ ids:[id], on:false });
        await loadClones(); await loadTriage(); nextTodo(id);
      } catch(e){ t.className='toast bad'; t.textContent=e.message; }
    };
    document.getElementById('traside').onclick = async function(){
      var t = document.getElementById('trtoast'); t.textContent='Saving\u2026';
      try {
        await api("POST","/api/admin/categories/skipped",{ ids:[id], on:!aside });
        await loadTriage();
        if(!aside) nextTodo(id); else showTriage(id);
      } catch(e){ t.className='toast bad'; t.textContent=e.message; }
    };
    document.getElementById('trnext').onclick = function(){ nextTodo(id); };
  }
  // Straight on to the next one. Triage is a queue, and stopping to find your
  // place again after every decision is most of the work.
  function nextTodo(after){
    var b = triageBuckets();
    var q = document.getElementById('q').value.trim().toLowerCase();
    var list = b.todo.filter(function(c){
      return !q || ((c.name||'')+' '+(c.park||'')+' '+(c.manu||'')+' '+(c.model||''))
        .toLowerCase().indexOf(q)>=0; });
    if(!list.length){
      state.sel = null; renderTriage();
      document.getElementById('editor').innerHTML =
        '<div class="empty">Nothing left to look at.</div>';
      return;
    }
    var at = -1;
    for(var i=0;i<list.length;i++) if(list[i].id===after){ at=i; break; }
    showTriage(list[Math.min(at+1, list.length-1)].id);
  }

  // ---------- models ----------
  // `model` is free text typed into /add and /edit, so one layout ends up under
  // three names — "SLC", "Suspended Looping Coaster", "Vekoma SLC". That reads
  // badly on the shared list and it makes a category far harder to assemble
  // than it should be, because the obvious filter does not gather the obvious
  // thing.
  //
  // There are two ways to fix that and the pane needs both. RENAMING takes
  // every ride carrying a name at once, which is right when the name itself is
  // the mistake. MOVING takes the ones you tick, which is right for everything
  // else: the three Boomerangs somebody typed as "Vekoma Boomerang" while the
  // other ten say "Boomerang", and the 545 rides carrying no model at all,
  // which can only ever be sorted a handful at a time.

  // The no-model bucket is a model row like any other. It is also the biggest
  // group in the database, so leaving it as a footnote on the count line left
  // the largest piece of this job invisible.
  var NOMODEL = "\u0000nomodel";        // never rendered, never put in an attribute
  function modelLabel(k){ return k===NOMODEL ? "No model yet" : k; }
  function byRide(a, b){
    return (a.name||"").localeCompare(b.name||"", undefined, { sensitivity:"base" })
        || (a.park||"").localeCompare(b.park||"", undefined, { sensitivity:"base" });
  }
  function carriers(k){
    return state.coasters.filter(function(c){
      var m = (c.model||"").trim();
      return k===NOMODEL ? !m : m===k;
    }).sort(byRide);
  }
  async function loadModels(){
    // The categories and what triage has set aside come with it: every ride
    // listed in this pane says where it already sits, and a model tidied blind
    // to that is how a model ends up disagreeing with the categories built on
    // top of it. loadTriage fetches both.
    if (!state.triageLoaded) { try { await loadTriage(); } catch(e){} }
    try {
      var d = await api("GET","/api/admin/models");
      state.models = d.models || []; state.blankModels = d.blank || 0;
    } catch(e){ state.models = []; state.blankModels = 0; state.cloneErr = e.message; }
    render();
  }
  function renderModels(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var openOnly = document.getElementById('openOnly').checked;
    // Nothing has arrived yet. Saying "no model matches that" here is an
    // answer, and the wrong one — the pane waits on the categories as well as
    // the models now, so the gap is two round trips wide.
    if (!state.models.length && !state.blankModels && !state.cloneErr){
      document.getElementById('count').textContent = "";
      document.getElementById('list').innerHTML =
        '<div class="row"><div class="pk">Loading\u2026</div></div>';
      return;
    }
    var rows = state.models.map(function(m){
      return { model:m.model, n:m.n, gone:m.gone||0, makers:m.makers||1, manu:m.manu };
    });
    if (state.blankModels){
      var blanks = carriers(NOMODEL);
      rows.unshift({ model:NOMODEL, n:blanks.length, makers:0,
                     gone:blanks.filter(function(c){ return !!c.closed; }).length });
    }
    // "Still operating" is the question this pane actually asks of a model: a
    // name carried only by rides that have all been torn down is history, and
    // not something to file the next new coaster under.
    var shown = rows.filter(function(m){
      if (openOnly && m.n - m.gone <= 0) return false;
      return !q || modelLabel(m.model).toLowerCase().indexOf(q) >= 0;
    }).sort(function(a, b){
      // Alphabetical (Carter, 2026-09-20). Ordered by count, the twelve-strong
      // families actually worth curating sat below forty kiddie coasters, and
      // there is no looking a name up in a list ordered by size. The no-model
      // bucket stays pinned at the top: it is not a model, it is the queue.
      if (a.model===NOMODEL) return -1;
      if (b.model===NOMODEL) return 1;
      return modelLabel(a.model).localeCompare(modelLabel(b.model),
        undefined, { sensitivity:"base" });
    });
    // The rows are addressed by INDEX, not by name: a model is free text and
    // could be anything, including something that does not survive a round trip
    // through an HTML attribute.
    state.modelRows = shown;
    var live = rows.filter(function(m){ return m.model!==NOMODEL && m.n - m.gone > 0; }).length;
    document.getElementById('count').textContent =
      shown.length + " model" + (shown.length===1?"":"s") + " shown · "
      + live + " still operating"
      + (state.blankModels ? " · " + state.blankModels + " rides with none" : "");
    document.getElementById('list').innerHTML = shown.length
      ? shown.map(function(m, i){
          var open = m.n - m.gone;
          return '<div class="row'+(state.selModel===m.model?' sel':'')+'" data-mi="'+i+'">'
            + '<div class="nm">'+esc(modelLabel(m.model))
            + (m.model===NOMODEL ? ' <span class="badge partial">nothing filed</span>'
               : open ? '' : ' <span class="badge gone">all defunct</span>')
            + '</div>'
            + '<div class="pk">'+m.n+' ride'+(m.n===1?'':'s')
            + (m.gone ? ' · '+open+' operating · '+m.gone+' defunct' : '')
            + (m.makers>1 ? ' · '+m.makers+' makers' : (m.manu?' · '+esc(m.manu):''))
            + '</div></div>'; }).join('')
      : '<div class="row"><div class="pk">No model matches that.</div></div>';
    document.getElementById('list').querySelectorAll('[data-mi]').forEach(function(r){
      r.onclick = function(){ showModel(state.modelRows[+r.getAttribute('data-mi')].model); }; });
  }
  function modelDatalist(){
    return '<datalist id="dl_models">'
      + state.opts.model.map(function(x){ return '<option value="'+esc(x)+'">'; }).join('')
      + '</datalist>';
  }
  function showModel(name){
    var list = carriers(name);
    if (!list.length){                      // every ride moved off it a second ago
      state.selModel = ""; renderModels();
      document.getElementById('editor').innerHTML =
        '<div class="empty">Nothing carries that model any more.</div>';
      return;
    }
    var blank = name===NOMODEL;
    state.selModel = name; renderModels();
    var own = inCat();
    var gone = list.filter(function(c){ return !!c.closed; }).length;
    var makers = {}; list.forEach(function(c){ if(c.manu) makers[c.manu]=1; });
    var nmakers = Object.keys(makers).length;
    var picked = {};

    document.getElementById('editor').innerHTML =
      '<h2 style="margin:0 0 4px;font-size:1.15rem">'+esc(modelLabel(name))+'</h2>'
      + '<p class="hint">'+list.length+' ride'+(list.length===1?'':'s')
        + ' · '+(list.length-gone)+' still operating'+(gone?' · '+gone+' defunct':'')
        + (nmakers>1 ? ' · from '+nmakers+' different makers' : '')+'.</p>'
      + (blank
          ? '<p class="hint">These carry no model at all. Give a few of them one below and '
            + 'they join the list on the left — this is where that list grows.</p>'
          : '<div class="grid"><div class="fld full"><label>Rename all '+list.length
            + ' — a name that already exists merges the two</label>'
            + '<input id="mdlto" value="'+esc(name)+'" list="dl_models"></div></div>'
            + '<div class="actions"><button id="mdlsave">Rename</button>'
            + '<span class="toast" id="mdltoast"></span></div>')
      + '<div class="toolbar"><h3>Rides carrying it</h3>'
      + '<p class="hint">Tick the ones that belong under a different name and move them. '
        + 'A rename above takes all '+list.length+'; this takes only what you tick.</p>'
      + '<div class="inline"><input id="mdlq" placeholder="Filter these rides…" style="flex:1">'
        + '<button class="ghost" id="mdlall">Tick these</button>'
        + '<button class="ghost" id="mdlnone">Clear</button></div>'
      + '<div class="pane" id="mdlrides"></div>'
      + '<div class="inline" style="margin-top:10px">'
        + '<input id="mdlmove" list="dl_models" placeholder="Move the ticked rides to…" style="flex:1">'
        + '<button id="mdlmv">Move</button></div>'
      + '<p class="hint" id="mvhint">Leaving the box empty takes the model off them entirely.</p>'
      + '<span class="toast" id="mvtoast"></span></div>'
      + splitBox(name, list)
      + modelDatalist();

    // One row per ride, and it says what a move would be walking past: the
    // maker (two makers under one model is usually two models), whether it is
    // still standing, and which category already holds it.
    function rideRow(c){
      var g = own[c.id];
      var tail = (c.manu ? ' · ' + esc(c.manu) : '')
        + (g ? ' · in ' + esc(g.name)
             : state.skipped[c.id] ? ' · set aside' : '');
      return '<label class="cbrow tick">'
        + '<input type="checkbox" data-rd="'+c.id+'"'+(picked[c.id]?' checked':'')+'>'
        + '<span>'+esc(c.name)+'<span class="sub"> — '+esc(c.park||'?')+tail+'</span>'
        + (c.closed ? ' <span class="badge gone">defunct</span>' : '')+'</span></label>';
    }
    function shownRides(){
      var f = (document.getElementById('mdlq').value||'').trim().toLowerCase();
      return !f ? list : list.filter(function(c){
        return ((c.name||'')+' '+(c.park||'')+' '+(c.manu||''))
          .toLowerCase().indexOf(f) >= 0; });
    }
    function ticked(){
      return Object.keys(picked).filter(function(k){ return picked[k]; }).map(Number);
    }
    // The button carries the count, so what is about to move is readable
    // without scrolling back up through 545 rides to count ticks.
    function countPicked(){
      var n = ticked().length;
      document.getElementById('mdlmv').textContent = n ? 'Move '+n : 'Move';
    }
    function redrawRides(){
      var rs = shownRides(), el = document.getElementById('mdlrides');
      el.innerHTML = (rs.length > 300
          ? '<p class="hint">'+rs.length+' rides — the first 300 are listed. '
            + 'Filter to narrow it.</p>' : '')
        + (rs.length ? rs.slice(0,300).map(rideRow).join('')
                     : '<p class="hint">Nothing here matches that filter.</p>');
      el.querySelectorAll('[data-rd]').forEach(function(b){
        // Redrawing on every tick would pull the next row out from under the
        // tap; only the count moves. Same reason the category picker leaves a
        // ticked row where it is.
        b.onchange = function(){ picked[+b.getAttribute('data-rd')] = b.checked; countPicked(); };
      });
      countPicked();
    }
    redrawRides();
    document.getElementById('mdlq').addEventListener('input', redrawRides);
    // "Tick these" means what is on screen, filter and all — filter to Vekoma,
    // tick them, move them is the whole workflow this pane exists for.
    document.getElementById('mdlall').onclick = function(){
      shownRides().slice(0,300).forEach(function(c){ picked[c.id]=1; }); redrawRides(); };
    document.getElementById('mdlnone').onclick = function(){
      picked = {}; redrawRides(); };

    document.getElementById('mdlmv').onclick = async function(){
      var ids = ticked(), to = document.getElementById('mdlmove').value.trim();
      var t = document.getElementById('mvtoast');
      t.className = 'toast';
      if (!ids.length){ t.textContent = 'Tick the rides to move first.'; return; }
      if (!to && !confirm(ids.length + (ids.length===1?' ride':' rides')
            + ' will be left with no model at all. Sure?')) return;
      t.textContent = 'Saving…';
      try {
        var out = await api("POST","/api/admin/models/assign",
          { ids:ids, model:to, clear: !to });
        // The page's own copy of the list is now wrong in `ids` places. Patch it
        // rather than re-fetching 1,114 rows for a string swap — the same call
        // the rename below makes.
        ids.forEach(function(id){ var c = state.byId[id]; if(c) c.model = to || null; });
        state.opts = { manu:distinct("manu"), model:distinct("model") };
        await loadModels();
        // Stay where you were if there is anything left to sort; follow the
        // rides if the source model is now empty.
        var stay = carriers(name).length ? name : (to || NOMODEL);
        showModel(stay);
        var t2 = document.getElementById('mvtoast');
        if (t2){
          t2.className = 'toast ' + (out.moved ? 'good' : '');
          t2.textContent = !out.moved
            ? 'Nothing to do — they already carry that model.'
            : (out.model
                ? 'Moved ' + out.moved + ' to ' + out.model
                  + (out.created ? ' — a new model' : ' — ' + out.total + ' carry it now')
                : 'Took the model off ' + out.moved + '.');
        }
      } catch(e){ t.className='toast bad'; t.textContent = e.message; }
    };

    if (!blank) document.getElementById('mdlsave').onclick = async function(){
      var to = document.getElementById('mdlto').value.trim();
      var t = document.getElementById('mdltoast');
      if(to===name){ t.textContent='That is the name it already has.'; return; }
      t.textContent='Saving…';
      try {
        var out = await api("POST","/api/admin/models/rename",{ from:name, to:to });
        state.coasters.forEach(function(c){ if((c.model||'')===name) c.model = to; });
        state.opts = { manu:distinct("manu"), model:distinct("model") };
        state.selModel = to;
        await loadModels();
        showModel(to);
        var t2 = document.getElementById('mdltoast');
        if(t2){ t2.className='toast good';
          t2.textContent = out.merged
            ? 'Merged — '+out.moved+' moved, '+out.total+' carry it now'
            : 'Renamed — '+out.moved+' updated'; }
      } catch(e){ t.className='toast bad'; t.textContent = e.message; }
    };

    if (document.getElementById('mdlsplit')) document.getElementById('mdlsplit').onclick = async function(){
      var groups = makerGroups(list), t = document.getElementById('sptoast');
      t.className = 'toast';
      var moves = [];
      document.getElementById('editor').querySelectorAll('[data-sg]').forEach(function(inp){
        var g = groups[+inp.getAttribute('data-sg')], to = inp.value.trim();
        // `model`, not `to` — the endpoint reads `model`, and an unrecognised
        // field used to read as "take the model off these", which is a silent
        // 13-ride wipe rather than a split. It refuses that now; this sends the
        // name it means.
        if (to && to !== name) moves.push({ model:to, ids:g.rides.map(function(c){ return c.id; }) });
      });
      if (!moves.length){
        t.textContent = 'Every box still says '+name+' \u2014 nothing to split.'; return; }
      t.textContent = 'Saving\u2026';
      try {
        var told = [];
        // One call per maker: the endpoint moves a list of rides onto ONE
        // model, and each group is going somewhere different.
        for (var i=0;i<moves.length;i++){
          var out = await api("POST","/api/admin/models/assign", moves[i]);
          moves[i].ids.forEach(function(id){
            var c2 = state.byId[id]; if(c2) c2.model = moves[i].model; });
          told.push(out.moved + ' \u2192 ' + moves[i].model);
        }
        state.opts = { manu:distinct("manu"), model:distinct("model") };
        await loadModels();
        // Whatever stayed behind keeps the name; if every maker moved, follow
        // the biggest group rather than landing on an empty pane.
        var kept = carriers(name).length;
        showModel(kept ? name : moves[0].model);
        var t2 = document.getElementById('sptoast');
        if (t2){ t2.className='toast good';
          t2.textContent = 'Split \u2014 ' + told.join(', ')
            + (kept ? ', '+kept+' left as '+name : ''); }
      } catch(e){ t.className='toast bad'; t.textContent = e.message; }
    };
  }

  // How a model sits against the categories, which is the question triage
  // keeps asking one ride at a time: twelve SLCs, nine of them already in a
  // category, is most of the answer for the other three. Computed from what
  // the page already holds — the coaster list, the categories, and what triage
  // has set aside — so it costs a pass over 1,114 rows and no request.
  function modelSplit(){
    var own = inCat(), by = {};
    state.coasters.forEach(function(c){
      var k = (c.model||'').trim() || NOMODEL;
      var e = by[k] || (by[k] = { model:k, rides:[], cats:{}, filed:[], loose:[], aside:[] });
      e.rides.push(c);
      var g = own[c.id];
      if (g){ e.filed.push(c); e.cats[g.id] = g.name; }
      else if (state.skipped[c.id]) e.aside.push(c);
      else e.loose.push(c);
    });
    Object.keys(by).forEach(function(k){
      var e = by[k];
      e.cat = Object.keys(e.cats).map(function(i){ return e.cats[i]; }).sort();
    });
    return by;
  }


  // The abbreviations the database's own model names already use \u2014 "B&M
  // Invert", "PTC", "GCI", "RMC Hybrid" \u2014 so splitting Looper by maker
  // offers "Arrow Looper" rather than "Arrow Dynamics Looper". Only the makers
  // with a settled short form are in here; everybody else gets their name as
  // typed, and either way the box is editable before anything moves.
  var MAKER_SHORT = {
    "Arrow Dynamics":"Arrow", "Bolliger & Mabillard":"B&M",
    "Philadelphia Toboggan Coasters":"PTC", "Great Coasters International":"GCI",
    "Custom Coasters International":"CCI", "Rocky Mountain Construction":"RMC",
    "MACK Rides":"Mack", "Maurer Rides":"Maurer", "Premier Rides":"Premier",
    "S&S Worldwide":"S&S", "Chance Rides":"Chance", "Wisdom Rides":"Wisdom",
    "Dinn Corporation":"Dinn", "ART Engineering":"ART"
  };
  function shortMaker(m){ return MAKER_SHORT[m] || m; }
  function makerGroups(list){
    var by = {};
    list.forEach(function(c){
      var k = (c.manu||'').trim() || NOMAKER;
      (by[k] = by[k] || []).push(c);
    });
    return Object.keys(by).map(function(k){ return { maker:k, rides:by[k] }; })
      .sort(function(a, b){ return b.rides.length - a.rides.length
        || makerLabel(a.maker).localeCompare(makerLabel(b.maker)); });
  }
  // One model built by several makers is usually several models. "Looper" is 21
  // rides and six makers: Arrow built thirteen of them and Vekoma four, and
  // those are not the same ride in any sense a category cares about. (Carter,
  // 2026-09-20: "I have Looper and I want to break it into Arrow Looper Vekoma
  // Looper maybe just a plain Looper based on manufacturer".)
  //
  // Prefilled, never applied on sight: one box per maker starting at "<Maker>
  // <Model>", and a box left at the model\u2019s own name keeps that maker
  // exactly where it is \u2014 which is how one group stays plain "Looper".
  function splitBox(name, list){
    if (name===NOMODEL) return '';
    var groups = makerGroups(list);
    if (groups.length < 2) return '';
    return '<div class="toolbar"><h3>Split it by maker</h3>'
      + '<p class="hint">'+list.length+' rides carry this model and '+groups.length
        + ' different makers built them, which usually means it is more than one '
        + 'model. Leave a box as it is to keep that maker on '+esc(name)+'.</p>'
      + '<div class="grid">'
      + groups.map(function(g, i){
          // No stutter: a model that already opens with the maker\u2019s name is
          // the name this would propose, so it proposes nothing.
          var suggest = g.maker===NOMAKER ? name
            : (name.toLowerCase().indexOf(shortMaker(g.maker).toLowerCase())===0
                ? name : shortMaker(g.maker)+' '+name);
          return '<div class="fld full"><label>'+esc(makerLabel(g.maker))+' \u2014 '
            + g.rides.length+' ride'+(g.rides.length===1?'':'s')+'</label>'
            + '<input data-sg="'+i+'" list="dl_models" value="'+esc(suggest)+'"></div>'; }).join('')
      + '</div>'
      + '<div class="actions"><button id="mdlsplit">Split</button>'
      + '<span class="toast" id="sptoast"></span></div></div>';
  }

  // ---------- the models queue ----------
  // The same pane as the category queue, asking the other question. A coaster
  // is in exactly one of three states and only two of them are written down:
  // `coasters.model` says which HAVE one, `model_skipped` says which were
  // looked at and have none to give, and what is in neither is the queue. 545
  // rides carry no model, so this is the longest queue in the editor — and the
  // one everything else here depends on, because a model nobody typed cannot
  // group anything.
  //
  // Grouped by PARK, which is what the data asked for. Grouping by maker was
  // the obvious mirror of the category queue's group-by-model, and it groups
  // nothing: 544 of the 545 rides carrying no model carry no MAKER either.
  // They are the rows nobody has ever filled in, not rows missing one field.
  // A park is the unit they get looked up in, and one lookup answers five of
  // them, so the park with the most still to do is the best next half hour.
  async function loadMTriage(){
    if (!state.clones.length) { try { await loadClones(); } catch(e){} }
    try {
      var d = await api("GET","/api/admin/models/skipped");
      state.mskipped = {}; (d.ids||[]).forEach(function(i){ state.mskipped[i]=1; });
      state.mtriageNeed = d.need || ""; state.mtriageLoaded = true;
    } catch(e){ state.mskipped = {}; state.mtriageNeed = ""; state.cloneErr = e.message; }
    render();
  }
  function hasModel(c){ return !!(c.model||"").trim(); }
  function mtriageBuckets(){
    var todo = [], done = [], aside = [];
    state.coasters.forEach(function(c){
      if (hasModel(c)) done.push(c);
      else if (state.mskipped[c.id]) aside.push(c);
      else todo.push(c);
    });
    return { todo:todo, done:done, aside:aside };
  }
  var NOMAKER = "\u0000nomaker";
  function makerLabel(k){ return k===NOMAKER ? "No maker either" : k; }
  // How far a maker's catalogue has been filled in. The same fraction the
  // category queue puts on a model, asked of the other column.
  function makerSplit(){
    var by = {};
    state.coasters.forEach(function(c){
      var k = (c.manu||'').trim() || NOMAKER;
      var e = by[k] || (by[k] = { maker:k, rides:[], filed:[], loose:[], aside:[], models:{} });
      e.rides.push(c);
      if (hasModel(c)){ e.filed.push(c); e.models[c.model.trim()] = (e.models[c.model.trim()]||0)+1; }
      else if (state.mskipped[c.id]) e.aside.push(c);
      else e.loose.push(c);
    });
    Object.keys(by).forEach(function(k){
      var e = by[k];
      // Its models, commonest first: on the queue's own pane these are the
      // buttons, and the one it builds most of is nearly always the answer.
      e.model = Object.keys(e.models).map(function(m){ return { model:m, n:e.models[m] }; })
        .sort(function(a,b){ return b.n - a.n || a.model.localeCompare(b.model); });
    });
    return by;
  }
  function mtriageRow(c){
    return '<div class="row'+(state.sel===c.id?' sel':'')+'" data-mtri="'+c.id+'">'
      + '<div class="nm">'+esc(c.name)+'</div>'
      + '<div class="pk">'+esc(c.park||'—')
      + (c.manu?' · '+esc(c.manu):'')
      + (c.model?' · '+esc(c.model):'')+'</div></div>';
  }
  var NOPARK = "\u0000nopark";
  function parkLabel(k){ return k===NOPARK ? "No park recorded" : k; }
  // How much of a park is filled in \u2014 the same fraction the category queue
  // puts on a model, asked of the unit you actually look rides up in.
  function parkSplit(){
    var by = {};
    state.coasters.forEach(function(c){
      var k = (c.park||'').trim() || NOPARK;
      var e = by[k] || (by[k] = { park:k, rides:[], filed:[], loose:[], aside:[] });
      e.rides.push(c);
      if (hasModel(c)) e.filed.push(c);
      else if (state.mskipped[c.id]) e.aside.push(c);
      else e.loose.push(c);
    });
    return by;
  }
  function mtriageGrouped(rows){
    var split = parkSplit(), by = {};
    rows.forEach(function(c){
      var k = (c.park||'').trim() || NOPARK;
      (by[k] = by[k] || []).push(c);
    });
    var keys = Object.keys(by).sort(function(x, y){
      // The park with the most still to do first: a park is looked up once and
      // answers all of them, so the order is what one lookup is worth.
      if (x===NOPARK) return 1;
      if (y===NOPARK) return -1;
      return by[y].length - by[x].length || parkLabel(x).localeCompare(parkLabel(y));
    });
    var left = 400, out = [];
    keys.forEach(function(k){
      if (left <= 0) return;
      var e = split[k], mine = by[k].slice(0, left);
      left -= mine.length;
      out.push('<div class="row sec"><div class="nm">'+esc(parkLabel(k))
        + ' <span class="badge '
        + (e.filed.length===e.rides.length ? 'settled' : e.filed.length ? 'partial' : 'gone')
        + '">'+e.filed.length+'/'+e.rides.length+'</span></div>'
        + '<div class="pk">'+mine.length+' here \u00b7 '
        + (e.filed.length ? e.filed.length+' of its '+e.rides.length+' rides already '
             + (e.filed.length===1?'carries':'carry')+' one'
           : 'none of its rides carry a model yet')
        + (e.aside.length ? ' \u00b7 '+e.aside.length+' set aside' : '')
        + '</div></div>'
        + mine.map(mtriageRow).join(''));
    });
    var shown = 400 - left;
    if (shown < rows.length) out.push('<div class="row"><div class="pk">… and '
      + (rows.length - shown) + ' more. Search to narrow it.</div></div>');
    return out.join('');
  }
  function renderMTriage(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var b = mtriageBuckets();
    var pick = b[state.mtriageFilter==='done' ? 'done' : state.mtriageFilter==='aside' ? 'aside' : 'todo'];
    var rows = pick.filter(function(c){
      return !q || ((c.name||'')+' '+(c.park||'')+' '+(c.manu||'')+' '+(c.model||''))
        .toLowerCase().indexOf(q)>=0; });
    var grouped = document.getElementById('byGroup').checked;

    document.getElementById('count').textContent =
      b.todo.length + " to look at · " + b.done.length + " with a model · "
      + b.aside.length + " set aside";

    document.getElementById('list').innerHTML =
      (state.mtriageNeed ? '<div class="row"><div class="nm">Set aside is not stored yet</div>'
        + '<div class="pk">run migrations/'+esc(state.mtriageNeed)+' — until then every '
        + 'coaster without a model shows as still to look at</div></div>' : '')
      + '<div class="row live"><div class="nm">'
        + (state.mtriageFilter==='done' ? 'Has a model'
           : state.mtriageFilter==='aside' ? 'Set aside' : 'No model yet')
        + '</div><div class="pk">'+rows.length+' of '+pick.length
        + ' · switch with the buttons on the right'
        + (grouped ? ' · grouped by park' : '')+'</div></div>'
      + (rows.length
          ? (grouped ? mtriageGrouped(rows)
             : rows.slice(0,400).map(mtriageRow).join('')
               + (rows.length>400 ? '<div class="row"><div class="pk">… and '+(rows.length-400)
                   + ' more. Search to narrow it.</div></div>' : ''))
          : '<div class="row"><div class="pk">Nothing here.</div></div>');
    document.getElementById('list').querySelectorAll('[data-mtri]').forEach(function(r){
      r.onclick = function(){ showMTriage(+r.getAttribute('data-mtri')); }; });
  }
  function showMTriage(id){
    var c = state.byId[id]; if(!c) return;
    state.sel = id; renderMTriage();
    var aside = !!state.mskipped[id];

    // The real editor, with the queue's two buttons above it. There is no
    // second form here any more: these rides are missing their maker and their
    // numbers as often as their model, and a pane that only took a model was a
    // worse version of the page next door.
    coasterEditor(id,
      '<div class="actions" style="margin:0 0 14px">'
      + '<button class="ghost" id="mtaside">'+(aside?'Back to the queue':'Set aside')+'</button>'
      + '<button class="ghost" id="mtnext">Next in the queue</button>'
      + '<span class="toast" id="mttoast">'
        + (aside ? 'Set aside \u2014 looked at, and there is no model to give it.'
           : hasModel(c) ? 'Has a model. Saving takes it out of the queue.'
           : 'No model yet.')
      + '</span></div>');

    // What this ride can be answered from, under the editor and read-only: the
    // rest of its park, which is one lookup for all of them, and anything of
    // the same name elsewhere, which is usually the same ride and therefore the
    // same model.
    var here = state.coasters.filter(function(x){
      return x.id!==id && (c.park||'') && (x.park||'')===(c.park||''); }).sort(byRide);
    var same = !c.name ? [] : state.coasters.filter(function(x){
      return x.id!==id && hasModel(x)
        && String(x.name||'').trim().toLowerCase() === String(c.name).trim().toLowerCase();
    }).sort(byRide);
    function listOf(rides){
      return '<div class="pane">' + rides.slice(0,20).map(function(x){
          return '<div class="tick">'+esc(x.name)
            + '<span class="sub"> \u2014 '+(x.model ? esc(x.model) : 'no model yet')
            + (x.manu?' \u00b7 '+esc(x.manu):'')
            + (x.park!==c.park?' \u00b7 '+esc(x.park||'?'):'')+'</span></div>'; }).join('')
        + (rides.length>20 ? '<p class="hint">\u2026 and '+(rides.length-20)+' more.</p>' : '')
        + '</div>';
    }
    var hints = '';
    if (here.length){
      hints += '<div class="toolbar"><h3>The rest of '+esc(c.park||'this park')+'</h3>'
        + '<p class="hint">'+here.filter(hasModel).length+' of its other '+here.length
          + ' ride'+(here.length===1?'':'s')+' carr'+(here.length===1?'ies':'y')+' a model. '
          + 'Looking the park up once answers all of them.</p>'
        + listOf(here) + '</div>';
    }
    if (same.length){
      hints += '<div class="toolbar"><h3>The same name elsewhere</h3>'
        + '<p class="hint">Almost always the same ride, and the same ride is the same '
          + 'model. Check the maker matches before copying it.</p>'
        + listOf(same) + '</div>';
    }
    // Above Merge and Delete, not below them: this is what you read while
    // filling the fields in, and those two are the rarest things on the page.
    if (hints) {
      var ed = document.getElementById('editor'), first = ed.querySelector('.toolbar');
      if (first) first.insertAdjacentHTML('beforebegin', hints);
      else ed.insertAdjacentHTML('beforeend', hints);
      ed.scrollTop = 0;
    }

    document.getElementById('mtaside').onclick = async function(){
      var t = document.getElementById('mttoast'); t.className='toast';
      t.textContent='Saving\u2026';
      try {
        await api("POST","/api/admin/models/skipped",{ ids:[id], on:!aside });
        if (aside) delete state.mskipped[id]; else state.mskipped[id] = 1;
        if (!aside) nextMTodo(id); else showMTriage(id);
      } catch(e){ t.className='toast bad'; t.textContent = e.message; }
    };
    document.getElementById('mtnext').onclick = function(){ nextMTodo(id); };
  }
  // Straight on to the next one, the same way the category queue does it:
  // stopping to find your place again after every decision is most of the work.
  function nextMTodo(after){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var list = mtriageBuckets().todo.filter(function(c){
      return !q || ((c.name||'')+' '+(c.park||'')+' '+(c.manu||''))
        .toLowerCase().indexOf(q)>=0; });
    if(!list.length){
      state.sel = null; renderMTriage();
      document.getElementById('editor').innerHTML =
        '<div class="empty">Nothing left without a model.</div>';
      return;
    }
    var at = -1;
    for(var i=0;i<list.length;i++) if(list[i].id===after){ at=i; break; }
    showMTriage(list[Math.min(at+1, list.length-1)].id);
  }

  function cname(id){
    var c = state.coasters.find(function(x){ return x.id===id; });
    return c ? (c.name + " \u2014 " + (c.park||"?")) : ("#" + id);
  }
  function byName(a, b){
    var x = state.byId[a] || {}, y = state.byId[b] || {};
    return (x.name||"").localeCompare(y.name||"", undefined, { sensitivity:"base" })
        || (x.park||"").localeCompare(y.park||"", undefined, { sensitivity:"base" });
  }
  function renderClones(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var groups = state.clones.filter(function(g){ return !q || g.name.toLowerCase().indexOf(q)>=0; });
    var sug = state.suggest.filter(function(g){ return !q || g.name.toLowerCase().indexOf(q)>=0; });
    document.getElementById('count').textContent =
      groups.length + " categor" + (groups.length===1?"y":"ies") + " \u00b7 " + sug.length + " suggested";
    document.getElementById('list').innerHTML =
      (state.cloneErr ? '<div class="row"><b>' + esc(state.cloneErr) + '</b></div>' : '')
      + '<div class="row live"><div class="nm">Live on the site</div>'
        + '<div class="pk">' + (groups.length
            ? 'every rider is offered these'
            : 'nothing yet \u2014 take one from the suggestions below') + '</div></div>'
      + groups.map(function(g){
          return '<div class="row' + (state.selClone === g.id ? ' sel' : '') + '" data-cg="'+g.id+'">'
            + '<div class="nm">'+esc(g.name)+'</div>'
            + '<div class="pk">' + (g.note ? esc(g.note) + ' \u00b7 ' : '')
            + g.ids.length + ' rides</div></div>'; }).join('')
      + (state.riderCats.length ? '<div class="row sec"><div class="nm">Riders\u2019 own</div>'
          + '<div class="pk">read only \u2014 two riders writing the same one is the '
          + 'case for making it a Coaster Hub category</div></div>'
          + state.riderCats.map(function(c){
              return '<div class="row"><div class="nm">'+esc(c.name)
                + (c.riders > 1 ? ' <span class="sub">\u00d7'+c.riders+' riders</span>' : '')
                + '</div><div class="pk">'+esc(c.who)+' \u00b7 '+c.n+' rides'
                + (c.note ? ' \u00b7 '+esc(c.note) : '')+'</div></div>'; }).join('')
        : '')
      + (sug.length ? '<div class="row sec"><div class="nm">Suggested \u00b7 not live</div>'
          + '<div class="pk">rides sharing a name AND a model \u2014 not yet answered</div></div>'
          + sug.map(function(g,i){
          return '<div class="row" data-sg="'+i+'">'
            + '<div class="nm">'+esc(g.name)+'</div>'
            + '<div class="pk">'+esc(g.note)+' \u00b7 '+g.members.length+' rides</div></div>'; }).join('')
        : '');
    document.getElementById('list').querySelectorAll('[data-cg]').forEach(function(r){
      r.onclick = function(){ showGroup(+r.getAttribute('data-cg')); }; });
    document.getElementById('list').querySelectorAll('[data-sg]').forEach(function(r){
      r.onclick = function(){ showSuggestion(+r.getAttribute('data-sg')); }; });
  }
  function showSuggestion(i){
    var g = state.suggest[i]; if (!g) return;
    document.getElementById('editor').innerHTML =
      '<h2 style="margin:0 0 4px;font-size:1.15rem">'+esc(g.name)+'</h2>'
      + '<p class="hint">'+esc(g.note)+' \u2014 '+g.members.length+' coasters share this name and model. '
      + 'Accept and this becomes a Coaster Hub category: everybody is offered it, and '
      + 'anyone who takes it gets these rides as one row.</p>'
      + '<div class="grid" style="margin:10px 0">' + g.members.map(function(m){
          return '<div class="fld full"><label>'+esc(cname(m.id))+'</label></div>'; }).join('') + '</div>'
      + '<div class="actions"><button id="acc">Accept as a category</button>'
      + '<span class="toast" id="ctoast"></span></div>';
    document.getElementById('acc').onclick = async function(){
      try {
        var made = await api("POST","/api/clones",
          { name:g.name, note:g.note, ids:g.members.map(function(m){return m.id;}) });
        await loadClones();
        showGroup(made.id);
        var t = document.getElementById('ctoast');
        if (t) { t.textContent = "Live \u2014 every rider is offered it now"; }
      } catch(e){ document.getElementById('ctoast').textContent = e.message; }
    };
  }
  function showGroup(id){
    var made = !id;
    var g = made ? { id:0, name:"", note:"", ids:[] }
                 : state.clones.find(function(x){ return x.id===id; });
    if (!g) return;
    state.selClone = g.id; renderClones();
    document.getElementById('editor').innerHTML =
      '<h2 style="margin:0 0 10px;font-size:1.15rem">'
        + (made ? 'New category' : esc(g.name)) + '</h2>'
      + (made ? '<p class="hint">Name it, then search below for the rides that belong in it. '
        + 'Two or more, and none of them already in another category.</p>' : '')
      + '<div class="grid">'
      + '<div class="fld full"><label>Name \u2014 what the collapsed row says</label>'
      + '<input id="cgname" value="'+esc(g.name)+'"></div>'
      + '<div class="fld full"><label>Note \u2014 why they are one, e.g. "B&amp;M Invert"</label>'
      + '<input id="cgnote" value="'+esc(g.note||'')+'"></div></div>'
      + (made ? '' : '<p class="hint">Members. Untick to drop one; search below to add another.</p>')
      + '<div class="grid" id="cgmem"></div>'
      + '<div class="inline"><input id="cgadd" placeholder="Add a coaster by name\u2026" style="flex:1">'
      + '<select id="cgmanu" style="max-width:180px"><option value="">Any maker</option>'
      + state.opts.manu.map(function(o){ return '<option>'+esc(o)+'</option>'; }).join('')
      + '</select>'
      + '<select id="cgmodel" style="max-width:200px"><option value="">Any model</option>'
      + state.opts.model.map(function(o){ return '<option>'+esc(o)+'</option>'; }).join('')
      + '</select></div>'
      + '<div class="grid" id="cghits"></div>'
      + '<div id="cgsug"></div>'
      + '<div class="actions"><button id="cgsave">Save category</button>'
      + (made ? '' : '<button class="danger" id="cgdel">Delete category</button>')
      + '<span class="toast" id="ctoast"></span></div>';
    // Everything in the category right now — saved or ticked a second ago.
    // `added` is only used to mark the new ones, never to decide what is saved.
    var members = g.ids.slice(), added = {};

    // Which OTHER category owns a coaster. Shown rather than hidden: the API
    // refuses it on save anyway, and "already in Batman: The Ride" answers the
    // question, where a ride that silently never appears in search does not.
    var owner = {};
    state.clones.forEach(function(c){
      if (c.id === g.id) return;
      c.ids.forEach(function(cid){ owner[cid] = c.name; });
    });

    function redrawMembers(){
      document.getElementById('cgmem').innerHTML =
        members.slice().sort(byName).map(function(cid){
          return '<div class="fld full"><label class="cbrow">'
            + '<input type="checkbox" data-mem="'+cid+'" checked> '+esc(cname(cid))
            + (added[cid] ? ' <span class="sub">\u00b7 new</span>' : '')
            + '</label></div>'; }).join('')
        || '<div class="fld full"><span class="hint">Nothing in it yet. '
           + 'Search below.</span></div>';
      document.getElementById('cgmem').querySelectorAll('[data-mem]').forEach(function(b){
        b.onchange = function(){
          if (b.checked) return;                  // unticking is "drop on save"
          var cid = +b.getAttribute('data-mem');
          members = members.filter(function(x){ return x !== cid; });
          delete added[cid];
          redrawMembers(); redrawHits(); redrawSug();  // and it is searchable again
        };
      });
    }

    // One row per hit, so the picker and the suggestions cannot drift apart.
    function pickRow(c, why){
      var taken = owner[c.id];
      return '<div class="fld full"><label class="cbrow">'
        + '<input type="checkbox" data-add="'+c.id+'"'+(taken?' disabled':'')+'> '
        + esc(cname(c.id))
        + (c.model ? ' <span class="sub">\u00b7 '+esc(c.model)+'</span>' : '')
        + (why ? ' <span class="sub">\u00b7 '+why+'</span>' : '')
        + (taken ? ' <span class="sub">\u00b7 already in '+esc(taken)+'</span>' : '')
        + '</label></div>';
    }

    // What this category is probably missing: coasters sharing a MODEL or a
    // NAME with something already in it. That is the same signal the suggester
    // uses, applied to a half-built category instead of the whole database —
    // put one Batman in and the other four are simply there, no search needed.
    // Offered, never applied: the answer is often "no, that one is different".
    // How well a coaster matches what is ALREADY in this category. A shared
    // MODEL is the signal worth trusting; a shared name alone is how a B&M
    // Invert, a FreeSpin and an SLC all end up called Batman: The Ride. So a
    // model match sorts above a name-only one ALWAYS, in the suggestions and in
    // the search alike — both lists are answering the same question, and
    // ordering them differently would be answering it two ways.
    //
    // Rebuilt on every call rather than cached: ticking one more member changes
    // what matches, which is most of the value.
    function affinity(){
      var models={}, names={};
      members.forEach(function(cid){ var c=state.byId[cid]; if(!c) return;
        if(c.model) models[c.model]=1;
        if(c.name) names[String(c.name).trim().toLowerCase()]=1; });
      var m = function(c){ return !!(c.model && models[c.model]); };
      var n = function(c){ return !!(c.name && names[String(c.name).trim().toLowerCase()]); };
      // Four tiers, not three: a search turns up coasters matching NEITHER, and
      // they were sorting level with the name matches — "Batman Gotham City
      // Escape", which shares nothing, came out above five Batman: The Rides.
      var rank = function(c){ return m(c) ? (n(c) ? 0 : 1) : (n(c) ? 2 : 3); };
      return { model:m, name:n, rank:rank, any:function(c){ return m(c)||n(c); },
        why:function(c){
          var r = rank(c);
          return r===0 ? 'same name and model'
               : r===1 ? 'same model'
               : r===2 ? 'same name only' : ''; } };
    }

    function redrawSug(){
      var el = document.getElementById('cgsug'); if(!el) return;
      if(!members.length){ el.innerHTML=''; return; }
      var A = affinity(), rank = A.rank, why = A.why;
      // The ranking has to happen before the slice, or twelve alphabetical name
      // matches crowd the real answers off the end of the list.
      var sug = state.coasters.filter(function(c){
        if(members.indexOf(c.id)>=0 || owner[c.id]) return false;
        return A.any(c);
      }).sort(function(a,b){ return rank(a)-rank(b) || byName(a.id,b.id); }).slice(0,12);
      el.innerHTML = sug.length
        ? '<p class="hint" style="margin-top:12px">Suggested \u2014 same model or the '
          + 'same name as something already in this category. Tick what belongs; '
          + 'ignore the rest.</p><div class="grid">'
          + sug.map(function(c){ return pickRow(c, why(c)); }).join('') + '</div>'
        : '';
      wirePick(el);
    }

    function redrawHits(){
      var q = document.getElementById('cgadd').value.trim().toLowerCase();
      var mk = document.getElementById('cgmanu'), md = document.getElementById('cgmodel');
      var manu = mk ? mk.value : '', model = md ? md.value : '';
