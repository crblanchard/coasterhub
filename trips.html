<link rel="manifest" href="/site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<script>/* theme: set before paint so the page never flashes the wrong one (see initTheme in app.js). The device's light or dark setting; on a desktop, the toggle's choice if one was made (2026-10-30). */try{var chT=matchMedia("(min-width:681px)").matches?localStorage.getItem("ch_theme"):null}catch(e){}if(chT!=="dark"&&(chT==="light"||!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)))document.documentElement.setAttribute("data-theme","light");/* In the iPhone/Android app (capacitor.config.json appendUserAgent), marked before anything renders (2026-10-31). */if(/CoasterHubApp/.test(navigator.userAgent))document.documentElement.className+=" inapp";/* The time-of-day sky (app.js CHSky), remembered from the last page, on before paint. */try{var chS=JSON.parse(localStorage.getItem("ch_sky"));if(chS&&Date.now()-chS.t<18e5){var chE=document.documentElement;chE.style.setProperty("--skyl",chS.gl);chE.style.setProperty("--skyd",chS.gd);chE.setAttribute("data-skyl",chS.l);chE.setAttribute("data-skyd",chS.d)}}catch(e){}</script>
<link rel="icon" href="/favicon.svg?v=20260924b" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=20260924b" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16.png?v=20260924b" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260924b">
<meta property="og:title" content="Coaster trips">
<meta property="og:description" content="Coaster trips saved on Coaster Hub.">
<meta property="og:image" content="https://coasterhub.org/og-image.png?v=4">
<style>
  /* /trips (Carter, 2026-11-26): every saved trip as a card, searchable, with
     the way into a new one. Its own page, off the planner's "See existing trips". */
  .trips{max-width:820px}
  .tqrow{display:flex;gap:10px;align-items:center;margin:0 0 14px}
  .tq{flex:1;min-width:0;box-sizing:border-box;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background-color:var(--panel);color:var(--fg);font:inherit;font-size:.95rem}
  .tqrow .btn{flex:none;padding:11px 16px;border-radius:12px;font-weight:700;text-decoration:none;white-space:nowrap}
  .alltrips{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
  .atrip{display:block;border:1px solid var(--line);border-radius:14px;background-color:var(--panel);padding:12px 14px;color:var(--fg);text-decoration:none}
  .atrip:hover{border-color:var(--accent2)}
  .atrip b{display:block;font-family:var(--display);font-stretch:92%;font-weight:800;font-size:1.02rem;letter-spacing:-.01em}
  .atrip .ap{display:block;color:var(--muted);font-size:.84rem;margin-top:3px;line-height:1.35}
  .atrip .aw{display:block;color:var(--muted);font-size:.78rem;margin-top:6px}
  .atrip .ae{display:block;color:var(--muted);font-size:.72rem;margin-top:4px;opacity:.85}
  .atnone{color:var(--muted);font-size:.9rem;margin:4px 0}
  @media (max-width:520px){ .tqrow{flex-direction:column;align-items:stretch} .tqrow .btn{text-align:center} }
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="/">
    <img src="/mark.svg?v=20260924b" alt="" class="brand-mark" width="40" height="40">
    <span class="brand-text">Coaster <b>Hub</b></span>
  </a>
  <nav class="links">
    <a href="/" data-nav="riders">Home</a>
    <a href="/explore" data-nav="explore">Explore</a>
    <a href="/log" data-nav="log" class="navlog">+ Log</a>
    <a href="/rankings" data-nav="rankings">Rankings</a>
    <a href="/account" data-nav="profile">Me</a>
  </nav>
  <div class="people" id="people"></div>
</div></header>

<section class="hero compact" style="--hero-t:30px;--hero-b:20px"><div class="container">
  <h1 class="wide">Trips</h1>
  <p id="hero_p">Every saved trip, last edited first.</p>
</div></section>

<section class="block" style="padding-top:20px"><div class="container trips">
  <div class="tqrow">
    <input id="tq" class="tq" type="search" placeholder="Search trips by name, park or rider&hellip;" autocomplete="off" aria-label="Search trips">
    <a class="btn" href="/trip?new=1">+ Plan a new trip</a>
  </div>
  <div class="alltrips" id="alltrips"><p class="atnone" data-loading>Loading&hellip;</p></div>
</div></section>

<footer class="site"><div class="container foot-inner">
  <div>&copy; <span id="y"></span> Coaster Hub &middot; coasterhub.org</div>
  <div><a href="/">Home</a> &nbsp;&middot;&nbsp; <a href="/coasters">Coasters</a> &nbsp;&middot;&nbsp; <a href="/parks">Parks</a> &nbsp;&middot;&nbsp; <a href="/manufacturers">Manufacturers</a> &nbsp;&middot;&nbsp; <a href="/locations">Locations</a> &nbsp;&middot;&nbsp; <a href="/map">Map</a> &nbsp;&middot;&nbsp; <a href="/sitemap">Sitemap</a> &nbsp;&middot;&nbsp; <a href="/terms">Terms</a> &nbsp;&middot;&nbsp; <a href="/privacy">Privacy</a><span data-contrib hidden></span></div>
</div></footer>

<script src="/app.js?v=20261127a"></script>
<script>
document.getElementById('y').textContent=new Date().getFullYear();
CoasterHub.initNav('trip');
var $=function(id){ return document.getElementById(id); };
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var TS=[];
function draw(){
  var q=$('tq').value.trim().toLowerCase();
  var hit=TS.filter(function(t){ return !q || t.hay.indexOf(q)>=0; });
  $('alltrips').innerHTML=hit.length ? hit.map(function(t){
    var shown=t.names.slice(0,4).map(esc).join(', ')+(t.names.length>4?' &amp; '+(t.names.length-4)+' more':'');
    return '<a class="atrip" href="/trip/'+encodeURIComponent(t.code)+'"><b>'+esc(t.name)+'</b>'
      +'<span class="ap">'+t.names.length+' park'+(t.names.length===1?'':'s')+(t.names.length?' &middot; '+shown:'')+'</span>'
      +(t.people.length?'<span class="aw">'+esc(t.people.join(', '))+'</span>':'')
      +(t.edited?'<span class="ae">Last edited '+esc(t.edited)+'</span>':'')+'</a>';
  }).join('') : '<p class="atnone">'+(TS.length?'No trips match.':'No saved trips yet.')+'</p>';
}
Promise.all([
  CoasterHub.fetchUsers().catch(function(){ return []; }),
  CoasterHub.fetchParks().catch(function(){ return {}; }),
  fetch('/api/trips').then(function(r){ return r.ok ? r.json() : null; })
]).then(function(rr){
  var who={}, by={};
  (rr[0]||[]).forEach(function(u){ who[u.slug]=u.name||u.slug; });
  Object.keys(rr[1]||{}).forEach(function(n){ by[CoasterHub.slugify(n)]=n; });
  TS=((rr[2] && rr[2].trips) || []).map(function(t){
    var names=t.parks.map(function(sl){ return by[sl]; }).filter(Boolean);
    var people=t.riders.map(function(sl){ return who[sl]; }).filter(Boolean);
    var ed=t.edited ? new Date(t.edited) : null;
    return { code:t.code, name:t.name, names:names, people:people,
      edited: ed && !isNaN(ed) ? ed.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '',
      hay:[t.name].concat(names, people).join(' ').toLowerCase() };
  });
  $('tq').oninput=draw;
  draw();
}).catch(function(){ $('alltrips').innerHTML='<p class="atnone">Couldn\u2019t load the trips.</p>'; });
</script>
</body>
</html>
