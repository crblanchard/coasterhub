<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- Add to home screen (2026-09-27): opens full-screen with its own icon. See site.webmanifest. -->
<link rel="manifest" href="/site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coaster Hub">
<base href="/">
<title>Admin — Coaster Hub</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css?v=20261031g">
<script>/* theme: set before paint so the page never flashes the wrong one (see initTheme in app.js). The device's light or dark setting; on a desktop, the toggle's choice if one was made (2026-10-30). */try{var chT=matchMedia("(min-width:681px)").matches?localStorage.getItem("ch_theme"):null}catch(e){}if(chT!=="dark"&&(chT==="light"||!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)))document.documentElement.setAttribute("data-theme","light");/* In the iPhone/Android app (capacitor.config.json appendUserAgent), marked before anything renders (2026-10-31). */if(/CoasterHubApp/.test(navigator.userAgent))document.documentElement.className+=" inapp"</script>
<link rel="icon" href="/favicon.svg?v=20260924b" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=20260924b" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16.png?v=20260924b" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260924b">
<style>
  /* /admin (2026-11-03): Carter's private dashboard. Starts with who was last
     on; more site info gets added here as panels. Admin accounts only — the
     API refuses everyone else, this page just says so politely. */
  .adtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 26px}
  @media (min-width:700px){ .adtiles{grid-template-columns:repeat(4,minmax(0,1fr))} }
  .adtile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .adtile b{display:block;font-size:1.55rem;line-height:1.1;font-variant-numeric:tabular-nums}
  .adtile span{color:var(--muted);font-size:.8rem}
  .adhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 10px}
  .adhead h2{font-size:1.15rem;margin:0}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--muted);padding:8px 12px;cursor:pointer;font-size:.85rem;font-family:inherit}
  .seg button.on{background:var(--tint2);color:var(--fg)}
  .adwho{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 14px;border-top:1px solid var(--line);align-items:center}
  .wrow:first-child{border-top:0}
  .wrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--fg);text-decoration:none}
  .wrow .nm small{font-weight:400;color:var(--muted);margin-left:6px}
  .wrow .when{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .wrow .when.fresh{color:var(--accent2);font-weight:600}
  .wrow .meta{grid-column:1 / -1;color:var(--muted);font-size:.82rem}
  .wrow.noacct .when{color:var(--muted)}
  .gate{color:var(--muted)}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="/">
    <img src="/mark.svg?v=20260924b" alt="" class="brand-mark" width="40" height="40">
    <span class="brand-text">Coaster <b>Hub</b></span>
  </a>
  <nav class="links">
    <a href="/" data-nav="riders">Home</a>
    <a href="/explore" data-nav="explore">Explore</a>
    <a href="/log" data-nav="log" class="navlog">+ Log</a>
    <a href="/rankings" data-nav="rankings">Rankings</a>
    <a href="/account" data-nav="profile">Me</a>
  </nav>
  <div class="people" id="people"></div>
</div></header>

<section class="hero compact" style="--hero-t:30px;--hero-b:20px"><div class="container">
  <h1 class="wide">Admin</h1>
</div></section>

<section class="block" style="padding-top:20px"><div class="container">
  <div id="gate" class="gate" data-loading>Loading&hellip;</div>
  <div id="dash" hidden>
    <div class="adtiles" id="tiles"></div>
    <div class="adhead">
      <h2>Riders</h2>
      <div class="seg" id="sort">
        <button data-s="seen" class="on">Last active</button>
        <button data-s="credits">Credits</button>
        <button data-s="joined">Newest</button>
      </div>
    </div>
    <div class="adwho" id="who"></div>
  </div>
</div></section>

<footer class="site"><div class="container foot-inner">
  <div>&copy; <span id="y"></span> Coaster Hub &middot; coasterhub.org</div>
  <div><a href="/">Home</a> &nbsp;&middot;&nbsp; <a href="/coasters">Coasters</a> &nbsp;&middot;&nbsp; <a href="/parks">Parks</a> &nbsp;&middot;&nbsp; <a href="/manufacturers">Manufacturers</a> &nbsp;&middot;&nbsp; <a href="/locations">Locations</a> &nbsp;&middot;&nbsp; <a href="/map">Map</a> &nbsp;&middot;&nbsp; <a href="/sitemap">Sitemap</a> &nbsp;&middot;&nbsp; <a href="/terms">Terms</a> &nbsp;&middot;&nbsp; <a href="/privacy">Privacy</a><span data-contrib hidden></span></div>
</div></footer>

<script src="/app.js?v=20261104a"></script>
<script>
document.getElementById('y').textContent = new Date().getFullYear();
CoasterHub.initNav('admin');
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function nf(n){ return Number(n || 0).toLocaleString(); }
// D1 writes "YYYY-MM-DD HH:MM:SS" in UTC.
function when(s){ return s ? new Date(s.replace(' ', 'T') + (s.length > 10 && !/Z$/.test(s) ? 'Z' : '')) : null; }
function ago(d){
  if (!d) return '';
  var m = Math.round((Date.now() - d.getTime()) / 60000);
  if (m < 60) return m <= 1 ? 'just now' : m + 'm ago';
  var h = Math.round(m / 60); if (h < 24) return h + 'h ago';
  var dd = Math.round(h / 24); if (dd < 30) return dd + 'd ago';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
}
function day(s){ var d = when(s); return d ? d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : ''; }

var DATA = null, SORT = 'seen';
function draw(){
  var t = DATA.totals;
  $('tiles').innerHTML = [
    [t.active.day, 'active today'], [t.active.week, 'active this week'], [t.active.month, 'active this month'],
    [t.accounts, 'accounts'], [t.riders, 'riders'], [t.rides, 'rides logged'],
    [t.coasters, 'coasters'], [t.parks, 'parks']
  ].map(function(x){ return '<div class="adtile"><b>' + nf(x[0]) + '</b><span>' + x[1] + '</span></div>'; }).join('');
  var list = DATA.riders.slice();
  list.sort(function(a, b){
    if (SORT === 'credits') return b.credits - a.credits;
    var k = SORT === 'joined' ? 'joined' : 'seen';
    return (b[k] || '').localeCompare(a[k] || '') || (b.credits - a.credits);
  });
  $('who').innerHTML = list.map(function(r){
    var d = when(r.seen), fresh = d && Date.now() - d.getTime() < 864e5;
    var bits = [nf(r.credits) + ' credits', nf(r.ranked) + ' ranked'];
    if (r.lastride) bits.push('last ride ' + day(r.lastride));
    if (r.joined) bits.push('joined ' + day(r.joined));
    if (r.admin) bits.push('admin');
    return '<div class="wrow' + (r.account ? '' : ' noacct') + '">'
      + '<a class="nm" href="/user/' + encodeURIComponent(r.slug) + '">' + esc(r.name || r.slug) + '<small>@' + esc(r.slug) + '</small></a>'
      + '<span class="when' + (fresh ? ' fresh' : '') + '"' + (d ? ' title="' + esc(d.toLocaleString()) + '"' : '') + '>'
      + (r.account ? (d ? ago(d) : 'never') : 'no account') + '</span>'
      + '<div class="meta">' + bits.join(' &middot; ') + '</div></div>';
  }).join('');
}
$('sort').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b || !DATA) return;
  SORT = b.getAttribute('data-s');
  [].forEach.call($('sort').children, function(x){ x.classList.toggle('on', x === b); });
  draw();
});

fetch('/api/admin/overview', { credentials: 'same-origin' })
  .then(function(r){ return r.json().then(function(d){ return { status: r.status, d: d }; }); })
  .then(function(x){
    if (x.status === 401) { $('gate').innerHTML = 'Admins only. <a href="/account" style="color:var(--accent2)">Sign in</a> with an admin account to see this.'; return; }
    if (!x.d || !x.d.ok) { $('gate').textContent = (x.d && x.d.error) || 'Couldn\u2019t load the dashboard.'; return; }
    DATA = x.d; $('gate').hidden = true; $('dash').hidden = false; draw();
  })
  .catch(function(){ $('gate').textContent = 'Couldn\u2019t load the dashboard.'; });
</script>
</body>
</html>
